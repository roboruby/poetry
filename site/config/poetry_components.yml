components: {}
# The .cn-* override contract: every host stylesheet that restyles
# theme-owned cn-* classes is declared here - dated, reasoned, scoped.
# Verify: bin/rails poetry:design:overrides (STRICT=1 in CI).
overrides:
  - cn: "*"
    files: ["app/assets/tailwind/styles/style-*.css"]
    reason: "The docs style switcher renders ALL NINE themes as .style-<name>-scoped
      copies (generated by script/build_style_registry.rb) - an app installs
      one theme; this site deliberately ships every fragment."
    created: 2026-07-18
