# Herb toolchain configuration (linter / formatter / language server).
# https://herb-tools.dev/configuration
#
# Rules are version-gated: a newer linter never enables new rules here
# until `version` is bumped deliberately (bump + re-lint in one change).
version: 0.11.0

framework: actionview
# Every template is gated to compile under Herb::Engine (HerbCompileTest),
# the stricter of the two engines Rails can run.
template_engine: herb

linter:
  enabled: true
  rules:
    # `render` takes a component instance here (`<%= render field %>`): a
    # renderable, not a record whose partial Rails derives from
    # `to_partial_path`. The rule cannot tell the two apart.
    actionview-no-implicit-partial:
      enabled: false
    # A block parameter named after the component that yields it
    # (`<%= poetry_select do |select| %>`) is the idiom every example
    # teaches: inside the block the builder is what the name means.
    actionview-no-helper-shadowing:
      enabled: false
    # A form inside a block helper (`<%= poetry_sheet do %><%= form_with
    # ... %>`) is reported as nested in another form - marcoroth/herb#2708.
    # Switch the rule back on when it lands.
    html-no-nested-forms:
      enabled: false
    # The form examples carry their model inline, class and all, so the
    # sample a reader copies is whole.
    erb-no-method-definitions:
      exclude:
        - "app/views/examples/docs/forms/**/*"
    # A gallery page renders its extra sections by section and slug
    # (docs/extras/<section>/_<slug>), guarded by lookup_context.exists?.
    actionview-no-dynamic-partial-path:
      exclude:
        - "app/views/docs/page.html.erb"
    # The demo compositions and the pagination examples are controller-fed
    # (ExampleData prepares their state); the ivars ARE the demo's state,
    # not a partial contract to tighten.
    erb-no-instance-variables-in-partials:
      exclude:
        - "app/views/examples/demos/**/*"
        - "app/views/examples/docs/pagination/**/*"
    # The typography recipe is byte-transcribed from upstream shadcn
    # (same carve-out as the DesignLint skip ledger) - its `href="#"` is
    # upstream's own.
    html-anchor-require-href:
      exclude:
        - "app/views/examples/docs/typography/_default.html.erb"
    # No Content-Security-Policy is configured on the docs host, so a nonce
    # has nothing to bind to; the pre-paint theme boot stays inline by
    # design. Re-enable with the CSP.
    html-require-script-nonce:
      enabled: false

formatter:
  enabled: false
