plugins:
  - rubocop-performance
  - rubocop-minitest
  - rubocop-rake
  - rubocop-yard

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "*.gemspec"
    # Rake namespace blocks are naturally long task lists.
    - "rakelib/**/*.rake"

# YARD tags are the contract the docs, the skill and the agents read;
# the long collection form (Array<String>) is the house style.
YARD/CollectionStyle:
  EnforcedStyle: long
