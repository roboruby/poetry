# poetry component registry - generated by `bin/rake registry:generate` FROM SOURCE.
# DO NOT EDIT: CI verifies this file matches a fresh build (rake registry:verify).
---
components:
  poetry/island/island:
    class_name: Poetry::Island::Island::Component
    identifier: poetry--island--island
    bem_block: poetry-island-island
    styles: []
    options:
    - name: import
      type: string
      required: true
      description: The importmap specifier of the island's module, which exports mount(element,
        props).
    - name: mode
      type: symbol
      variants:
      - fill
      - flow
      default: fill
      description: fill paints the shell's box (a canvas, a map, a scene); flow takes
        the shell's place in the page (an editor).
    - name: name
      type: string
      description: 'A form field name: renders a hidden input inside the island, props.input,
        for the module to write its state to.'
    - name: props
      type:
      default: {}
      description: What the module mounts with, a Hash serialized as JSON.
    - name: value
      type: string
      description: The hidden input's initial value.
    slots: []
    helper: poetry_island
    description: 'A bounded client mount: a module from the importmap takes over a
      server-rendered shell, for a widget whose state lives on the client.'
    elements:
    - shell
    - shell_fill
    - shell_flow
    capsule: 0d894c58767d
    controllers:
    - identifier: poetry--island--island
      targets:
      - input
      - shell
      values:
      - import
      - mode
      actions:
      - mount
      - unmount
      events:
      - error
      - mount
    agent_rules:
    - An island is the exception, for client-owned state that changes many times a
      second (an editor, a canvas, a map, a 3D scene); anything else is a component
      with a Stimulus behavior.
    - 'The block is the shell: what a reader gets before the module mounts and whenever
      it cannot, and in fill mode the box the island paints. Put the content a reader
      needs there, never nothing.'
    - 'State that must outlive the page leaves through the form: name: renders a hidden
      input inside the island, and the module writes to props.input.'
    - 'import: is an importmap specifier the host pins (app/javascript/islands/map.js
      is islands/map); poetry check warns when config/importmap.rb does not.'
    content: true
    identity: false
    parts:
    - name: island
      description: 'The island: the shell, the hidden input, the props, then the root
        the module mounts in'
    - name: island-shell
      description: The server-rendered content the island takes over
    - name: island-input
      description: 'The hidden input the module writes its state to, with name:'
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--island--island
        registers: true
        values:
        - name: import
        - name: mode
    - element: shell
      controllers:
      - identifier: poetry--island--island
        targets:
        - name: shell
    - element: input
      controllers:
      - identifier: poetry--island--island
        targets:
        - name: input
helper_args:
  poetry_island: 0
