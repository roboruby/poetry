plugins:
  - rubocop-performance
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "*.gemspec"

Naming/FileName:
  # lib/poetry-core.rb is the hyphenated Bundler auto-require entrypoint for the
  # Poetry::Core namespace; its name must match the gem, not snake_case.
  Exclude:
    - "lib/poetry-core.rb"

# --- poetry-core framework port ---------------------------------------------
# The framework layer is ported intact from view_component_plus (which used
# `standard`). A few RuboCop defaults flag legitimate, proven patterns in that
# ported code; relax the advisory cops rather than refactor battle-tested logic.

# The ported code is thoroughly YARD-documented, but on the inner modules/classes
# rather than the compact `module Poetry::Core` namespace wrappers.
Style/Documentation:
  Enabled: false

# The fox_tail-derived attribute/stimulus merging methods are inherently dense.
Metrics/AbcSize:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false

# `has_attribute?` is part of the public HTML::Attributes contract.
Naming/PredicatePrefix:
  AllowedMethods:
    - has_attribute?

# Comprehensive, multi-assertion unit tests are intentional.
Minitest/MultipleAssertions:
  Enabled: false
