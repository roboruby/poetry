name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded CI runs: a newer push to the same branch/PR kills the
# in-flight run for that ref so we don't burn minutes on commits already dead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4"
          - "4.0"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task (test + rubocop)
        run: bundle exec rake

  audit:
    runs-on: ubuntu-latest
    name: bundle audit
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Audit dependencies for known CVEs
        run: bundle exec bundle-audit check --update

  herb:
    runs-on: ubuntu-latest
    name: Herb lint
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint HTML+ERB templates (.herb.yml pins the linter version and rules)
        run: npx --yes @herb-tools/linter@0.10.3 app

  javascript:
    name: JavaScript (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
