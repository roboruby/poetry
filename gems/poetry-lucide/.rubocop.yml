plugins:
  - rubocop-performance
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "*.gemspec"
    # ActiveSupport::Concern `class_methods do ... end` blocks carry the ported DSL.
    - "app/components/poetry/core/concerns/*.rb"
    # Rake namespace blocks are naturally long task lists.
    - "rakelib/**/*.rake"

Naming/FileName:
  # lib/poetry-core.rb is the hyphenated Bundler auto-require entrypoint for the
  # Poetry::Core namespace; its name must match the gem, not snake_case.
  Exclude:
    - "lib/poetry-lucide.rb"

# --- poetry-core framework port ---------------------------------------------
# The framework layer is ported intact from view_component_plus (which used
# `standard`). A few RuboCop defaults flag legitimate, proven patterns in that
# ported code; relax the advisory cops rather than refactor battle-tested logic.

# The ported code is thoroughly YARD-documented, but on the inner modules/classes
# rather than the compact `module Poetry::Core` namespace wrappers.
Style/Documentation:
  Enabled: false

# The fox_tail-derived attribute/stimulus merging methods are inherently dense.
Metrics/AbcSize:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false

# The Tokens::Color API is keyed on the OKLCH color axes; `l`/`c`/`h` are the
# domain-standard names (defaults for this cop kept, plus the three axes).
Naming/MethodParameterName:
  AllowedNames: ["as", "at", "by", "cc", "db", "id", "if", "in", "io", "ip", "of", "on", "os", "pp", "to", "l", "c", "h"]

# `has_attribute?` is part of the public HTML::Attributes contract; the
# `has_*_attribute?` predicates are part of the public Styles/Options DSL contract.
Naming/PredicatePrefix:
  AllowedMethods:
    - has_attribute?
    - has_style_attribute?
    - has_option_attribute?

# Comprehensive, multi-assertion unit tests are intentional.
Minitest/MultipleAssertions:
  Enabled: false
