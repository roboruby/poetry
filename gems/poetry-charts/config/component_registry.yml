    - name: chart-reference
      description: The reference-mark group (with_reference_line/_area/_dot), painted
        above the series
    - name: chart-x-axis
      description: The x-axis tick-label group (with_x_axis)
    - name: chart-y-axis
      description: The y-axis tick-label group (with_y_axis)
    - name: chart-coordinates
      description: The embedded per-index geometry payload (<script type=application/json>)
        the tooltip controller reads - zero chart math in the browser
  poetry/charts/tooltip_content:
    class_name: Poetry::Charts::TooltipContent::Component
    identifier: poetry--charts--tooltip_content
    bem_block: poetry-charts-tooltip_content
    styles: []
    options:
    - name: config
      type:
      required: true
    - name: hide_indicator
      type: boolean
      default: false
    - name: hide_label
      type: boolean
      default: false
    - name: indicator
      type: symbol
      variants:
      - dot
      - line
      - dashed
      default: dot
    - name: items
      type:
      required: true
    - name: label
      type: string
    slots: []
    elements:
    - label
    - inner
    - row
    - row_dot
    - indicator
    - indicator_dot
    - indicator_line
    - indicator_dashed
    - indicator_dashed_nested
    - value_wrap
    - value_wrap_center
    - value_wrap_end
    - name
    - value
    capsule: 74b8c24f20d2
    agent_rules:
    - Tooltip rows resolve names/colors through the chart config - pass key:, not
      a display string.
    - 'indicator: :dot (default) | :line | :dashed matches the shadcn variants.'
    - Numeric values render delimited (1,234) in the mono tabular column automatically.
    parts:
    - name: chart-tooltip-content
      description: The tooltip box (<div>) - the styled chrome the chart's tooltip
        controller positions and text-swaps
    - name: chart-tooltip-label
      description: The category label (<div>) - above the rows, or nested inside the
        single row for line/dashed indicators
    - name: chart-tooltip-item
      description: One series row (<div>) - indicator + name + value
      states:
      - attr: data-key
        condition: always - the series key the controller matches values by
    - name: chart-tooltip-indicator
      description: The row's swatch (<div>) - dot/line/dashed per indicator:, hidden
        with hide_indicator
      vars:
      - name: "--color-bg"
        description: the swatch fill - carries the row's series color (inline; polar
          charts retint it to the hovered slice's color at runtime)
      - name: "--color-border"
        description: the swatch border - the same series color as the fill
    - name: chart-tooltip-name
      description: The series name (<span>) - resolved through the chart config
    - name: chart-tooltip-value
      description: The formatted value (<span>) - the mono tabular column, numbers
        delimited
