  poetry/charts/container:
    class_name: Poetry::Charts::Container::Component
    identifier: poetry--charts--container
    bem_block: poetry-charts-container
    styles: []
    options:
    - name: config
      type:
      required: true
    - name: id
      type: string
    slots: []
    elements: []
    capsule: 7b90eeaff974
    agent_rules:
    - Every chart lives inside poetry_chart_container(config:) - the config maps series
      keys to labels/colors.
    - Reference series colors as var(--color-<key>); never hard-code a color in chart
      markup.
    - 'Config colors point at theme tokens (var(--chart-1..5)) or use theme: { light:,
      dark: } maps.'
    - 'Give charts an explicit id: when the page renders more than one of the same
      chart.'
    parts:
    - name: chart
      description: The chart frame (<div>) - the aspect-video chrome, the tooltip
        layer's positioning anchor, and the id scope the per-series colors are emitted
        for
      states:
      - attr: data-chart
        condition: 'always - the chart instance id (explicit id: or unique per render);
          the scoped color emission keys off it'
      vars:
      - name: "--color-*"
        description: per-series color, one entry per series key - the frame's <style>
          block emits them for [data-chart=<id>] in both themes
