    ".cn-alert":
      reason: The source's row-span icon skeleton is re-expressed as a phantom-column
        grid (grid-cols-[0_1fr] + unconditional col-start-2); the gap is y-only against
        that skeleton.
      dropped:
      - "*:[svg:not([class*='size-'])]:size-4"
      - "*:[svg]:row-span-2"
      - "*:[svg]:text-current"
      - "*:[svg]:translate-y-0.5"
      - gap-0.5
      added:
      - "[&>svg]:size-4"
      - "[&>svg]:text-current"
      - "[&>svg]:translate-y-0.5"
      - gap-y-0.5
      - grid-cols-[0_1fr]
      - items-start
    ".cn-alert-description":
      reason: Unconditional col-start-2 replaces the source's group-has gate - the
        phantom-column grid makes it always correct.
      added:
      - col-start-2
    ".cn-alert-dialog-content":
      reason: The pair doctrine (data-open/data-closed) carries enter and exit clusters;
        the shared controller holds the close through the exit animation.
