# Theme transcription-fidelity deviations - the single source of truth for
# every way a ported theme differs from its source at the port pin
# (config/theme_fidelity/upstream-<pin>.json). css:verify_fidelity holds
# this file and the actual diff in exact two-way agreement: an unrecorded
# deviation fails, and a recorded deviation that no longer exists fails as
# stale. Change a theme -> reconcile this file in the same change, with a
# reason. Bumping the pin regenerates the snapshot (css:fidelity_snapshot)
# and re-opens every entry for review.
#
# Cross-cutting translation doctrines the entries lean on:
#   - state pairs: data-[state=open|closed|on|selected] -> poetry's
#     data-open/data-closed/data-pressed/data-selected attributes
#   - selector shapes: the source's *:[svg]/**: descendant forms vs
#     poetry's [&_svg]/[&>svg] forms, and ! suffix differences
#   - mechanism renames: the source's drawer/command internals
#     (direction/measure attributes) -> poetry's own attributes
#   - relocation: structural classes carried by the component Style
#     dictionaries or templates instead of theme CSS
# Seeded 2026-08-24 from the full fidelity review.

