    class_name: Poetry::Ui::Slider::Component
    identifier: poetry--ui--slider
    bem_block: poetry-ui-slider
    styles: []
    options:
    - name: described_by
      type: string
      description: Field hint/error wiring -> aria-describedby on EACH thumb.
    - name: disabled
      type: boolean
      default: false
      description: Renders the control inert; the hidden inputs still submit the server
        value.
    - name: inverted
      type: boolean
      default: false
      description: Flips the value direction along the axis; composes with RTL (both
        = ltr math).
    - name: label
      type:
      description: Per-thumb accessible names -> aria-label; range REQUIRES two. Alternatively
        labelled_by (external wiring). Enforced.
    - name: labelled_by
      type: string
      description: aria-labelledby for the thumb(s) - the Field-wrapped single slider
        derives its name from the field label this way.
    - name: max
      type: float
      default: 100.0
      description: The track's upper bound; must exceed min:.
    - name: min
      type: float
      default: 0.0
      description: The track's lower bound.
    - name: min_steps_between_thumbs
      type: integer
      default: 0
      description: 'Range-mode minimum gap in STEPS: high - low >= n*step; thumbs
        can never cross.'
    - name: name
      type: string
      required: true
      description: Form name; single thumb -> name; range -> name + "[]" per input
        (the Rails array-param convention).
    - name: orientation
      type: symbol
      variants:
      - horizontal
      - vertical
      default: horizontal
      description: The track axis.
    - name: step
      type: float
      default: 1.0
      description: Snap increment; decimal steps supported (precision-aware rounding
        lives in the controller's math core).
    - name: value
      type:
      description: Single-thumb value. ArgumentError if given with values:.
    - name: value_text
      type:
      description: 'aria-valuetext formatter: a proc (v -> "$200") or an i18n key
        with %{value}; optional - falls back to the bare number.'
    - name: values
      type:
      description: 'Range mode: [low, high] -> two thumbs, sorted. ArgumentError if
        given with value:, unsorted, or length != 2.'
    slots: []
    description: An input for selecting a value or range along a track.
    elements:
    - track
    - range
    - thumb
    - anchor
    - anchor_start
    - anchor_end
    - anchor_mid
    capsule: 8e986162e801
    controllers:
    - identifier: poetry--core--slider
      targets:
      - input
      - range
      - thumb
      - track
      values:
      - inverted
      - max
      - min
      - minStepsBetweenThumbs
      - orientation
      - step
      - value
      actions:
      - keydown
      - pointerdown
      - setValue
      - valueValueChanged
      events:
      - poetry:slider:change
      - poetry:slider:commit
    agent_rules:
    - Use poetry_slider / form.slider - never hand-roll a draggable div.
    - 'Every thumb MUST have a distinct accessible name (label: - array of two for
      ranges). ArgumentError otherwise.'
    - 'Give value_text: whenever the number alone is meaningless (''$200'', ''80%'')
      - SR users hear aria-valuetext.'
    - 'Range mode: values must be sorted [low, high]; use min_steps_between_thumbs
      to keep a meaningful gap.'
    - Do not use Slider for precise known-number entry (use Input type=number) or
      in no-JS-required forms (native input type=range).
    - Debounce on poetry:slider:commit, never on :change (change fires every drag
      frame).
    - Never transition the thumb/range position with CSS - geometry must track the
      pointer.
    parts:
    - name: slider
      description: Root - the controller, the geometry vars, and pointer capture ride
        here
      states:
      - attr: data-orientation
        condition: always - the axis
        values:
        - horizontal
        - vertical
      - attr: data-disabled
        condition: 'disabled: is set (the control is inert; the hidden inputs still
          submit)'
      - attr: data-dragging
        condition: a pointer drag is in flight (the controller sets it for the gesture;
          never rendered server-side)
      vars:
      - name: "--slider-start"
        description: the filled range's start edge as a percentage - server-rendered
          (no first-paint jump), rewritten by the controller on every move
      - name: "--slider-end"
        description: the filled range's end edge as a percentage (the single-thumb
          value rides here)
    - name: slider-track
      description: The full-length rail the range paints over
      states:
      - attr: data-orientation
        condition: always - mirrors the root
        values:
        - horizontal
        - vertical
    - name: slider-range
      description: The filled span between --slider-start and --slider-end
      states:
      - attr: data-orientation
        condition: always - mirrors the root
        values:
        - horizontal
        - vertical
    - name: slider-anchor
      description: Absolutely positioned thumb wrapper (one per thumb, with its hidden
        input alongside) seated on the geometry vars
      states:
      - attr: data-orientation
        condition: always - mirrors the root
        values:
        - horizontal
        - vertical
    - name: slider-thumb
      description: The role=slider handle - its own Tab stop, carrying the aria-value*
        surface (bounds neighbor-clamped in range mode)
      states:
      - attr: data-orientation
        condition: always - mirrors the root
        values:
        - horizontal
        - vertical
      - attr: data-disabled
        condition: 'disabled: is set (tabindex drops to -1)'
      - attr: data-dragging
        condition: this thumb is the one being dragged (the controller pairs it with
          the root's)
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--slider
        registers: true
        values:
        - name: min
        - name: max
        - name: step
        - name: value
        - name: min_steps_between_thumbs
        - name: orientation
        - name: inverted
        actions:
        - method: pointerdown
          'on': pointerdown
    - element: track
      controllers:
      - identifier: poetry--core--slider
        targets:
        - name: track
    - element: range
      controllers:
      - identifier: poetry--core--slider
        targets:
        - name: range
    - element: thumb
      controllers:
      - identifier: poetry--core--slider
        targets:
        - name: thumb
        actions:
        - method: keydown
          'on': keydown
    - element: input
      controllers:
      - identifier: poetry--core--slider
        targets:
        - name: input
  poetry/ui/spinner:
    class_name: Poetry::Ui::Spinner::Component
    identifier: poetry--ui--spinner
    bem_block: poetry-ui-spinner
    styles: []
    options:
    - name: label
      type: string
      default: Loading
      description: What assistive tech announces - name the loading context.
    slots: []
    description: An indeterminate loading indicator that announces itself.
    elements: []
    capsule: 547c232b9575
    agent_rules:
    - Spinner announces itself (role=status + aria-label) - never a bare spinning
      div.
    - 'Set label: for the loading context (''Saving…''); the default is ''Loading''.'
