    description: A menu of actions or options triggered by a button.
    elements:
    - content
    - item
    - checkbox_item
    - radio_item
    - label
    - separator
    - shortcut
    - sub_trigger
    - sub_content
    - item_indicator
    - item_indicator_state
    - indicator_check
    - indicator_circle
    - sub_indicator
