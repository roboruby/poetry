      - poetry:sidebar:toggle
    agent_rules:
    - 'Wrap the WHOLE shell: with_nav is the sidebar column, with_inset is the page
      area (the trigger lives in the inset).'
    - 'Read the persisted state server-side - open: cookies[:sidebar_state] != "false"
