          can restore it'
    - name: combobox-content
      description: The popper-positioned popup housing the embedded Command anatomy
        - open/closed and the resolved placement ride here
      states:
      - attr: data-open
        condition: popup is open (the controller flips the pair at runtime)
      - attr: data-closed
        condition: popup is closed or animating out (the server-rendered state)
      - attr: data-side
        condition: the placement side - server-rendered from side:, rewritten to the
          resolved side by popper on open
        values:
        - top
        - right
        - bottom
        - left
      - attr: data-align
        condition: the placement alignment - server-rendered from align:, rewritten
          by popper on open
        values:
        - start
        - center
        - end
      vars:
      - name: "--transform-origin"
        description: popper - the animation origin matching the resolved placement
      - name: "--available-width"
        description: popper - viewport space available to the popup post-flip
      - name: "--available-height"
        description: popper - viewport space available to the popup post-flip
      - name: "--anchor-width"
        description: popper - the trigger's measured width (the popup width tracks
          it - one knob, two surfaces)
      - name: "--anchor-height"
        description: popper - the trigger's measured height
    - name: combobox-clear
      description: 'The show_clear: deselection X - a trigger sibling seated over
        the chevron slot; pressing it commits the blank value and returns focus to
        the trigger. Wears the html hidden attribute while no value is committed (the
        controller flips it on every commit; the chevron swap derives from that one
        flip in CSS)'
    - name: command
      description: The embedded engine root - Command's anatomy rendered here against
        its own controller (composition at the markup contract)
    - name: command-input-wrapper
      description: The input row - search icon + filter input above the list
    - name: command-search-icon
      description: Decorative search glyph beside the input
    - name: command-input
      description: 'The filter input (role=combobox) - the typing session and aria-activedescendant
        live here. Single: in the popup with its own accessible name; multiple: INLINE
        in the chips frame (Base UI''s input-inside layout), where the field label
        reaches it'
      states:
      - attr: data-popup-open
        condition: 'multiple: the popup is open (bare while open, absent while closed
          - the input carries the flip; single''s trigger owns it)'
    - name: command-list
      description: THE role=listbox - the aria-controls target of both combobox roles
    - name: command-empty
      description: Zero-matches message - rendered hidden; the engine unhides it when
        the filter pass leaves no visible items
    - name: command-group
      description: role=group labelled by its heading - hidden by the engine when
        every member item is filtered out
    - name: command-group-heading
      description: The group heading - styled, no ARIA role (the group points at it
        via aria-labelledby)
    - name: command-item
      description: One role=option div wearing BOTH meanings - a Command item (filtering
        + highlight) AND Select's committed-value surface
      states:
      - attr: data-value
        condition: always - the option's committable value (the native <option> twin)
      - attr: data-selected
        condition: the option is committed (bare; absent while unselected - the controller
          twin-writes it with aria-selected)
      - attr: data-highlighted
        condition: the item holds the activedescendant highlight (the server seeds
          it; the engine moves it with the input's aria-activedescendant)
      - attr: data-disabled
        condition: 'disabled: is set (aria-disabled rides along)'
      - attr: data-hidden
        condition: the filter scored the item zero (the engine pairs it with hidden;
          never rendered server-side)
    - name: command-item-text
      description: The option's label span - the filter/typematch text source
    - name: combobox-item-indicator
      description: The trailing committed-value check (ms-auto per the demo) - the
        parent item's data-selected absence hides it
    - name: command-separator
      description: role=separator divider - hidden by the engine whenever the query
        is non-empty
    - name: command-status
      description: The engine's sr-only polite result-count live region
      states:
      - attr: data-zero
        condition: always - the localized zero-results template
      - attr: data-one
        condition: always - the localized one-result template
      - attr: data-other
        condition: always - the localized many-results template (a literal count placeholder
          the controller interpolates)
    - name: combobox-chips
      description: 'The chips FIELD frame (multiple: only) - the popper anchor replacing
        the trigger; chips + the inline input flex-wrap inside, and role=toolbar rides
        it only while it holds >=1 chip'
      states:
      - attr: data-placeholder
        condition: the selection is empty (bare; the controller flips it on every
          commit - the toolbar role departs with it)
      - attr: data-disabled
        condition: 'disabled: is set - every chip mutation is gated'
      - attr: data-remove-label
        condition: always - the localized chip-remove template (a literal label placeholder
          the controller interpolates for client-built chips)
    - name: combobox-chip
      description: 'One committed value (multiple: only) - a div taking REAL focus
        (tabindex=-1, styled by :focus-visible; chips NEVER wear data-highlighted),
        named by its value text, holding the remove button'
      states:
      - attr: data-value
        condition: always - the chip's committed value (the native <option> twin)
      - attr: data-disabled
        condition: 'disabled: is set (chip focus is blocked entirely)'
    - name: combobox-chip-remove
      description: The chip's native remove button (tabindex=-1, labelled 'Remove
        <label>') - a press removes the value and is never a chips-area press
  poetry/ui/command:
    class_name: Poetry::Ui::Command::Component
    identifier: poetry--ui--command
    bem_block: poetry-ui-command
    styles: []
    options:
    - name: disabled
      type: boolean
      default: false
    - name: filter
      type: boolean
      default: true
    - name: id
      type: string
    - name: list_label
      type: string
      default: dynamic
    - name: loop
      type: boolean
      default: false
    - name: placeholder
      type: string
    - name: value
      type: string
    slots:
    - name: empty
      many: false
    - name: loading
      many: false
    - name: items
      many: true
      types:
      - item
      - group
      - separator
      setter_args:
        item: 0
        group: 0
        separator: 0
    description: A command palette for fast, keyboard-driven search and actions.
    elements:
    - input_wrapper
    - input
    - list
    - empty
    - loading
    - group
    - heading
    - item
    - item_text
    - shortcut
    - separator
    - status
    - sr_only
    - search_icon
    - dialog_content
    - dialog_overrides
    capsule: e73d58715288
    controllers:
    - identifier: poetry--core--command
      targets: []
      values:
      - debounce
      - filter
      - loop
      actions:
      - activate
      - filterInput
      - highlightItem
      - keydown
      - pointerHighlight
      - reset
      events:
      - poetry:command:filter
      - poetry:command:highlight
      - poetry:command:select
    agent_rules:
    - Use poetry_command - never hand-roll a filterable listbox with an input + a
      list and ad-hoc JS.
    - Command items DO things; they carry no form value. Picking a value for a form
      is Combobox (which wraps this) - never bind a hidden input to a bare Command.
    - 'Every item needs a unique value: (ArgumentError) and gets a server id - never
      strip item ids (aria-activedescendant depends on them).'
    - Never put tabindex or focus on options; never write aria-selected in a bare
      Command - highlight is data-highlighted + activedescendant only.
    - 'Filtering is hide-only: never reorder, remove, or re-append items to ''sort''
      results - DOM order is the contract.'
    - The poetry:command:select event is the ONLY activation surface - act in a listener
      (or item data-action); don't patch the controller to navigate.
    - 'Long/async data: filter: false + a Turbo frame (the recipe) - don''t render
      5,000 items and hope.'
    - 'Icon-rich labels: set filter_value:/keywords: rather than stuffing hidden text
      into items.'
    requires_any:
    - hint: the input's accessible name
      options:
      - id
      - aria-label
      - aria-labelledby
      - aria
    parts:
    - name: command
      description: Root of the palette - the input row over the listbox, carrying
        the engine controller
    - name: command-input-wrapper
      description: The input row - search icon + filter input above the list
    - name: command-search-icon
      description: Decorative search glyph beside the input
    - name: command-input
      description: The role=combobox filter input - real focus stays pinned here for
        the whole session; the highlight rides aria-activedescendant
    - name: command-list
      description: The role=listbox holding empty/loading/items - the input's aria-controls
        target
    - name: command-empty
      description: Zero-matches message - rendered hidden; the controller unhides
        it when the filter pass leaves no visible items
    - name: command-loading
      description: Pending affordance (role=status) - rendered hidden; the HOST toggles
        it (Turbo frame events), Command never does
    - name: command-group
      description: role=group labelled by its heading - hidden by the controller when
        every member item is filtered out
      states:
      - attr: data-always-render
        condition: 'always_render: is set - the group survives every filter pass'
    - name: command-group-heading
      description: The group heading - styled, no ARIA role (the group points at it
        via aria-labelledby)
    - name: command-item
      description: One role=option action row - highlight, filtering, and disablement
        ride here (never aria-selected in a bare Command)
      states:
      - attr: data-value
        condition: always - the item's unique value (its server-stable id follows
          registration order)
      - attr: data-highlighted
        condition: the item holds the highlight (bare; the controller twin-writes
          it with the input's aria-activedescendant)
      - attr: data-disabled
        condition: 'disabled: is set (aria-disabled rides along)'
      - attr: data-keywords
        condition: 'keywords: given - extra filter terms beyond the label'
      - attr: data-always-render
        condition: 'always_render: is set - the item survives every filter pass'
      - attr: data-hidden
        condition: the filter scored the item zero (the controller pairs it with hidden;
          never rendered server-side)
    - name: command-item-text
      description: The item's label span - the filter/typematch text source (shortcuts
        and icons excluded)
    - name: command-shortcut
      description: Presentational keyboard hint - excluded from the filter text; Command
        never binds the hinted key
    - name: command-separator
      description: Decorative divider (aria-hidden) - hidden by the controller whenever
        the query is non-empty
    - name: command-status
      description: The sr-only polite result-count live region - the controller writes
        the debounced count from the localized templates
      states:
      - attr: data-zero
        condition: always - the localized zero-results template
      - attr: data-one
        condition: always - the localized one-result template
      - attr: data-other
        condition: always - the localized many-results template (a literal count placeholder
          the controller interpolates)
