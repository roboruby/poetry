    identity: false
    parts:
    - name: toaster
      description: The toast viewport itself (<ol>, role=region, data-turbo-permanent)
        - the corner geometry and the Turbo Stream append target ride here
      states:
      - attr: data-position
        condition: always - the corner; each toast's slide direction keys off it via
          group/toaster
        values:
        - top-left
        - top-center
        - top-right
        - bottom-left
        - bottom-center
        - bottom-right
      - attr: data-poetry-top-layer
        condition: always - the dismissal layer exempts presses here, so clicking
          a toast never dismisses the overlay under it
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--toaster
        registers: true
        values:
        - name: hotkey
        - name: limit
        - name: position
  poetry/ui/toggle:
    class_name: Poetry::Ui::Toggle::Component
    identifier: poetry--ui--toggle
    bem_block: poetry-ui-toggle
    styles:
    - name: size
      type: symbol
      variants:
      - default
      - sm
      - lg
      default: default
      required: true
      description: The control's size axis.
    - name: variant
      type: symbol
      variants:
      - default
      - outline
      default: default
      required: true
      description: The visual treatment; :outline adds a border for standalone use.
    options:
    - name: disabled
      type: boolean
      default: false
      description: Disables the control and forwards to the native button.
    - name: label
      type: string
      description: 'REQUIRED when icon-only; must be state-INVARIANT (APG: aria-pressed
        carries the state - a flipping name makes SRs announce nonsense).'
    - name: pressed
      type: boolean
      default: false
      description: The server-rendered pressed state.
    slots: []
    description: A two-state button that can be pressed on or off.
    elements: []
    capsule: a33e1008fa61
    controllers:
    - identifier: poetry--core--pressed
      targets: []
      values: []
      actions:
      - press
      - set
      - toggle
      - unpress
      events:
      - poetry:toggle:change
    agent_rules:
    - Use poetry_toggle - never a Button with hand-managed aria-pressed.
    - 'Toggle is UI state, NOT form data: never try to submit it. Form value -> Checkbox;
      instant setting -> Switch; exclusive/grouped -> ToggleGroup.'
    - Icon-only toggles MUST pass label:, and the label must NOT change with state
      ('Bookmark', never 'Remove bookmark').
    - aria-pressed is the vocabulary - never aria-checked or aria-expanded on a Toggle.
    - Wire the EFFECT to poetry:toggle:change (or click) and revert via set(false)
      on failure - a pressed toggle whose effect failed is a lie.
    - Pressed visual is accent - don't override data-pressed colors per-instance (theme-level
      only).
    identity: false
    parts:
    - name: toggle
      description: The pressed-state <button> - the whole component; aria-pressed
        carries the state and the controller flips both together
      states:
      - attr: data-pressed
        condition: pressed (bare presence boolean - absent when unpressed, never data-pressed=false)
      - attr: data-disabled
        condition: disabled (rendered alongside native disabled for styling-hook parity)
      - attr: data-variant
        condition: the visual variant
        values:
        - default
        - outline
      - attr: data-size
        condition: the size
        values:
        - default
        - sm
        - lg
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--pressed
        registers: true
        actions:
        - method: toggle
          'on': click
  poetry/ui/toggle_group:
    class_name: Poetry::Ui::ToggleGroup::Component
    identifier: poetry--ui--toggle_group
    bem_block: poetry-ui-toggle_group
    styles:
    - name: size
      type: symbol
      variants:
      - default
      - sm
      - lg
      default: default
      required: true
      description: The shared Toggle size axis, cascaded from the root to every item
        (root wins).
    - name: variant
      type: symbol
      variants:
      - default
      - outline
      default: default
      required: true
      description: The shared Toggle variant axis, cascaded from the root to every
        item (root wins).
    options:
    - name: disabled
      type: boolean
      default: false
      description: Disables every item in the group.
    - name: label
      type: string
      description: The group's accessible name (aria-label) - a nameless radiogroup/toolbar
        logs a lint warning.
    - name: orientation
      type: symbol
      variants:
      - horizontal
      - vertical
      default: horizontal
      description: The roving axis; :vertical stacks the items and flips the arrow
        keys.
    - name: spacing
      type: integer
      default: 2
      description: 0 = the classic segmented control (joined corners, collapsed outline
        borders); >0 = free-standing items separated by that gap step.
    - name: type
      type: symbol
      default: single
      description: ":single keeps at most one item pressed; :multiple toggles items
        independently."
    - name: value
      type: string
      description: 'single: the pressed item''s value. ArgumentError with :multiple.'
    - name: values
      type: list
      default: dynamic
      description: 'multiple: the pressed items'' values. ArgumentError with :single.'
    slots:
    - name: items
      many: true
      description: 'Declares one item: value: (unique - duplicates raise), label:
        (required when icon-only), disabled:; the block is the content. Pressed state
        comes from value:/values:.'
      setter_args:
        item: 0
      yieldless:
      - item
    description: A set of toggle buttons for single or multiple selection.
    elements:
    - item
    capsule: e11a7d4ead18
    controllers:
    - identifier: poetry--core--roving-focus
      targets: []
      values:
      - loop
      - manageTabindex
      - orientation
      actions:
      - keydown
      events:
      - poetry--core--roving-focus:entry
    - identifier: poetry--core--toggle-group
      targets: []
      values:
      - type
      actions:
      - setValue
      - toggle
      events:
      - poetry:toggle-group:change
    agent_rules:
    - Use poetry_toggle_group - never hand-assemble Toggles with your own exclusivity
      logic.
    - 'ToggleGroup is UI state, NOT form data: submitting single-select -> RadioGroup;
      submitting multi-select -> Checkbox group. No name: exists; don''t route around
      it.'
    - 'Every item MUST have a unique value: (ArgumentError on duplicates); icon-only
      items MUST pass label: (state-invariant).'
    - 'Name the group via label: - a nameless radiogroup/toolbar fails the audit.'
    - Exclusive view/mode switching that shows PANELS is Tabs (aria-selected + tabpanels),
      not a single ToggleGroup.
    - 'Never mix vocabularies: single items carry aria-checked, multiple carry aria-pressed
      - the controller enforces it; agents patching DOM must too.'
    - single deselects to empty by re-press - if your UI needs always-one-selected,
      handle the empty change in the host.
    required_slots:
      item: at least one item
    identity: false
    parts:
    - name: toggle-group
      description: The role=radiogroup (single) / role=toolbar (multiple) root - the
        value-set machine and roving focus ride here; the axes cascade to items
      states:
      - attr: data-variant
        condition: the shared Toggle variant (root wins)
        values:
        - default
        - outline
      - attr: data-size
        condition: the shared Toggle size (root wins)
        values:
        - default
        - sm
        - lg
      - attr: data-spacing
        condition: the gap step - 0 is the segmented chain (joined corners), >0 free-standing
      - attr: data-orientation
        condition: the roving axis
        values:
        - horizontal
        - vertical
      - attr: data-disabled
        condition: the whole group is disabled (disables every item)
      vars:
      - name: "--gap"
        description: 'the item gap, set inline from spacing: - the root''s gap utility
          consumes it'
    - name: toggle-group-item
      description: One dumb <button> under the group machine - Toggle-styled, no per-item
        controller
      states:
      - attr: data-pressed
        condition: pressed (bare presence boolean - absent when off; the controller
          rederives the type-correct aria attribute from it)
      - attr: data-disabled
        condition: the item (or the whole group) is disabled - the roving-focus collection
          filter
      - attr: data-value
        condition: the item's key in the value set (always present, unique)
      - attr: data-variant
        condition: cascaded from the root
        values:
        - default
        - outline
      - attr: data-size
        condition: cascaded from the root
        values:
        - default
        - sm
        - lg
      - attr: data-spacing
        condition: cascaded from the root - keys the segmented corner/border chain
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--toggle-group
        registers: true
        values:
        - name: type
      - identifier: poetry--core--roving-focus
        registers: true
        values:
        - name: orientation
        - name: loop
        actions:
        - method: keydown
          'on': keydown
    - element: item
      controllers:
      - identifier: poetry--core--toggle-group
        actions:
        - method: toggle
          'on': click
  poetry/ui/toolbar:
    class_name: Poetry::Ui::Toolbar::Component
    identifier: poetry--ui--toolbar
    bem_block: poetry-ui-toolbar
    styles:
    - name: orientation
