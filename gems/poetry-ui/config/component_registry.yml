    - identifier: poetry--core--date-picker
      targets:
      - input
      - label
      values:
      - locale
      - mode
      - placeholder
      actions:
      - inputChanged
      - inputKeydown
      - picked
      events: []
    agent_rules:
    - 'name: is REQUIRED - the chosen date posts as an ISO string (the Calendar''s
      hidden input).'
    - 'value: preselects a date (a Date or ISO string) - the trigger shows it formatted,
      no JS needed.'
    - 'min:/max: bound the selectable range; the label + placeholder are the trigger''s
