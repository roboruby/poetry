      - attr: data-size
        condition: always - the resolved size (mirrors the wrapper)
        values:
        - default
        - sm
    - name: native-select-icon
      description: The decorative chevron wrapper - absolutely pinned, aria-hidden
    - name: native-select-option
      description: 'An <option> from the options: fast path (or poetry_native_select_option)
        - Canvas system colors keep the native dropdown legible'
  poetry/ui/navigation_menu:
    class_name: Poetry::Ui::NavigationMenu::Component
    identifier: poetry--ui--navigation_menu
    bem_block: poetry-ui-navigation_menu
    styles: []
    options:
    - name: label
      type: string
      required: true
      description: The nav landmark's accessible name - a page may hold more than
        one nav.
    - name: viewport
      type: boolean
      default: false
      description: 'Opts into the shared morphing viewport: panels adopt into one
        positioned card that morphs size and position between triggers. Off, each
        panel opens under its own item (also the no-JS shape).'
    slots:
    - name: items
      many: true
      description: 'The bar entries. with_item(title, value:) { panel } declares a
        trigger + panel (disabled: true renders the trigger inert - native disabled
        plus data-disabled; hover and click never open its panel); with_item(title,
        href:) a top-level link (with_link is the shorthand).'
      setter_args:
        item: 1
      yieldless:
      - item
    description: A site-navigation bar with links and optional dropdown panels.
    slot_extras:
    - link
    elements:
    - list
    - item
    - trigger
    - chevron
    - content
    - content_position
    - positioner
    - popup
    - viewport_shell
    - viewport_panel
    - link
    capsule: e3db403f9dac
    controllers:
    - identifier: poetry--core--navigation-menu
      targets: []
      values:
      - closeDelay
      - openDelay
      actions:
      - cancelClose
      - focusLeft
      - keydown
      - scheduleClose
      - scheduleOpen
      - toggle
      events: []
    - identifier: poetry--core--popper
      targets:
      - anchor
      - arrow
      - content
      values:
      - align
      - alignOffset
      - anchor
      - anchorPoint
      - avoidCollisions
      - side
      - sideOffset
      - strategy
      actions:
      - anchorPointValueChanged
      - reposition
      - setAnchor
      - setAnchorElement
      - strategyValueChanged
      events: []
    agent_rules:
    - 'label: is REQUIRED (the nav landmark''s accessible name).'
    - with_item(title, value:) declares a trigger + panel; with_link(title, href:)
      is a top-level destination - use links for pages, panels for groups of links.
    - 'Panel content is poetry_navigation_menu_link entries (active: marks the current
      page) - never buttons; navigation navigates.'
    - 'This is a DISCLOSURE bar: Tab moves through it normally and nothing traps -
      do not wire menu/menuitem roles. Keys: ArrowLeft/ArrowRight step between triggers
      and links, ArrowDown opens the focused trigger''s panel (focus stays on the
      trigger; Tab enters it), Escape closes and returns focus to the trigger.'
    - 'Rich panels (title + description grids) want viewport: true - the shared morphing
      card contains and sizes them; the default per-item mode suits simple link lists
      (the top-nav block shows the viewport pattern).'
    parts:
    - name: navigation-menu
      description: The <nav> landmark around the whole disclosure bar
      states:
      - attr: data-viewport
        condition: the mode marker ("true" = shared morphing viewport, "false" = per-item
          panels) - the dictionary's group-data chrome keys on it
    - name: navigation-menu-list
      description: The bar row holding every item
    - name: navigation-menu-item
      description: One bar entry - wraps a trigger + panel pair or a top-level link
      states:
      - attr: data-value
        condition: the entry's value - the controller's open/close key
    - name: navigation-menu-trigger
      description: The disclosure button opening its panel
      states:
      - attr: data-popup-open
        condition: its panel is open (written with aria-expanded - the chevron rotation
          hook)
      - attr: data-open
        condition: its panel is open (the controller writes both vocabularies)
      - attr: data-closed
        condition: its panel is closed (written after the first close)
      - attr: data-disabled
        condition: 'disabled: true - inert (native disabled rides along; hover and
          click never open the panel, the arrows step over it)'
    - name: navigation-menu-content
      description: One item's panel - presence-animated; in viewport mode it is adopted
        into the shared viewport on first activation
      states:
      - attr: data-open
        condition: panel is open (presence flips the pair at runtime)
      - attr: data-closed
        condition: panel is closed or animating out (the server-rendered state)
      - attr: data-activation-direction
        condition: which way the activation traveled between triggers (left/right,
          viewport mode) - keys the slide styles
      - attr: data-viewport-panel
        condition: stamped once the panel is adopted into the shared viewport
    - name: navigation-menu-positioner
      description: The viewport-mode shell popper positions against the active trigger
      states:
      - attr: data-instant
        condition: suppresses the morph transitions for one painted frame (cold opens)
      vars:
      - name: "--positioner-width"
        description: the pinned morph width (reset to auto once the transition settles)
      - name: "--positioner-height"
        description: the pinned morph height (reset to auto once the transition settles)
    - name: navigation-menu-popup
      description: The morphing card inside the positioner - open state and the size
        transition ride here
      states:
      - attr: data-open
        condition: a panel is showing (the controller flips the pair)
      - attr: data-closed
        condition: the popup is closed (the server-rendered state)
      - attr: data-instant
        condition: suppresses the morph transitions for one painted frame (cold opens)
      - attr: data-starting-style
        condition: the enter transition's first frame (the presence module's two-frame
          trick)
      - attr: data-ending-style
        condition: held through the exit transition before the popup hides
      vars:
      - name: "--popup-width"
        description: the pinned morph width (reset to auto once the transition settles)
      - name: "--popup-height"
        description: the pinned morph height (reset to auto once the transition settles)
    - name: navigation-menu-viewport
      description: The adoption container inside the popup - adopted panels stack
        absolutely in it
    - name: navigation-menu-link
      description: A REAL destination link - top-level (with_link) or a panel entry
        (poetry_navigation_menu_link)
      states:
      - attr: data-active
        condition: 'the current page (active: true)'
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--navigation-menu
        registers: true
        actions:
        - method: keydown
          'on': keydown
        - method: focusLeft
          'on': focusout
      - identifier: poetry--core--popper
        conditional: if viewport
        registers: true
        values:
        - name: side
        - name: align
        - name: side_offset
        - name: strategy
    - element: item
      controllers:
      - identifier: poetry--core--navigation-menu
        actions:
        - method: scheduleOpen
          'on': pointerenter
        - method: scheduleClose
          'on': pointerleave
    - element: trigger
      controllers:
      - identifier: poetry--core--navigation-menu
        actions:
        - method: toggle
          'on': click
    - element: positioner
      controllers:
      - identifier: poetry--core--popper
        targets:
        - name: content
      - identifier: poetry--core--navigation-menu
        actions:
        - method: cancelClose
          'on': pointerenter
        - method: scheduleClose
          'on': pointerleave
  poetry/ui/number_field:
    class_name: Poetry::Ui::NumberField::Component
    identifier: poetry--ui--number_field
    bem_block: poetry-ui-number_field
    styles: []
    options:
    - name: described_by
      type: string
      description: aria-describedby wiring for Field hint/error pairing.
    - name: disabled
      type: boolean
      default: false
      description: Disables both inputs and the steppers; the group chrome dims.
    - name: format
      type:
      description: Intl.NumberFormatOptions for the DISPLAY (submission stays raw).
    - name: id
      type: string
      description: 'The visible input''s dom id - the seam a Label''s for_id: points
        at.'
    - name: invalid
      type: boolean
      default: false
      description: Marks the field invalid (aria-invalid on the visible input; the
        group wears the destructive ring).
    - name: label
      type: string
      description: Standalone accessible name -> aria-label on the visible input.
        Inside a form, the Field label wires ids instead - pass neither and pair with
        poetry_label/form.
    - name: large_step
      type: float
      default: 10.0
      description: The Shift-arrow step size (the coarse jump).
    - name: locale
      type: string
      description: Locale tag pinning the display and parsing separators; the page
        locale otherwise.
    - name: max
      type: float
      description: The upper clamp for stepping and native validation.
    - name: min
      type: float
      description: The lower clamp for stepping and native validation.
    - name: name
      type: string
      required: true
      description: The submitted field name - rides the hidden number input.
    - name: placeholder
      type: string
      description: Placeholder text for the empty input.
    - name: readonly
      type: boolean
      default: false
      description: Makes the visible input read-only (steppers and typing inert).
    - name: required
      type: boolean
      default: false
      description: Requires a value - native validation rides the hidden input.
    - name: small_step
      type: float
      default: 0.1
      description: The Alt-arrow step size (the fine adjustment).
    - name: snap
      type: boolean
      default: false
      description: Snaps stepped values to step multiples counted from min:.
    - name: step
      type: float
      default: 1.0
      description: The arrow-key / stepper increment.
    - name: value
      type:
      description: Initial value - a number; nil renders empty (null semantics).
    - name: wheel
      type: boolean
      default: false
      description: Opt-in wheel stepping while the input is focused.
    slots: []
    description: A numeric input with increment and decrement steppers.
    elements: []
    capsule: 992ce89b2903
    controllers:
    - identifier: poetry--core--number-field
      targets:
      - decrement
      - hidden
      - increment
      - input
      values:
      - format
      - largeStep
      - locale
      - max
      - min
      - smallStep
      - snap
      - step
      - wheel
      actions:
      - blur
      - hiddenChanged
      - input
      - keydown
      - leave
      - press
      - tap
      events:
      - poetry:number-field:change
      - poetry:number-field:commit
    agent_rules:
    - Use poetry_number_field / form.number_field - never a hand-rolled spinner or
      a bare input type=number.
    - The server reads params[<name>] as the raw number string - display formatting
      (format:) never changes what submits.
    - Steppers are mouse/touch affordances (tabindex -1); keyboard users step with
      ArrowUp/Down (Shift = large_step, Alt = small_step) on the input itself.
    - Pair it with a Label/Field for the accessible name - the component ships none.
    - 'format: takes Intl.NumberFormatOptions as a Hash ({ style: "currency", currency:
      "USD" }); pick locale: to pin parsing separators.'
    parts:
    - name: number-field
      description: Root wrapper - the controller, disabled/invalid/filled state, and
        the two-input pair ride here
      states:
      - attr: data-disabled
        condition: 'disabled: is set (steppers disable, the group chrome dims)'
      - attr: data-invalid
        condition: 'invalid: is set (the group wears the destructive ring via the
          control''s aria-invalid)'
      - attr: data-filled
        condition: the value is non-null (the controller keeps it live)
    - name: number-field-group
      description: The bordered field surface - wears InputGroup's chrome (cn-input-group),
        focus ring keyed on the control inside
    - name: input-group-addon
      description: The two stepper cells - InputGroup's addon vocabulary, reused so
        the group paddings compose
      states:
      - attr: data-align
        condition: always - inline-start holds the decrement, inline-end the increment
        values:
        - inline-start
        - inline-end
    - name: input-group-control
      description: The visible formatted <input type=text> - InputGroup's control
        slot (the themes' focus-ring hook); aria-roledescription "Number field", never
        a spinbutton
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--number-field
        registers: true
        values:
        - name: min
          conditional: if
        - name: max
          conditional: if
        - name: step
        - name: large_step
        - name: small_step
        - name: snap
          conditional: if snap
        - name: wheel
          conditional: if wheel
        - name: format
          conditional: if
        - name: locale
          conditional: if
    - element: input
      controllers:
      - identifier: poetry--core--number-field
        targets:
        - name: input
        actions:
        - method: keydown
          'on': keydown
        - method: input
          'on': input
        - method: blur
          'on': blur
    - element: hidden
      controllers:
      - identifier: poetry--core--number-field
        targets:
        - name: hidden
        actions:
        - method: hiddenChanged
          'on': change
    - element: increment
      controllers:
      - identifier: poetry--core--number-field
        targets:
        - name: increment
        actions:
        - method: press
          'on': pointerdown
        - method: tap
          'on': click
        - method: leave
          'on': pointerleave
    - element: decrement
      controllers:
      - identifier: poetry--core--number-field
        targets:
        - name: decrement
        actions:
        - method: press
          'on': pointerdown
        - method: tap
          'on': click
        - method: leave
          'on': pointerleave
  poetry/ui/pagination:
    class_name: Poetry::Ui::Pagination::Component
