        text.
    slots: []
    description: A syntax-highlighted code panel with a copy button and optional line
      numbers.
    elements:
    - pre
    - code
    - copy
    - icon_stack
    - icon_copy
    - icon_check
    capsule: '049533fbf644'
    controllers:
    - identifier: poetry--core--clipboard-text
      targets:
      - input
      - source
      values:
      - message
      - text
      actions:
      - copy
