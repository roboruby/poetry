    - 'external: true handles target/rel safely - never hand-write target=_blank.'
  poetry/ui/marker:
    class_name: Poetry::Ui::Marker::Component
    identifier: poetry--ui--marker
    bem_block: poetry-ui-marker
    styles:
    - name: variant
      type: symbol
      variants:
      - default
      - separator
      - border
      default: default
      required: true
    options:
    - name: announce
      type: symbol
      default: none
    - name: tag
      type: symbol
      default: div
    slots:
    - name: icon
      many: false
    elements:
    - icon
    - content
    capsule: 3ba6d98024fa
    agent_rules:
    - The marker text is real announced content - never mark it aria-hidden or role=separator.
    - 'announce: :status is for the ONE in-flight marker (streaming status); static
