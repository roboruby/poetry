        actions:
        - method: fire
          'on': click
  poetry/ui/toaster:
    class_name: Poetry::Ui::Toaster::Component
    identifier: poetry--ui--toaster
    bem_block: poetry-ui-toaster
    styles:
    - name: position
      type: symbol
      variants:
      - top-left
      - top-center
      - top-right
      - bottom-left
      - bottom-center
      - bottom-right
      default: bottom-right
      required: true
      description: The stack's corner - set here, not per toast; each toast's slide
        direction follows it.
    options:
    - name: hotkey
      type: string
      default: F8
      description: The keyboard shortcut that focuses the most recent toast.
    - name: limit
