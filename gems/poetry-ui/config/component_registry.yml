      - selected
      - weekStart
      actions:
      - jump
      - keydown
      - monthValueChanged
      - nextMonth
      - previousMonth
      - select
      - selectedValueChanged
      events:
      - poetry--core--calendar:change
    agent_rules:
    - 'name: makes it a form control (the chosen date posts as an ISO string in a
      hidden input; range mode posts name[start] + name[end]).'
    - 'month:/selected:/today accept a Date or an ISO string; min:/max: bound the
      selectable range.'
    - 'mode: :range selects a span - selected: takes a Date..Date Range, [start, end],
      or {start:, end:}; the second click completes, click-before-start swaps, re-click
      clears.'
    - The grid is server-rendered - it shows a valid month with no JS; the controller
      adds navigation + selection.
    - For a text-field + popover, use DatePicker (it composes this) - a bare Calendar
      is the always-visible grid.
    - 'caption_layout: :dropdown swaps the month label for month + year selects (jump
      navigation); the year list derives from min:/max: when both are set, else ten
      years around the initial month.'
    - 'week_numbers: true adds the ISO week column (each row''s Thursday decides the
      number).'
    parts:
    - name: calendar
      description: Root wrapper - the calendar controller (navigation, selection,
        roving arrow keys) rides here
    - name: calendar-nav
      description: The header row - previous/next month Buttons around the caption
    - name: calendar-caption
      description: 'The month label (''July 2026'') - the controller rewrites it on
        navigation from the localized month names; under caption_layout: :dropdown
        it holds the month/year NativeSelect pair instead (the controller reflects
        navigation into them)'
    - name: calendar-week-number
      description: The ISO week column (week_numbers:) - a columnheader stub plus
        one muted rowheader number per week; non-interactive
    - name: calendar-dropdown
      description: 'One caption dropdown unit (caption_layout: :dropdown) - the visible
        label with the real <select> stretched invisibly over it (the upstream overlay
        pattern)'
      states:
      - attr: data-calendar-unit
        condition: always - which unit this select drives
        values:
        - month
        - year
    - name: calendar-caption-label
      description: The visible text + chevron of a caption dropdown (aria-hidden -
        the overlaid select carries the value)
    - name: calendar-dropdown-value
      description: The label's text span - the controller rewrites it on navigation
        (month name or year)
    - name: calendar-grid
      description: The role=grid - the weekday header row plus six week rows (42 cells,
        always full weeks)
    - name: calendar-weekdays
      description: The role=row of weekday column headers
    - name: calendar-weekday
      description: One role=columnheader two-letter day label
    - name: calendar-week
      description: One role=row of seven day cells
    - name: calendar-day-cell
      description: The role=gridcell wrapper - aria-selected lives HERE (the ARIA
        grid contract; it is not valid on the button)
    - name: calendar-day
      description: One day <button> - the selection vocabulary and the roving tab
        stop ride here
      states:
      - attr: data-date
        condition: always - the day's ISO date (the controller's selection key)
      - attr: data-selected
        condition: the day is the single-mode pick, or a start-only range pick (bare;
          a complete range wears the range-* trio instead)
      - attr: data-range-start
        condition: the day starts a COMPLETE range
      - attr: data-range-end
        condition: the day ends a COMPLETE range
      - attr: data-range-middle
        condition: the day sits strictly inside a complete range
      - attr: data-today
        condition: the day is today (aria-current=date rides along)
      - attr: data-outside
        condition: the day belongs to a neighbouring month (leading/trailing fill)
    - name: calendar-day-label
      description: The day-number span inside the button
