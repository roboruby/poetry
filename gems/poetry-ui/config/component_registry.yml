    - name: sidebar-menu-badge
      description: The trailing count/status chrome in the row corner - pointer-transparent
      states:
      - attr: data-sidebar
        condition: always "menu-badge" - the suite-wide sub-part marker
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--sidebar
        registers: true
        values:
        - name: open
        - name: collapsible
    - element: peer
      controllers:
      - identifier: poetry--core--sidebar
        targets:
        - name: sidebar
    - element: inner
      controllers:
      - identifier: poetry--core--sidebar
        targets:
        - name: inner
    - element: mobile
      controllers:
      - identifier: poetry--core--sidebar
        targets:
        - name: mobileDialog
        actions:
        - method: closeMobile
          'on': cancel
        - method: mobileBackdropClose
          'on': click
    - element: mobile_inner
      controllers:
      - identifier: poetry--core--sidebar
        targets:
        - name: mobileInner
    - element: trigger
      controllers:
      - identifier: poetry--core--sidebar
        actions:
        - method: toggle
          'on': click
