  poetry/ui/popover:
    class_name: Poetry::Ui::Popover::Component
    identifier: poetry--ui--popover
    bem_block: poetry-ui-popover
    styles: []
    options:
    - name: align
      type: symbol
      variants:
      - start
      - center
      - end
      default: center
      description: Panel alignment along the chosen side.
    - name: align_offset
      type: integer
      default: 0
      description: Shift in pixels along the alignment axis.
    - name: avoid_collisions
      type: boolean
      default: true
      description: Flips and shifts the panel to stay inside the viewport.
    - name: content_class
      type: string
      description: 'Class merge seam for the panel itself (e.g. widen the default
        with content_class: "w-80") - root-level class: styles the wrapper, not the
        panel.'
    - name: label
      type: string
      description: role=dialog fallback name when no title part is present.
    - name: modal
      type: boolean
      default: false
      description: Reserves interaction for the panel while open; the default keeps
        the rest of the page interactive.
    - name: open
      type: boolean
      default: false
      description: Server-renders the panel open.
    - name: side
      type: symbol
      variants:
      - top
      - right
      - bottom
      - left
      default: bottom
      description: Which side of the anchor the panel opens on.
    - name: side_offset
      type: integer
      default: 4
      description: Gap in pixels between the anchor and the panel.
    slots:
    - name: trigger
      many: false
      description: The control that opens the panel - a composed Button. The slot
        owns the aria-haspopup/expanded/controls wiring regardless of the composed
        content, so composition cannot drop the aria; aria-controls renders even while
        closed (the stable id is the wiring's resolution seam).
      component: poetry/ui/button
      setter_args:
        trigger: 0
      yieldless:
      - trigger
    - name: anchor
      many: false
      description: 'Optional alternate anchor: when present, the panel positions against
        IT instead of the trigger (targets beat selectors in the positioning fallback
        chain).'
      setter_args:
        anchor: 0
      yieldless:
      - anchor
    - name: title
      many: false
      description: Panel heading - presence wires the content's aria-labelledby, so
        the title names the dialog.
    - name: description
      many: false
      description: Supporting text - presence wires the content's aria-describedby.
    description: Rich floating content anchored to a trigger.
    elements:
    - content
    - header
    - title
    - description
    capsule: 286697f5d914
    controllers:
    - identifier: poetry--core--popover
      targets: []
      values:
      - modal
      - open
      actions:
      - close
      - open
      - openValueChanged
      - toggle
      events:
      - poetry:popover:closed
      - poetry:popover:open
    - identifier: poetry--core--popper
      targets:
      - anchor
      - arrow
      - content
      values:
      - align
      - alignOffset
      - anchor
      - anchorPoint
      - avoidCollisions
      - side
      - sideOffset
      - strategy
      actions:
      - anchorPointValueChanged
      - reposition
      - setAnchor
      - setAnchorElement
      - strategyValueChanged
      events: []
    agent_rules:
    - 'with_trigger(compose: true) { |wiring| ... } composes YOUR control as the trigger:
      the block is yielded the trigger wiring (the Stimulus behavior the overlay needs;
      poppers add id/aria and their trigger slot, modals hand only the open action)
      - splat it onto a wiring-free control (poetry_sidebar_menu_button, a plain tag);
      without compose: the classic composed Button renders.'
    - Use poetry_popover - never hand-roll an anchored role=dialog panel with Tailwind.
    - Popover content is INTERACTIVE - for text-only hover hints use Tooltip; for
      pointer-only previews use HoverCard.
    - 'Give the panel a name: use with_title (preferred) or label: - a role=dialog
      without a name fails the audit.'
    - 'Icon-only triggers MUST have an accessible name (the composed Button''s label:
      rule).'
    - 'Default is NON-modal (modal: false) - reach for modal: true only when stray
      outside interaction would corrupt the task; reach for Dialog when the task deserves
      full modality.'
    - 'Critical-path panels must also be reachable without JS (full page or server-rendered
      open: true) - popovers are JS-required interaction.'
    - Do not nest a Popover inside a Popover - restructure (the layer stack allows
      it; comprehension does not).
    required_slots:
      trigger: the panel's control
    parts:
    - name: popover
      description: Root wrapper around the trigger, the optional anchor, and the panel
    - name: popover-anchor
      description: Optional alternate popper anchor - when present the panel positions
        against it instead of the trigger
    - name: popover-content
      description: The role=dialog panel - positioning, animation, and the open state
        ride here
      states:
      - attr: data-open
        condition: panel is open (the controller flips the pair at runtime)
      - attr: data-closed
        condition: panel is closed (the server-rendered state; hidden rides along)
      - attr: data-side
        condition: always - the side (initial placement, re-resolved live by popper
          after flip)
        values:
        - top
        - right
        - bottom
        - left
      - attr: data-align
        condition: always - the alignment (re-resolved live by popper)
        values:
        - start
        - center
        - end
      vars:
      - name: "--transform-origin"
        description: the anchor-facing origin popper writes for scale-in animation
      - name: "--available-width"
        description: viewport space left for the panel (popper, post-flip)
      - name: "--available-height"
        description: viewport space left for the panel (popper, post-flip)
      - name: "--anchor-width"
        description: the anchor's measured width (popper)
      - name: "--anchor-height"
        description: the anchor's measured height (popper)
    - name: popover-header
      description: Title block wrapping the title and description (renders only when
        either is present)
    - name: popover-title
      description: The heading - the panel's accessible name via aria-labelledby
    - name: popover-description
      description: Muted copy under the title, wired to aria-describedby
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--popover
        registers: true
        values:
        - name: open
        - name: modal
      - identifier: poetry--core--popper
        registers: true
        values:
        - name: anchor
          conditional: unless anchor?
        - name: side
        - name: align
        - name: side_offset
        - name: align_offset
        - name: avoid_collisions
    - element: trigger
      controllers:
      - identifier: poetry--core--popover
        actions:
        - method: toggle
          'on': click
    - element: anchor_part
      controllers:
      - identifier: poetry--core--popper
        targets:
        - name: anchor
    - element: content
      controllers:
      - identifier: poetry--core--popper
        targets:
        - name: content
