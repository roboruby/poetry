        list).'
    - name: label
      type: string
      description: The trigger's accessible name (aria-label).
    - name: mode
      type: symbol
      default: single
      description: ":single or :range (two-date selection; the trigger shows the joined
        pair)."
    - name: name
      type: string
      required: true
      description: The form field name - required; the chosen date posts as ISO.
    - name: placeholder
      type: string
      default: Pick a date
      description: Trigger text while nothing is chosen.
    - name: variant
      type: symbol
      default: button
      description: ":button (the default trigger) or :input - a text field that accepts
        a typed date (parseable text re-selects the calendar) with a calendar icon-button
        opening the popover. Single mode only."
    slots: []
    description: A date field that opens a calendar popover for selection.
    elements:
    - trigger_single
    - trigger_range
    - trigger_chrome
    - trigger_placeholder
    capsule: 705cd77aef89
