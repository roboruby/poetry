      field.
    - Options are VALUES. If activating an option should DO something beyond setting
      a value, it's a DropdownMenu item.
    - In forms, ALWAYS go through f.poetry_select - it wires name/id/value/errors/required;
      bare poetry_select in a form is a smell.
    - 'Every Select MUST be named: a Field label (id: + label[for]) or aria-label.
      A bare unnamed select fails at render - do not suppress it.'
    - NEVER write aria-selected without its data-selected twin, and NEVER write the
      display text without writing the native select's value first - the controller
      does all three; agents patching DOM must too.
    - Do not put interactive elements inside options (an option IS the interactive
      unit).
    - Long/filterable/async lists or multi-select -> Combobox, not a 50-option Select;
      2-4 options -> RadioGroup.
    - The hidden native select is plumbing - never target it with styles, labels,
      or Capybara selectors (drive the combobox like a user).
    - 'Positioning is popper-only: poetry Select drops below the trigger (the item-aligned
      overlay mode is not ported - a documented parity delta).'
    required_slots:
      item: at least one item
    parts:
    - name: select
      description: Root wrapper carrying both controllers (select + popper) and the
        optional dir attribute
    - name: select-native
      description: The visually-hidden native <select> - the serialization truth (name/required/disabled
        + every option); plumbing, never styled or targeted
    - name: select-trigger
      description: The role=combobox button the field label reaches - the value display
        and chevron ride inside
      states:
      - attr: data-size
        condition: always - the resolved size variant
        values:
        - sm
        - default
      - attr: data-placeholder
        condition: no option is committed (bare; the controller toggles it on every
          commit)
      - attr: data-popup-open
        condition: the popup is open (bare while open, absent while closed - the controller
          flips it with the open state)
    - name: select-value
      description: The value display span - the selected option's label, or the placeholder
      states:
      - attr: data-placeholder
        condition: 'placeholder: is given - carries the placeholder text so a later
          clear can restore it'
    - name: select-content
      description: The popper-positioned popup shell (scroll buttons + viewport) -
        open/closed and the resolved placement ride here
      states:
      - attr: data-open
        condition: popup is open (the controller flips the pair at runtime)
      - attr: data-closed
        condition: popup is closed or animating out (the server-rendered state)
      - attr: data-side
        condition: the placement side - server-rendered from side:, rewritten to the
          resolved side by popper on open
        values:
        - top
        - right
        - bottom
        - left
      - attr: data-align
        condition: the placement alignment - server-rendered from align:, rewritten
          by popper on open
        values:
        - start
        - center
        - end
      vars:
      - name: "--transform-origin"
        description: popper - the animation origin matching the resolved placement
      - name: "--available-width"
        description: popper - viewport space available to the popup post-flip
      - name: "--available-height"
        description: popper - viewport space available to the popup post-flip
      - name: "--anchor-width"
        description: popper - the trigger's measured width
      - name: "--anchor-height"
        description: popper - the trigger's measured height
      - name: "--radix-select-trigger-width"
        description: the select controller measures the trigger on open - the viewport's
          min-width binding
      - name: "--radix-select-trigger-height"
        description: the select controller measures the trigger on open - the viewport's
          MINIMUM-height binding (a hard height collapses the popup to the trigger;
          the list grows past it)
    - name: select-scroll-up-button
      description: Hover-scroll affordance above the viewport - rendered always but
        hidden; the controller unhides it per scroll extremes (aria-hidden)
    - name: select-scroll-down-button
      description: Hover-scroll affordance below the viewport (the same contract as
        the up button)
    - name: select-viewport
      description: The role=listbox scroll container - the options' actual parent,
        labelled from the trigger
    - name: select-group
      description: role=group wrapper labelled by its select-label heading
    - name: select-label
      description: The group heading - styled, no ARIA role (the group points at it
        via aria-labelledby)
    - name: select-item
      description: One role=option div - selection, disablement, and the committable
        value ride here
      states:
      - attr: data-value
        condition: always - the option's committable value (the native <option> twin)
      - attr: data-selected
        condition: the option is committed (bare; absent while unselected - the controller
          twin-writes it with aria-selected)
      - attr: data-disabled
        condition: 'disabled: is set (aria-disabled rides along)'
    - name: select-item-indicator
      description: The check gutter - server-rendered always; the parent item's data-selected
        absence hides it
    - name: select-item-text
      description: The option's label span - the value display copies from it
    - name: select-separator
      description: Decorative divider between options (aria-hidden)
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--select
        registers: true
        values:
        - name: open
        - name: value
        - name: modal
        - name: loop
        - name: align_item_with_trigger
      - identifier: poetry--core--popper
        registers: true
        values:
        - name: side
        - name: align
        - name: side_offset
        - name: align_offset
        - name: avoid_collisions
    - element: trigger
      controllers:
      - identifier: poetry--core--select
        actions:
        - method: toggle
          'on': click
        - method: triggerKeydown
          'on': keydown
      - identifier: poetry--core--popper
        targets:
        - name: anchor
    - element: content
      controllers:
      - identifier: poetry--core--popper
        targets:
        - name: content
    - element: item
      controllers:
      - identifier: poetry--core--select
        actions:
        - method: commit
          'on': click
    - element: native
      controllers:
      - identifier: poetry--core--select
        actions:
        - method: nativeChanged
          'on': change
    - element: viewport
      controllers:
      - identifier: poetry--core--select
        actions:
        - method: syncScrollButtons
          'on': scroll
    - element: scroll_button
      controllers:
      - identifier: poetry--core--select
        actions:
        - method: scrollHoldStart
          'on': pointerenter
        - method: scrollHoldStop
          'on': pointerleave
  poetry/ui/sensitive_input:
    class_name: Poetry::Ui::SensitiveInput::Component
    identifier: poetry--ui--sensitive_input
    bem_block: poetry-ui-sensitive_input
    styles: []
    options:
    - name: copy
      type: boolean
      default: false
      description: Adds the copy-without-revealing button in the trailing cell.
    - name: described_by
      type: string
      description: aria-describedby on the input - Field hint/error wiring.
    - name: disabled
      type: boolean
      default: false
      description: Disables the input and drops the masked group's tab stop.
    - name: id
      type: string
      description: 'The input''s DOM id - what a Field label''s for: must reference.'
    - name: invalid
      type: boolean
      default: false
      description: aria-invalid on the input - set by Field/FormBuilder from model
        errors.
    - name: label
      type: string
      description: The accessible name - feeds the input's aria-label and the masked
        announcement ("{label}, masked."); pair with a visible Label/Field caption.
    - name: name
      type: string
      required: true
      description: The form field name on the real input.
    - name: placeholder
      type: string
      description: Hint text shown while the field is empty.
    - name: readonly
      type: boolean
      default: false
      description: The value can be revealed and copied but not edited.
    - name: required
      type: boolean
      default: false
      description: Marks the real input required.
    - name: value
      type: string
      description: The secret's current value; present = first paint is masked, blank
        = the empty state.
    slots: []
    description: A masked secret field with a reveal toggle and a copy button.
    elements:
    - group
    - input
    - mask
    - mask_dots
    - mask_reveal
    - icon_stack
    - icon_copy
    - icon_check
    capsule: 24e0d913d538
    controllers:
    - identifier: poetry--core--clipboard-text
      targets:
      - input
      - source
      values:
      - message
      - text
      actions:
      - copy
      events:
      - poetry:clipboard-text:copied
    - identifier: poetry--core--sensitive-input
      targets:
      - hint
      - input
      - mask
      - toggle
      values:
      - hiddenMessage
      - maskedLabel
      - readOnly
      actions:
      - blurred
      - changed
      - inputKeydown
      - maskKeydown
      - reveal
      - toggle
      events:
      - poetry:sensitive-input:mask
      - poetry:sensitive-input:reveal
    agent_rules:
    - Secrets shown-on-demand are a SensitiveInput (poetry_sensitive_input) - never
      a bare password Input with a hand-rolled eye; the masked-container contract
      (role=button, focus discipline, blur re-mask) rides the controller.
    - 'label: feeds the masked announcement ("{label}, masked.") - pair with a Label/Field
      for the visible caption.'
    - 'copy: true adds copy-without-revealing; leave it off for password-change forms.'
    - Values re-mask on blur BY DESIGN - do not fight it with reveal-state persistence.
    parts:
    - name: sensitive-input
      description: Root - the state machine rides here
      states:
      - attr: data-state
        condition: always - masked (value hidden, group is the reveal button), revealed,
          or empty
        values:
        - masked
        - revealed
        - empty
      - attr: data-copied
        condition: 'copy: only - stamped for a beat after a successful copy (the clipboard-text
          engine)'
      - attr: data-disabled
        condition: 'disabled: - the masked group loses its tab stop and pointer affordances'
    - name: sensitive-input-group
      description: The bordered field surface (InputGroup's chrome) - clicks anywhere
        on it reveal; wears the focus ring when the mask button inside holds focus
    - name: input-group-control
      description: The real input - rendered in every state for layout stability;
        inert while masked (aria-hidden, tabindex -1, readonly, transparent); type=password
        unless revealed
    - name: sensitive-input-mask
      description: The overlay painting the masked state - while masked it IS the
        reveal button (role=button, tabindex 0, "{label}, masked.", described by the
        sr hint; only text spans inside, so no nested-interactive); bullet dots swap
        to the reveal hint on hover/focus with no layout shift
    - name: input-group-addon
      description: 'The trailing cell holding the eye (and copy: affordance)'
      states:
      - attr: data-align
        condition: always - inline-end holds the actions
        values:
        - inline-end
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--sensitive-input
        registers: true
        values:
        - name: masked_label
        - name: hidden_message
        - name: read_only
          conditional: if readonly
        actions:
        - method: blurred
          'on': focusout
      - identifier: poetry--core--clipboard-text
        conditional: if copy
        registers: true
        values:
        - name: message
    - element: group
      controllers:
      - identifier: poetry--core--sensitive-input
        actions:
        - method: reveal
          'on': click
    - element: mask
      controllers:
      - identifier: poetry--core--sensitive-input
        targets:
        - name: mask
        actions:
        - method: maskKeydown
          'on': keydown
    - element: input
      controllers:
      - identifier: poetry--core--sensitive-input
        targets:
        - name: input
        actions:
        - method: changed
          'on': input
        - method: inputKeydown
          'on': keydown
      - identifier: poetry--core--clipboard-text
        conditional: if copy
        targets:
        - name: input
    - element: toggle
      controllers:
      - identifier: poetry--core--sensitive-input
        targets:
        - name: toggle
        actions:
        - method: toggle
          'on': click
    - element: copy_button
      controllers:
      - identifier: poetry--core--clipboard-text
        actions:
        - method: copy
          'on': click
    - element: hint
      controllers:
      - identifier: poetry--core--sensitive-input
        targets:
        - name: hint
  poetry/ui/separator:
