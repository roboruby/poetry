# poetry component registry - generated by `bin/rake registry:generate` FROM SOURCE.
# DO NOT EDIT: CI verifies this file matches a fresh build (rake registry:verify).
---
components:
  poetry/ui/accordion:
    class_name: Poetry::Ui::Accordion::Component
    identifier: poetry--ui--accordion
    bem_block: poetry-ui-accordion
    styles: []
    options:
    - name: collapsible
      type: boolean
      default: false
    - name: heading_level
      type: symbol
      default: h3
    - name: open
      type: list
      default: dynamic
    - name: type
      type: symbol
      default: single
    slots:
    - name: items
      many: true
    elements:
    - item
    - header
    - trigger
    - indicator
    - content
    - inner
    capsule: 8957749480d6
    agent_rules:
    - Items via with_item(value:, title:) { panel content } - value is the open-state
      key.
    - 'type: :single (default) opens one at a time; pass collapsible: true to allow
      closing it.'
    - 'Server-render the open item(s) via open: %w[value] - never toggle data-state
      by hand.'
    - 'heading_level: fits the page outline (h3 default) - the trigger button lives
      inside it.'
    - The chevron is built in - never add another indicator icon to the trigger.
  poetry/ui/alert:
    class_name: Poetry::Ui::Alert::Component
    identifier: poetry--ui--alert
    bem_block: poetry-ui-alert
    styles:
    - name: variant
      type: symbol
      variants:
      - default
      - destructive
      default: default
      required: true
    options: []
    slots:
    - name: icon
      many: false
    - name: title
      many: false
    elements:
    - title
    - description
    capsule: 6bb258e12975
    agent_rules:
    - Use poetry_alert for inline callouts - it carries role/aria-live; never a hand-rolled
      div.
    - destructive announces assertively (role=alert) - reserve it for errors, not
      emphasis.
  poetry/ui/attachment:
    class_name: Poetry::Ui::Attachment::Component
    identifier: poetry--ui--attachment
    bem_block: poetry-ui-attachment
    styles:
    - name: orientation
      type: symbol
      variants:
      - horizontal
      - vertical
      default: horizontal
      required: true
    - name: size
      type: symbol
      variants:
      - default
      - sm
      - xs
      default: default
      required: true
    options:
    - name: state
      type: symbol
      default: done
    slots:
    - name: media
      many: false
    - name: title
      many: false
    - name: description
      many: false
    - name: actions
      many: true
    - name: trigger
      many: false
    elements:
    - media
    - content
    - title
    - description
    - actions
    - trigger
    - group
    capsule: edad85abbad6
    agent_rules:
    - 'State is server-owned: render data-state and flip it by Turbo Stream replace
      - never toggle it in JS.'
    - 'with_media(variant: :image) wraps the caller''s <img>; file names and URLs
      are user content - never render them html_safe.'
    - 'Actions are with_action(...) poetry Buttons (ghost/icon-xs defaults) - each
      needs label: (icon-only).'
    - with_trigger makes the whole chip the control (a stretched overlay UNDER the
      actions) - don't also wrap the chip in a link.
    - error state needs a with_description explaining the failure - the tint alone
      is not the message.
  poetry/ui/badge:
    class_name: Poetry::Ui::Badge::Component
    identifier: poetry--ui--badge
    bem_block: poetry-ui-badge
    styles:
    - name: variant
      type: symbol
      variants:
      - default
      - secondary
      - destructive
      - outline
      default: default
      required: true
    options: []
    slots: []
    elements: []
    capsule: 025c0440036f
    agent_rules:
    - Badges are non-interactive status labels - never attach click handlers; use
      Button for actions.
    - 'The visible text is the content block: render ... { "beta" } - there is no
      label: option.'
    - Pick the variant by intent (destructive = error states), never by color preference.
  poetry/ui/bubble:
    class_name: Poetry::Ui::Bubble::Component
    identifier: poetry--ui--bubble
    bem_block: poetry-ui-bubble
    styles:
    - name: variant
      type: symbol
      variants:
      - default
      - secondary
      - muted
      - tinted
      - outline
      - ghost
      - destructive
      default: default
      required: true
    options:
    - name: align
      type: symbol
      default: start
    - name: href
      type: string
    - name: tag
      type: symbol
      default: div
    slots:
    - name: reactions
      many: false
    elements:
    - group
    - content
    - reactions
    capsule: 846f16b098a4
    agent_rules:
    - One Bubble per message; stack a sender's run inside poetry_bubble_group.
    - 'Quick replies are tag: :button (with the caller''s data-action) or tag: :a
      + href: - never a click handler on a div.'
    - ghost is for tool output / system text flowing full-width - not a visual preference.
    - 'Reactions REQUIRE label: (the accessible name for the cluster).'
    - Inside a Message, alignment follows the Message's align - do not set both.
  poetry/ui/button:
    class_name: Poetry::Ui::Button::Component
    identifier: poetry--ui--button
    bem_block: poetry-ui-button
    styles:
    - name: size
      type: symbol
      variants:
      - default
      - xs
      - sm
      - lg
      - icon
      - icon-xs
      - icon-sm
      - icon-lg
      default: default
      required: true
    - name: variant
      type: symbol
      variants:
      - default
      - destructive
      - outline
      - secondary
      - ghost
      - link
      default: default
      required: true
    options:
    - name: disabled
      type: boolean
      default: false
    - name: href
      type: string
    - name: label
      type: string
    - name: loading
      type: boolean
      default: false
    - name: tag
      type: symbol
      default: button
    - name: type
      type: symbol
      default: button
    slots:
    - name: leading
      many: false
    - name: trailing
      many: false
    elements: []
    capsule: aa16559d9dce
    agent_rules:
    - Use poetry_button - never a raw <button> with hand-written Tailwind.
    - 'The visible text is the content block: poetry_button { "Save" }. label: is
      ONLY the accessible name.'
    - 'Icon-only buttons (size: :icon*) MUST pass label: (the accessible name).'
    - 'Link-styled actions use variant: :link - not <a> with button classes.'
    - 'Loading via loading: - never a manual disabled + spinner.'
    - Never nest an interactive element inside a Button.
    - Pick the variant by intent; one primary (default) action per view.
  poetry/ui/card:
    class_name: Poetry::Ui::Card::Component
    identifier: poetry--ui--card
    bem_block: poetry-ui-card
    styles: []
    options:
    - name: title_tag
      type: symbol
      default: h3
    slots:
    - name: title
      many: false
    - name: description
      many: false
    - name: action
      many: false
    - name: footer
      many: false
    elements:
    - header
    - title
    - description
    - action
    - content
    - footer
    capsule: c81b01706570
    agent_rules:
    - Compose with the slots (title/description/action/footer) - never rebuild the
      header grid by hand.
    - The card body is the content block; use CardAction for the header-corner control.
    - 'The title renders as a real heading (h3 default) - set title_tag: to fit the
      page outline.'
  poetry/ui/collapsible:
    class_name: Poetry::Ui::Collapsible::Component
    identifier: poetry--ui--collapsible
    bem_block: poetry-ui-collapsible
    styles: []
    options:
    - name: open
      type: boolean
      default: false
    slots:
    - name: trigger
      many: false
    agent_rules:
    - The trigger is with_trigger { "label" } - a real button, wired for you (aria-expanded/controls).
    - 'Server-render the initial state via open: - never toggle data-state by hand.'
    - Content stays in the DOM when closed (hidden) - do not conditionally render
      it.
    - 'For URL-controlled disclosure without JS, render open: from params - the same
      markup serves both.'
  poetry/ui/dialog:
    class_name: Poetry::Ui::Dialog::Component
    identifier: poetry--ui--dialog
    bem_block: poetry-ui-dialog
    styles: []
    options:
    - name: dismissible
      type: boolean
      default: true
    slots:
    - name: trigger
      many: false
    - name: title
      many: false
    - name: description
      many: false
    - name: footer
      many: false
    elements:
    - content
    - header
    - title
    - description
    - footer
    - close
    capsule: 371e0022a6fe
    agent_rules:
    - Open dialogs with with_trigger(...) - never a hand-wired button.
    - with_title is REQUIRED (the accessible name); with_description when the purpose
      needs explaining.
    - 'Confirmations that must not be lost use dismissible: false (backdrop clicks
      stop closing).'
    - Destructive confirmations pair a destructive Button in the footer - never auto-submit.
  poetry/ui/field:
    class_name: Poetry::Ui::Field::Component
    identifier: poetry--ui--field
    bem_block: poetry-ui-field
    styles: []
    options:
    - name: error
      type: string
    - name: hint
      type: string
    - name: id
      type: string
      required: true
    - name: label_text
      type: string
    - name: required
      type: boolean
      default: false
    slots: []
    elements:
    - hint
    - error
    capsule: 0c204c4dfa15
    agent_rules:
    - Wire the control with field.control_attributes - never hand-write aria-describedby.
    - 'Error text arrives via error: (from model errors upstream) - never a bare red
      <p>.'
  poetry/ui/icon:
    class_name: Poetry::Ui::Icon::Component
    identifier: poetry--ui--icon
    bem_block: poetry-ui-icon
    styles: []
    options:
