  poetry/ui/link:
    class_name: Poetry::Ui::Link::Component
    identifier: poetry--ui--link
    bem_block: poetry-ui-link
    styles:
    - name: underline
      type: symbol
      variants:
      - hover
      - always
      - none
      default: hover
    options:
    - name: current
      type: boolean
      default: false
    - name: external
      type: boolean
      default: false
    - name: href
      type: string
      required: true
    slots: []
    description: A styled navigational hyperlink.
    elements: []
    capsule: e25343f18116
    agent_rules:
    - Use poetry_link for navigation - poetry_button for actions (never an <a> styled
      by hand).
    - 'Mark the active nav item with current: true (aria-current), never with a bespoke
      class.'
    - 'external: true handles target/rel safely - never hand-write target=_blank.'
    parts:
    - name: link
      description: 'The rendered <a> - the whole component; current: marks it aria-current=page'
  poetry/ui/marker:
    class_name: Poetry::Ui::Marker::Component
    identifier: poetry--ui--marker
    bem_block: poetry-ui-marker
    styles:
    - name: variant
      type: symbol
      variants:
      - default
      - separator
      - border
      default: default
      required: true
    options:
    - name: announce
      type: symbol
      variants:
      - none
      - status
      default: none
    - name: tag
      type: symbol
      default: div
    slots:
    - name: icon
      many: false
      component: poetry/ui/icon
      setter_args:
        icon: 1
    description: A transcript divider or inline status marker for chat UIs.
    elements:
    - icon
    - content
    capsule: c2bdbdcafa1f
    agent_rules:
    - The marker text is real announced content - never mark it aria-hidden or role=separator.
    - 'announce: :status is for the ONE in-flight marker (streaming status); static
      dividers never announce.'
    - Icons in markers ride the typed icon slot (decorative always).
    - 'Use variant: :separator for date/section breaks; :border under pinned headers.'
    parts:
    - name: marker
      description: 'The divider/status root - the label is real announced content
        (role=status when announce: :status; never role=separator)'
      states:
      - attr: data-variant
        condition: always - the resolved variant
        values:
        - default
        - separator
        - border
    - name: marker-icon
      description: Decorative icon wrapper (aria-hidden always)
    - name: marker-content
      description: The label span - the marker text itself
  poetry/ui/menubar:
    class_name: Poetry::Ui::Menubar::Component
    identifier: poetry--ui--menubar
    bem_block: poetry-ui-menubar
    styles: []
    options:
    - name: dir
      type: symbol
      variants:
      - ltr
      - rtl
    - name: label
      type: string
      required: true
    - name: loop
      type: boolean
      default: false
    - name: value
      type: string
    slots:
    - name: menus
      many: true
      setter_args:
        menu: 0
      builders:
        menu:
          slots:
          - name: items
            many: true
            types:
            - item
            - checkbox_item
            - radio_group
            - label
            - separator
            - group
            - sub
            setter_args:
              item: 0
              checkbox_item: 0
              radio_group: 0
              label: 0
              separator: 0
              group: 0
              sub: 0
            yieldless:
            - item
            - checkbox_item
            - label
            builders:
              radio_group:
                slots:
                - name: radio_items
                  many: true
                  setter_args:
                    radio_item: 0
                  yieldless:
                  - radio_item
                required_slots:
                  radio_item: at least one radio item
              group:
                slots:
                - name: items
                  many: true
                  types:
                  - item
                  - checkbox_item
                  - radio_group
                  - label
                  - separator
                  - group
                  - sub
                  setter_args:
                    item: 0
                    checkbox_item: 0
                    radio_group: 0
                    label: 0
                    separator: 0
                    group: 0
                    sub: 0
                  yieldless:
                  - item
                  - checkbox_item
                  - label
                  builders:
                    radio_group:
                      slots:
                      - name: radio_items
                        many: true
                        setter_args:
                          radio_item: 0
                        yieldless:
                        - radio_item
                      required_slots:
                        radio_item: at least one radio item
                    sub:
                      slots:
                      - name: items
                        many: true
                        types:
                        - item
                        - checkbox_item
                        - radio_group
                        - label
                        - separator
                        - group
                        - sub
                        setter_args:
                          item: 0
                          checkbox_item: 0
                          radio_group: 0
                          label: 0
                          separator: 0
                          group: 0
                          sub: 0
                        yieldless:
                        - item
                        - checkbox_item
                        - label
                        builders:
                          radio_group:
                            slots:
                            - name: radio_items
                              many: true
                              setter_args:
                                radio_item: 0
                              yieldless:
                              - radio_item
                            required_slots:
                              radio_item: at least one radio item
                      - name: trigger
                        many: false
                        setter_args:
                          trigger: 0
                        yieldless:
                        - trigger
                      required_slots:
                        trigger: the sub-menu item
                        item: at least one item
                required_slots:
                  item: at least one item
              sub:
                slots:
                - name: items
                  many: true
                  types:
                  - item
                  - checkbox_item
                  - radio_group
                  - label
                  - separator
                  - group
                  - sub
                  setter_args:
                    item: 0
                    checkbox_item: 0
                    radio_group: 0
                    label: 0
                    separator: 0
                    group: 0
                    sub: 0
                  yieldless:
                  - item
                  - checkbox_item
                  - label
                  builders:
                    radio_group:
                      slots:
                      - name: radio_items
                        many: true
                        setter_args:
                          radio_item: 0
                        yieldless:
                        - radio_item
                      required_slots:
                        radio_item: at least one radio item
                    group:
                      slots:
                      - name: items
                        many: true
                        types:
                        - item
                        - checkbox_item
                        - radio_group
                        - label
                        - separator
                        - group
                        - sub
                        setter_args:
                          item: 0
                          checkbox_item: 0
                          radio_group: 0
                          label: 0
                          separator: 0
                          group: 0
                          sub: 0
                        yieldless:
                        - item
                        - checkbox_item
                        - label
                        builders:
                          radio_group:
                            slots:
                            - name: radio_items
                              many: true
                              setter_args:
                                radio_item: 0
                              yieldless:
                              - radio_item
                            required_slots:
                              radio_item: at least one radio item
                      required_slots:
                        item: at least one item
                - name: trigger
                  many: false
                  setter_args:
                    trigger: 0
                  yieldless:
                  - trigger
                required_slots:
                  trigger: the sub-menu item
                  item: at least one item
          - name: trigger
            many: false
            setter_args:
              trigger: 0
            yieldless:
            - trigger
          required_slots:
            trigger: the top-level menu button
            item: at least one item
    description: A horizontal bar of menus, like a desktop application menu.
    elements:
    - menu
    - trigger
    - content
    - item
    - checkbox_item
    - radio_item
    - label
    - separator
    - shortcut
    - sub_trigger
    - sub_content
    - item_indicator
    - item_indicator_state
    - indicator_check
    - indicator_circle
    - sub_indicator
    capsule: ed0fc659be02
    controllers:
    - identifier: poetry--core--menu
      targets: []
      values:
      - closeOnSelect
      - loop
      - modal
      - open
      - typeaheadTimeout
      actions:
      - activate
      - close
      - closeSub
      - keydown
      - open
      - openSub
      - openValueChanged
      - subEnter
      - subLeave
      - toggle
      - triggerKeydown
      events:
      - poetry:menu:change
      - poetry:menu:closed
      - poetry:menu:edge-navigate
      - poetry:menu:open
      - poetry:menu:select
    - identifier: poetry--core--menubar
      targets: []
      values:
      - loop
      - value
      actions:
      - hoverSlide
      - onMenuClosed
      - slideAdjacent
      - toggle
      - triggerKeydown
      - valueValueChanged
      events:
      - poetry:menubar:value-changed
    - identifier: poetry--core--popper
      targets:
      - anchor
      - arrow
      - content
      values:
      - align
      - alignOffset
      - anchor
      - anchorPoint
      - avoidCollisions
      - side
      - sideOffset
      - strategy
      actions:
      - anchorPointValueChanged
      - reposition
      - setAnchor
      - setAnchorElement
      - strategyValueChanged
      events: []
    - identifier: poetry--core--roving-focus
      targets: []
      values:
      - loop
      - manageTabindex
      - orientation
      actions:
      - keydown
      events:
      - poetry--core--roving-focus:entry
    agent_rules:
    - Use poetry_menubar for app-chrome command menus ONLY - site navigation is NavigationMenu
      (untrapped), a single actions menu is DropdownMenu.
    - 'label: is REQUIRED (the bar''s accessible name).'
    - Never put non-menuitem interactive elements directly in the bar (breaks roving
      focus + APG roles) - a Toolbar is the component for mixed controls.
    - 'shortcut: is a visual hint ONLY - it does not register a keybinding; wire real
      shortcuts separately.'
    - Do not hand-wire hover-open-from-cold; hover only slides between menus once
      one is open (the gated-hover rule).
    - In-menu item rules (destructive variant, inset, checkbox/radio) follow the DropdownMenu
      family contract.
    required_slots:
      menu: at least one menu
    parts:
    - name: menubar
      description: The role=menubar bar - one horizontal roving tab stop across the
        triggers
      states:
      - attr: data-open
        condition: some menu is open (value present; the coordinator flips the pair)
      - attr: data-closed
        condition: no menu is open
    - name: menubar-menu
      description: One logical menu - a display:contents wrapper hosting the trigger
        + content pair's menu and popper controllers
    - name: menubar-trigger
      description: The top-level menu button - a role=menuitem INSIDE the bar
      states:
      - attr: data-value
        condition: the menu's value - the coordinator's open/close key
      - attr: data-popup-open
        condition: its menu is open (written with aria-expanded; absence is the closed
          state)
      - attr: data-disabled
        condition: trigger is disabled (written together with the disabled property)
    - name: menubar-content
      description: The role=menu popup panel - positioning, animation, and the open
        state ride here
      states:
      - attr: data-open
        condition: menu is open (presence flips the pair at runtime)
      - attr: data-closed
        condition: menu is closed or animating out (the server-rendered state)
      - attr: data-side
        condition: the placement side (bottom initially; popper re-writes it after
          collision flips)
        values:
        - top
        - right
        - bottom
        - left
      - attr: data-align
        condition: the alignment against the trigger (start initially; popper re-resolves
          it)
        values:
        - start
        - center
        - end
      vars:
      - name: "--transform-origin"
        description: popper's anchor-facing animation origin
      - name: "--available-width"
        description: 'popper: viewport space left for the panel (post-flip)'
      - name: "--available-height"
        description: 'popper: viewport space left for the panel (post-flip)'
      - name: "--anchor-width"
        description: 'popper: the trigger''s measured width'
      - name: "--anchor-height"
        description: 'popper: the trigger''s measured height'
    - name: menubar-item
      description: One role=menuitem action row
      states:
      - attr: data-variant
        condition: default or destructive (the danger treatment)
      - attr: data-inset
        condition: 'indented to align with checkbox/radio item text (inset: true)'
      - attr: data-disabled
        condition: item is disabled (always written together with aria-disabled)
    - name: menubar-checkbox-item
      description: A role=menuitemcheckbox toggle row
      states:
      - attr: data-checked
        condition: checked (the controller re-writes the pair with aria-checked on
          activation)
      - attr: data-unchecked
        condition: unchecked
      - attr: data-close-on-select
        condition: per-item override of the menu's close-on-select default ("false"
          keeps the menu open)
    - name: menubar-radio-group
      description: role=group scoping one single-select value
      states:
      - attr: data-value
        condition: the selected radio value (the controller re-writes it on change)
    - name: menubar-radio-item
      description: A role=menuitemradio row inside a radio group
      states:
      - attr: data-checked
        condition: the selected radio (the controller re-writes the pair with aria-checked)
      - attr: data-unchecked
        condition: not selected
      - attr: data-value
        condition: the radio's value
    - name: menubar-item-indicator
      description: The check/circle glyph slot inside checkbox and radio items - state
        rides the parent item; the glyph stays decorative
    - name: menubar-separator
      description: role=separator rule between groups
    - name: menubar-shortcut
      description: The trailing keybinding HINT - aria-hidden, never binds the key
    - name: menubar-sub
      description: A submenu scope - hosts its own popper around the sub trigger/content
        pair
    - name: menubar-sub-trigger
      description: The role=menuitem row opening its submenu
      states:
      - attr: data-popup-open
        condition: its submenu is open (written with aria-expanded; absence is the
          closed state)
    - name: menubar-sub-content
      description: The nested role=menu panel - its own popper content on the same
        presence machinery
      states:
      - attr: data-open
        condition: submenu is open (presence flips the pair at runtime)
      - attr: data-closed
        condition: submenu is closed (the server-rendered state)
      - attr: data-side
        condition: the placement side (right/left by direction; popper resolves it
          at runtime)
        values:
        - top
        - right
        - bottom
        - left
      - attr: data-align
        condition: the alignment against the sub-trigger (popper resolves it at runtime)
        values:
        - start
        - center
        - end
      vars:
      - name: "--transform-origin"
        description: popper's anchor-facing animation origin
      - name: "--available-width"
        description: 'popper: viewport space left for the panel (post-flip)'
      - name: "--available-height"
        description: 'popper: viewport space left for the panel (post-flip)'
      - name: "--anchor-width"
        description: 'popper: the sub-trigger''s measured width'
      - name: "--anchor-height"
        description: 'popper: the sub-trigger''s measured height'
  poetry/ui/message:
    class_name: Poetry::Ui::Message::Component
    identifier: poetry--ui--message
    bem_block: poetry-ui-message
    styles: []
    options:
    - name: align
      type: symbol
      variants:
      - start
      - end
      default: start
    slots:
    - name: avatar
      many: false
    - name: header
      many: false
    - name: footer
      many: false
    description: A chat row pairing an author and avatar with message content.
    elements:
    - group
    - avatar
    - content
    - header
    - footer
    capsule: aba6da951085
    agent_rules:
    - 'One Message per turn: avatar slot + header/footer slots; the body block holds
      the Bubbles.'
    - 'align: :end is the local user''s side - set it on the Message, never on the
      Bubbles inside.'
    - The avatar slot is decorative context by default - pass meaningful sender identity
      in the header.
    - Timestamps and delivery state belong in the footer slot (it lifts the avatar
      automatically).
    parts:
    - name: message
      description: 'The chat-row root - avatar plus a content column; align: :end
        mirrors the row for the local user''s side'
      states:
      - attr: data-align
        condition: always - the resolved align
        values:
        - start
        - end
    - name: message-avatar
      description: The avatar slot's box, kept out of the content column
    - name: message-content
      description: The content column - header, the body block (the Bubbles), footer
    - name: message-header
      description: Sender identity line above the bubbles (header slot)
    - name: message-footer
      description: Timestamps / delivery state below the bubbles (footer slot - it
        lifts the avatar)
  poetry/ui/message_scroller:
    class_name: Poetry::Ui::MessageScroller::Component
    identifier: poetry--ui--message_scroller
    bem_block: poetry-ui-message_scroller
    styles: []
    options:
    - name: auto_scroll
      type: boolean
      default: true
    - name: default_scroll_position
      type: symbol
      variants:
      - start
      - end
      - last-anchor
      default: end
    - name: id
      type: string
      required: true
    - name: jump_button
      type: boolean
      default: true
    - name: preserve_scroll_on_prepend
      type: boolean
      default: true
    - name: track_visibility
      type: boolean
      default: false
    slots: []
    description: A streaming-aware transcript that keeps the latest message in view.
    elements:
    - viewport
    - content
    - item
    - button
    capsule: ca2c7a64375e
    controllers:
    - identifier: poetry--core--message-scroller
      targets:
      - button
      - content
      - spacer
      - viewport
      values:
      - autoScroll
      - defaultScrollPosition
      - preserveScrollOnPrepend
      - scrollEdgeThreshold
      - scrollMargin
      - scrollPreviousItemPeek
      - trackVisibility
      actions:
      - autoScrollValueChanged
      - defaultScrollPositionValueChanged
      - jump
      - keydownIntent
      - scrollToEnd
      - scrollToMessage
      - scrollToStart
      - syncAfterScroll
      - userScrollIntent
      events:
      - poetry--core--message-scroller:mode
      - poetry--core--message-scroller:pinned
      - poetry--core--message-scroller:scrollable
      - poetry--core--message-scroller:unpinned
      - poetry--core--message-scroller:visibility
    agent_rules:
    - Stream by UPDATING a row's text (morph/replace) - appending nodes per token
      re-announces the row to AT.
    - 'Rows are poetry_message_scroller_item(id: message.id) - the id is how anchoring
      and Streams find them.'
    - Append new turns with a Turbo Stream targeting the content element's dom id.
    - History loads PREPEND into the content element - the controller preserves the
      reading position.
    - Never nest a second scroll container inside the viewport.
    parts:
    - name: message-scroller
      description: The transcript root the controller drives - runtime scroll state
        is mirrored here
      states:
      - attr: data-mode
        condition: always once connected - the 4-state machine
        values:
        - following-bottom
        - free-scrolling
        - anchored-to-message
        - settling-jump
      - attr: data-scrollable
        condition: overflow exists - carries which edges have room (start, end, or
          both as a space-separated pair)
      - attr: data-autoscrolling
        condition: a programmatic scroll is settling - the follow-bottom release is
          suppressed while set
    - name: message-scroller-viewport
      description: The native scroll region (role=region, focusable) - the controller
        mirrors the same runtime attributes here
      states:
      - attr: data-scrollable
        condition: overflow exists - the same edge tokens as the root
      - attr: data-autoscrolling
        condition: a programmatic scroll is settling
    - name: message-scroller-content
      description: The row container and Turbo Stream append target (stable dom id
        <id>-messages); role=log announces additions
    - name: message-scroller-item
      description: One transcript row (poetry_message_scroller_item) - the id is how
        anchoring and Streams find it
      states:
      - attr: data-message-id
        condition: always - the row's message id
      - attr: data-scroll-anchor
        condition: 'anchor: true - the turn the controller holds at the reading line'
    - name: message-scroller-spacer
      description: Tail spacer faking scroll room below a short anchored turn - hidden
        at height 0
  poetry/ui/metadata_list:
    class_name: Poetry::Ui::MetadataList::Component
    identifier: poetry--ui--metadata_list
    bem_block: poetry-ui-metadata_list
    styles:
    - name: columns
      type: symbol
      variants:
      - one
      - two
      - three
      default: one
    - name: orientation
      type: symbol
      variants:
      - vertical
      - horizontal
      default: vertical
    options: []
    slots:
    - name: items
      many: true
      setter_args:
        item: 0
      yieldless:
      - item
    description: A key-value list for labeled attributes on detail pages.
    elements:
    - item
    - label
    - value
    capsule: e6791a7ee6b2
    agent_rules:
    - Record facts on a detail page belong in a MetadataList - never a hand-rolled
      grid of label/value divs (this is the <dl> the page owes its readers).
    - 'Each with_item takes label: and the value as its block - values compose freely
      (text, a Badge, a Link, a Timestamp).'
    - 'columns: :two / :three spread the facts on wide viewports; orientation: :horizontal
      puts labels beside values (the classic key/value sheet) - pick one per surface.'
    - For editable facts pair each value with its edit affordance inside the item
      block; the list itself stays read-only vocabulary.
    required_slots:
      item: 'at least one item (label: plus the value block)'
    parts:
    - name: metadata-list
      description: The <dl> root - the record's fact sheet
      states:
      - attr: data-orientation
        condition: always - label placement
        values:
        - vertical
        - horizontal
      - attr: data-columns
        condition: always - the column count word
        values:
        - one
        - two
        - three
    - name: metadata-list-item
      description: One fact group (a <div> holding its <dt>/<dd> pair)
    - name: metadata-list-label
      description: The fact's name (<dt>) - muted, small
    - name: metadata-list-value
      description: The fact's value (<dd>) - composes text, badges, links
  poetry/ui/meter:
    class_name: Poetry::Ui::Meter::Component
    identifier: poetry--ui--meter
    bem_block: poetry-ui-meter
    styles: []
    options:
    - name: label
      type: string
      required: true
    - name: max
      type: integer
      default: 100
    - name: min
      type: integer
      default: 0
    - name: show_value
      type: boolean
      default: true
    - name: value
      type: integer
      required: true
    - name: value_label
      type: string
    slots: []
    description: A gauge that shows a quantity within a known range.
    elements: []
    capsule: 328a98df3a37
    agent_rules:
    - A quantity within a range is a Meter (disk, seats, strength); an operation's
      completion over time is Progress. There is NO indeterminate meter - unknown
      duration means Spinner.
    - 'label: is REQUIRED - the meter''s accessible name and visible caption.'
    - 'value_label: replaces the visible readout verbatim ("3 of 4 seats"); without
      it the readout shows the percentage of the RANGE. No aria-valuetext - ARIA 1.2
      deprecated it on role=meter; aria-valuenow carries the value.'
    parts:
    - name: meter
      description: Root (role=meter, aria-value*, and the accessible name); label,
        readout, and track stack here
    - name: meter-label
      description: The visible caption span (label:)
    - name: meter-value
      description: 'The readout - value_label: verbatim, else the range percentage;
        renders unless show_value: false'
    - name: meter-track
      description: The full-width rail (Progress's cn chrome)
    - name: meter-indicator
      description: The filled bar - inline width percentage of the range
  poetry/ui/native_select:
    class_name: Poetry::Ui::NativeSelect::Component
    identifier: poetry--ui--native_select
    bem_block: poetry-ui-native_select
    styles: []
    options:
    - name: disabled
      type: boolean
      default: false
    - name: id
      type: string
    - name: invalid
      type: boolean
      default: false
    - name: label
      type: string
    - name: name
      type: string
    - name: size
      type: symbol
      variants:
      - default
      - sm
      default: default
    slots: []
    description: A styled wrapper around the real native select control.
    elements:
    - select
    - icon
    - option
    - optgroup
    capsule: 0aac4b538ae8
    agent_rules:
    - This is a REAL <select> - use it for plain picking; the JS Select is for styled
      options.
    - 'Pair it with a Label (for_id: its id) or a Field - a bare select has no accessible
      name.'
    - 'The fast path is options: [[label, value], ...] + selected:; a content block
      overrides it.'
    parts:
    - name: native-select-wrapper
      description: Relative shell around the select and the chevron - dims the pair
        when the select is disabled
      states:
      - attr: data-size
        condition: always - the resolved size
        values:
        - default
        - sm
    - name: native-select
      description: The real <select> - appearance-none (the chevron replaces the native
        arrow); platform picker and form submission stay native
      states:
      - attr: data-size
        condition: always - the resolved size (mirrors the wrapper)
        values:
        - default
        - sm
    - name: native-select-icon
