    - name: label
      type: string
      description: The readonly input's accessible name when no Label/Field association
        exists.
    - name: text_to_copy
      type: string
      description: 'Overrides what lands on the clipboard when the displayed value
        truncates: display short, copy full.'
    - name: value
      type: string
      required: true
      description: 'The displayed text - also what copies, unless text_to_copy: overrides
        it.'
    slots: []
    description: A read-only value with a button to copy it to the clipboard.
    elements:
    - input
    - icon_stack
    - icon_copy
    - icon_check
    capsule: 10135cb290ae
    controllers:
    - identifier: poetry--core--clipboard-text
      targets:
      - input
      - source
      values:
      - message
      - text
      actions:
      - copy
      events:
      - poetry:clipboard-text:copied
    agent_rules:
    - A read-only value with one copy affordance (poetry_clipboard_text) - API keys,
      install commands, IDs. Editable text is an Input; a secret that needs masking
      is a SensitiveInput.
    - 'value: is what SHOWS; text_to_copy: overrides what lands on the clipboard when
      the display truncates - never truncate the copied text itself.'
    - 'Give it label: (or compose under a Field/Label) - the readonly input still
      needs its accessible name.'
    parts:
    - name: clipboard-text
      description: Root - the controller rides here
      states:
      - attr: data-copied
        condition: stamped for a beat after a successful copy (the stacked copy/check
          glyphs swap off it)
    - name: clipboard-text-group
      description: The bordered field surface - InputGroup's chrome
    - name: input-group-control
      description: The readonly mono <input> showing the value - selectable, never
        editable; InputGroup's control slot
    - name: input-group-addon
      description: The trailing cell holding the copy affordance - InputGroup's addon
        vocabulary
      states:
      - attr: data-align
        condition: always - inline-end holds the copy button
        values:
        - inline-end
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--clipboard-text
        registers: true
        values:
        - name: message
        - name: text
          conditional: if
    - element: input
      controllers:
      - identifier: poetry--core--clipboard-text
        targets:
        - name: input
    - element: copy_button
      controllers:
      - identifier: poetry--core--clipboard-text
        actions:
        - method: copy
          'on': click
  poetry/ui/code_block:
