  poetry/ui/input_otp:
    class_name: Poetry::Ui::InputOtp::Component
    identifier: poetry--ui--input_otp
    bem_block: poetry-ui-input_otp
    styles: []
    options:
    - name: disabled
      type: boolean
      default: false
      description: Disables the native input (the whole row dims).
    - name: groups
      type:
      description: Cell clustering, e.g. [3, 3] -> two groups with a separator.
    - name: invalid
      type: boolean
      default: false
      description: aria-invalid on the input; the cells mirror the destructive treatment
        (set by Field/FormBuilder from the failed verify).
    - name: length
      type: integer
      required: true
      description: Code length = slot count = maxlength.
    - name: name
      type: string
      required: true
      description: The ONE input serializes params[name] = the code string.
    - name: pattern
      type:
      default: digits
      description: ":digits (numeric keypad) | :alphanumeric | a custom Regexp - the
        per-char filter + the native pattern attribute + inputmode."
    - name: required
      type: boolean
      default: false
      description: 'aria-required on the input - never native required (the Field
        rule: required rides server-side validation + aria).'
    - name: separator
      type: boolean
      default: true
      description: role=separator dash between groups (meaningful with 2+ groups).
    - name: value
      type: string
      description: Current code (server-rendered into the input AND the cells). The
        FormBuilder deliberately never round-trips it (a rejected code is dead).
    slots: []
    description: A fixed-length, segmented input for one-time passcodes.
    elements:
    - input
    - group
    - separator
    - slot
    - caret
    - caret_bar
    capsule: 760a5db749e1
    controllers:
    - identifier: poetry--core--otp
      targets:
      - input
      - slot
      values:
      - length
      - pattern
      actions:
      - focusInput
      - paste
      - sync
      events:
      - poetry:otp:change
      - poetry:otp:complete
    agent_rules:
    - Use poetry_input_otp / form.otp_field - NEVER build per-cell inputs (n Tab stops,
      broken paste, broken SMS autofill, unnameable cells).
    - Label via Field always ('Verification code'); put the length in the hint.
    - groups must sum to length (ArgumentError).
    - Do NOT auto-submit on poetry:otp:complete without a visible confirm affordance
      - silent submit on the 6th keystroke strands users who mistyped char 3.
    - 'Never pre-fill value: with a real code in previews/test fixtures beyond dummies;
      never log the value (it is a live credential).'
    - InputOTP is for CODES - passwords use Input type=password, longer identifiers
      use Input.
    parts:
    - name: input-otp-container
      description: Root row (forced dir=ltr - slot order equals string index order
        even on RTL pages) wrapping the real input and the mirror cells
    - name: input-otp
      description: THE real native <input> (autocomplete one-time-code) stretched
        invisibly over the row - the only AT and serialization surface
    - name: input-otp-group
      description: 'One aria-hidden cluster of mirror cells (groups: clustering)'
    - name: input-otp-slot
      description: One presentational mirror cell - paints its char and the active-cell
        ring
      states:
      - attr: data-active
        condition: '"true" while the native caret sits on this cell (the controller
          projects selectionStart while the input is focused; the server renders "false")'
        values:
        - 'true'
        - 'false'
    - name: input-otp-caret
      description: The fake-caret overlay - hidden server-side; the controller unhides
        it on the active EMPTY cell
    - name: input-otp-separator
      description: The between-groups dash - role=separator kept for parity but aria-hidden
        (a recorded divergence)
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--otp
        registers: true
        values:
        - name: length
        - name: pattern
        actions:
        - method: focusInput
          'on': click
    - element: input
      controllers:
      - identifier: poetry--core--otp
        targets:
        - name: input
        actions:
        - method: sync
          'on':
          - input
          - focus
          - blur
        - method: paste
          'on': paste
    - element: slot
      controllers:
      - identifier: poetry--core--otp
        targets:
        - name: slot
