    agent_rules:
    - 'with_trigger(compose: true) { |wiring| ... } composes YOUR control as the trigger:
      the block is yielded the trigger wiring (the Stimulus behavior the overlay needs;
      poppers add id/aria and their trigger slot, modals hand only the open action)
      - splat it onto a wiring-free control (poetry_sidebar_menu_button, a plain tag);
      without compose: the classic composed Button renders.'
    - Use poetry_dropdown_menu - never hand-roll role=menu popups with Tailwind.
    - Items are ACTIONS. Choosing a form VALUE is a Select/Combobox - do not fake
      it with radio items.
    - 'Navigation items pass with_item(href:) (external: for a new tab); a form action
      (sign-out, a DELETE) passes with_item(submit:, method:). The item renders AS
      the anchor / submit button (role=menuitem on the <a> or <button>) - one interactive
