  poetry/ui/input:
    class_name: Poetry::Ui::Input::Component
    identifier: poetry--ui--input
    bem_block: poetry-ui-input
    styles: []
    options:
    - name: disabled
      type: boolean
      default: false
      description: Disables the native input.
    - name: invalid
      type: boolean
      default: false
      description: Marks the input aria-invalid - the error skin keys on the attribute.
    - name: mask
      type: string
      description: 'Format-as-you-type mask descriptor (''(999) 999-9999''). Extra
        knobs (slot char, always-show, auto-clear) ride Stimulus values via data:
        - one declarative option covers the common case.'
    - name: name
      type: string
      description: The submitted param name.
    - name: placeholder
      type: string
      description: Native placeholder text - not a substitute for a Label.
    - name: type
      type: string
      default: text
      description: The native type attribute (text, email, password, file, ...).
    - name: value
      type: string
      description: The current value.
    slots: []
    description: A form control for entering a single line of text.
    elements: []
    capsule: 6c6f930e4e44
    controllers:
    - identifier: poetry--core--mask
      targets: []
      values:
      - alwaysShowMask
      - autoClear
      - mask
      - showMaskOnFocus
      - slotChar
      - upcase
      actions: []
      events:
      - poetry:mask:change
      - poetry:mask:complete
    agent_rules:
    - Inside a form, never render Input directly - use the FormBuilder's field (it
      wires ids, errors, and aria).
    - Error styling comes from aria-invalid, set from model errors - never hand-toggle
      error classes.
    - 'mask: formats as the user types (''(999) 999-9999''; 9=digit, a=letter, A=upper,
      *=alnum, #=sign/digit, \\ escapes, ? makes the rest optional) - the MASKED text
