# poetry component registry - generated by `bin/rake registry:generate` FROM SOURCE.
# DO NOT EDIT: CI verifies this file matches a fresh build (rake registry:verify).
---
components:
  poetry/ui/accordion:
    class_name: Poetry::Ui::Accordion::Component
    identifier: poetry--ui--accordion
    bem_block: poetry-ui-accordion
    styles: []
    options:
    - name: collapsible
      type: boolean
      default: false
    - name: heading_level
      type: symbol
      variants:
      - h2
      - h3
      - h4
      - h5
      - h6
      default: h3
    - name: open
      type: list
      default: dynamic
    - name: type
      type: symbol
      variants:
      - single
      - multiple
      default: single
    slots:
    - name: items
      many: true
      setter_args:
        item: 0
      yieldless:
      - item
    description: A vertically stacked set of interactive headings that each reveal
      a section of content.
    elements:
    - item
    - header
    - trigger
    - indicator
    - content
    - inner
    capsule: 3be341c9616e
    controllers:
    - identifier: poetry--core--accordion
      targets: []
      values:
      - collapsible
      - type
      actions:
      - toggle
      events:
      - poetry--core--accordion:change
    - identifier: poetry--core--roving-focus
      targets: []
      values:
      - loop
      - manageTabindex
      - orientation
      actions:
      - keydown
      events:
      - poetry--core--roving-focus:entry
    agent_rules:
    - Items via with_item(value:, title:) { panel content } - value is the open-state
      key.
    - 'type: :single (default) opens one at a time; pass collapsible: true to allow
      closing it.'
    - 'Server-render the open item(s) via open: %w[value] - never toggle data-open/data-closed
      by hand.'
    - 'heading_level: fits the page outline (h3 default) - the trigger button lives
      inside it.'
    - The chevron is built in - never add another indicator icon to the trigger.
    - 'disabled: true on with_item locks that item (native disabled on the trigger;
      roving focus skips it).'
    required_slots:
      item: at least one item
    parts:
    - name: accordion
      description: The list root - both controllers (the open-set machine and roving
        focus) ride here
      states:
      - attr: data-orientation
        condition: always vertical - the only axis the accordion ships
        values:
        - vertical
    - name: accordion-item
      description: One value-keyed section wrapping its header and panel
      states:
      - attr: data-open
        condition: the item is expanded (server-rendered from open:; the controller
          flips the pair at runtime)
      - attr: data-closed
        condition: the item is collapsed
      - attr: data-value
        condition: the item's open-state key (always present)
      - attr: data-disabled
        condition: 'with_item(disabled: true) - the item is locked (styling hook;
          the trigger carries the native disabled attribute)'
    - name: accordion-header
      description: The heading element (heading_level:, h3 default) hosting the trigger
        button
    - name: accordion-trigger
      description: The toggle button inside the header - the chevron rotation rides
        aria-expanded, not a data attribute
      states:
      - attr: data-panel-open
        condition: its panel is open (Base UI trigger parity, controller-written;
          absent while closed)
      - attr: data-disabled
        condition: 'with_item(disabled: true) - stamped beside the native disabled
          attribute; roving focus filters it out at query time'
    - name: accordion-content
      description: The role=region panel - the presence animation and the measured
        height var ride here
      states:
      - attr: data-open
        condition: panel is open or entering
      - attr: data-closed
        condition: panel is closed or animating out (hidden lands after the exit finishes)
      vars:
      - name: "--accordion-panel-height"
        description: the measured content height (controller-written) that feeds the
          accordion-down/up keyframes
  poetry/ui/alert:
    class_name: Poetry::Ui::Alert::Component
    identifier: poetry--ui--alert
    bem_block: poetry-ui-alert
    styles:
    - name: variant
      type: symbol
      variants:
      - default
      - destructive
      default: default
      required: true
    options: []
    slots:
    - name: icon
      many: false
      component: poetry/ui/icon
      setter_args:
        icon: 1
    - name: title
      many: false
    description: A callout that highlights an important inline message.
    elements:
    - title
    - description
    capsule: 46f5083339ca
    agent_rules:
    - Use poetry_alert for inline callouts - it carries role/aria-live; never a hand-rolled
      div.
    - destructive announces assertively (role=alert) - reserve it for errors, not
      emphasis.
    parts:
    - name: alert
      description: The callout root - role rides the variant (destructive announces
        assertively via role=alert; default is a polite role=status)
      states:
      - attr: data-variant
        condition: always - the resolved variant
        values:
        - default
        - destructive
    - name: alert-title
      description: The heading line, rendered when the title slot is set
    - name: alert-description
      description: The body copy - the content block renders here
  poetry/ui/alert_dialog:
    class_name: Poetry::Ui::AlertDialog::Component
    identifier: poetry--ui--alert_dialog
    bem_block: poetry-ui-alert_dialog
    styles:
    - name: size
      type: symbol
      variants:
      - default
      - sm
      default: default
      required: true
    options: []
    slots:
    - name: trigger
      many: false
      component: poetry/ui/button
      setter_args:
        trigger: 0
      yieldless:
      - trigger
    - name: title
      many: false
    - name: description
      many: false
    - name: media
      many: false
    - name: action
      many: false
      component: poetry/ui/button
      setter_args:
        action: 0
      yieldless:
      - action
    - name: cancel
      many: false
      component: poetry/ui/button
      setter_args:
        cancel: 0
      yieldless:
      - cancel
    description: A modal dialog that interrupts the user and expects a response.
    elements:
    - content
    - header
    - header_with_media
    - header_size_default
    - header_size_default_with_media
    - media
    - media_size_default
    - title
    - title_beside_media
    - description
    - footer
    - footer_size_sm
    capsule: e03c6466aa44
    controllers:
    - identifier: poetry--core--dialog
      targets:
      - dialog
      values:
      - dismissible
      - hotkey
      actions:
      - backdropClose
      - close
      - lockScroll
      - open
      - toggle
      - unlockScroll
      events: []
    agent_rules:
    - 'Destructive confirmations use AlertDialog with with_action(variant: :destructive)
      - never a bare Dialog, never data-turbo-confirm.'
    - with_title AND with_description are REQUIRED (both raise).
    - The action must be an explicit user activation - agents NEVER auto-submit the
      action.
    - No extra form fields inside an AlertDialog - if input is needed, use a Dialog.
    - 'Cancel keeps variant: :outline; do not make cancel visually primary.'
    required_slots:
      title: the accessible name
      description: the alertdialog must explain itself
      action: the confirming choice
      cancel: the safe way out
    parts:
    - name: alert-dialog
      description: Root wrapper around the trigger and the <dialog> element
    - name: alert-dialog-content
      description: The role=alertdialog <dialog> panel - sizing, animation, and the
        open state ride here
      states:
      - attr: data-open
        condition: panel is open (the shared dialog controller flips the pair at runtime)
      - attr: data-closed
        condition: panel is closed (the server-rendered state)
      - attr: data-size
        condition: always - the resolved size
        values:
        - default
        - sm
    - name: alert-dialog-header
      description: Title block - holds the optional media well, the title, and the
        description
    - name: alert-dialog-title
      description: The heading - the alertdialog's accessible name (required slot)
    - name: alert-dialog-description
      description: The explanation, wired to aria-describedby (required slot)
    - name: alert-dialog-footer
      description: The choice row - cancel then action
  poetry/ui/aspect_ratio:
    class_name: Poetry::Ui::AspectRatio::Component
    identifier: poetry--ui--aspect_ratio
    bem_block: poetry-ui-aspect_ratio
    styles: []
    options:
    - name: ratio
      type: string
      required: true
    slots: []
    description: Locks its content to a fixed width-to-height ratio.
    elements: []
    capsule: e82cf8a38845
    agent_rules:
    - 'Pass ratio: as a string fraction (''16/9'', ''1/1'') - Ruby''s 16/9 is integer
      division (1).'
    - The child fills the box itself (size-full object-cover on an image).
    parts:
    - name: aspect-ratio
      description: The ratio-locked box - the content block fills it
      vars:
      - name: "--ratio"
        description: 'always - the ratio: fraction verbatim (''16/9''), consumed by
          the theme''s aspect-ratio rule'
  poetry/ui/attachment:
    class_name: Poetry::Ui::Attachment::Component
    identifier: poetry--ui--attachment
    bem_block: poetry-ui-attachment
    styles:
    - name: orientation
      type: symbol
      variants:
      - horizontal
      - vertical
      default: horizontal
      required: true
    - name: size
      type: symbol
      variants:
      - default
      - sm
      - xs
      default: default
      required: true
    options:
    - name: state
      type: symbol
      variants:
      - idle
      - uploading
      - processing
      - error
      - done
      default: done
    slots:
    - name: media
      many: false
      setter_args:
        media: 0
      setter_kwargs:
        media:
        - variant
      yieldless:
      - media
    - name: title
      many: false
    - name: description
      many: false
    - name: actions
      many: true
      setter_args:
        action: 0
      yieldless:
      - action
    - name: trigger
      many: false
      setter_args:
        trigger: 0
      yieldless:
      - trigger
    description: A file or image chip showing its name, type, and size.
    elements:
    - media
    - content
    - title
    - description
    - actions
    - trigger
    - group
    capsule: c9f9fe0aecb0
    agent_rules:
    - 'State is server-owned: render data-upload-state and flip it by Turbo Stream
      replace - never toggle it in JS.'
    - 'with_media(variant: :image) wraps the caller''s <img>; file names and URLs
      are user content - never render them html_safe.'
    - 'Actions are with_action(...) poetry Buttons (ghost/icon-xs defaults) - each
      needs label: (icon-only).'
    - with_trigger makes the whole chip the control (a stretched overlay UNDER the
      actions) - don't also wrap the chip in a link.
    - error state needs a with_description explaining the failure - the tint alone
      is not the message.
    parts:
    - name: attachment
      description: The chip root - the server-owned upload lifecycle rides here (flip
        data-upload-state by re-render / Turbo Stream replace)
      states:
      - attr: data-upload-state
        condition: always - the resolved state
        values:
        - idle
        - uploading
        - processing
        - error
        - done
      - attr: data-size
        condition: always - the resolved size
        values:
        - default
        - sm
        - xs
      - attr: data-orientation
        condition: always - the resolved orientation
        values:
        - horizontal
        - vertical
    - name: attachment-media
      description: The media slot's box - the icon tile or the caller's <img>
      states:
      - attr: data-variant
        condition: always - the media variant
        values:
        - icon
        - image
    - name: attachment-content
      description: Text column wrapping title/description - renders when either slot
        is set
    - name: attachment-title
      description: The file name line (title slot; user content, never html_safe)
    - name: attachment-description
      description: Muted metadata / failure copy under the title
    - name: attachment-actions
      description: Row of with_action poetry Buttons
    - name: attachment-status
      description: sr-only role=status announcement for the in-flight and error states
        (uploading/processing/error)
  poetry/ui/avatar:
    class_name: Poetry::Ui::Avatar::Component
    identifier: poetry--ui--avatar
    bem_block: poetry-ui-avatar
    styles: []
    options:
    - name: label
      type: string
      required: true
    - name: size
      type: symbol
      variants:
      - default
      - sm
      - lg
      default: default
    - name: src
      type: string
    slots:
    - name: badge
      many: false
    description: A user's image with an initials fallback.
    elements:
    - image
    - fallback
    - badge
    - group
    - group_count
    capsule: e30772918548
    agent_rules:
    - 'label: (the person''s name) is REQUIRED - it is the avatar''s accessible name
      (role=img).'
    - The content block is the fallback (initials) and is also required - it is what
      shows while the image loads or when it fails.
    - The badge slot is decorative (a presence dot); put the status meaning in label:,
      not in the badge.
    - Stack avatars with poetry_avatar_group; the overflow count is poetry_avatar_group_count.
    requires_content: the initials fallback
    parts:
    - name: avatar
      description: Root span (role=img carrying the accessible name) - fallback, image,
        and badge layer inside it
      states:
      - attr: data-size
        condition: always - the resolved size
        values:
        - default
        - sm
        - lg
    - name: avatar-fallback
      description: The initials layer (the content block) - always in the DOM, showing
        until the image covers it
    - name: avatar-image
      description: 'The <img> layered absolutely over the fallback - only when src:
        is given; a failed load paints nothing'
    - name: avatar-badge
      description: The decorative presence dot (the badge slot), bottom-right
  poetry/ui/badge:
    class_name: Poetry::Ui::Badge::Component
    identifier: poetry--ui--badge
    bem_block: poetry-ui-badge
    styles:
    - name: variant
      type: symbol
      variants:
      - default
      - secondary
      - destructive
      - outline
      - success
      - warning
      - info
      default: default
      required: true
    options:
    - name: href
      type: string
    slots: []
    description: A small count or status descriptor.
    elements: []
    capsule: df6d977c62f8
    agent_rules:
    - Badges are non-interactive status labels - never attach click handlers; use
      Button for actions. The one interactive form is href:, which renders the badge
      AS a real link (a navigational chip - the themes' [a&]:hover treatments activate).
    - 'The visible text is the content block: render ... { "beta" } - there is no
      label: option.'
    - Pick the variant by intent (destructive = error states; success/warning/info
      = record status, e.g. Fulfilled/Processing/Syncing), never by color preference.
    - 'Status badges on one surface read as a SET: keep one treatment family per table/list
      - the soft trio (+ outline for neutral) together, or the solid pair together;
      never a solid destructive pill inside a soft status column (design lint flags
      the mix).'
    requires_content: the visible status text
    parts:
    - name: badge
      description: 'The status pill itself (a <span>; a real <a> when href: is given)
        - the whole component is this one element'
      states:
      - attr: data-variant
        condition: always - the resolved variant
        values:
        - default
        - secondary
        - destructive
        - outline
        - success
        - warning
        - info
  poetry/ui/breadcrumb:
    class_name: Poetry::Ui::Breadcrumb::Component
    identifier: poetry--ui--breadcrumb
    bem_block: poetry-ui-breadcrumb
    styles: []
    options: []
    slots:
    - name: items
      many: true
      setter_args:
        item: 1
      yieldless:
      - item
    - name: separator
      many: false
      setter_args:
        separator: 0
      setter_kwargs:
        separator:
        - icon
      yieldless:
      - separator
    description: Shows the path to the current page as a trail of links.
    slot_extras:
    - ellipsis
    elements:
    - list
    - item
    - link
    - page
    - separator
    - ellipsis
    capsule: 898795a6a491
    agent_rules:
    - Declare the trail with with_item(label, href:) - never hand-build the nav/ol/li
      chain.
    - 'The current page is the item WITHOUT href: (it renders aria-current=page, not
      a link).'
    - Collapse a long middle with with_ellipsis - it announces 'More' to screen readers.
    - A BLOCK item (with_item { ... }) renders your content inside the <li> - the
      seat for a dropdown crumb or a custom-rendered link; you own its semantics (aria-current
      only applies to label items).
    - 'with_separator(icon: :dot) - or a block - replaces the chevron in EVERY gap;
      the default chevron RTL-flips, a custom glyph is used as given.'
    required_slots:
      item: at least one item
    parts:
    - name: breadcrumb
      description: The <nav> landmark (aria-label=breadcrumb) around the trail
    - name: breadcrumb-list
      description: The <ol> laying crumbs and separators out as one wrapping row
    - name: breadcrumb-item
      description: One <li> of the trail - wraps a link, the current page, the ellipsis,
        or a block item's own content (a dropdown crumb, a custom link)
    - name: breadcrumb-link
      description: 'A crumb with href: - a real <a> to an ancestor page'
    - name: breadcrumb-page
      description: The current page (the item without href:) - aria-current=page,
        not a link
    - name: breadcrumb-separator
      description: The chevron <li> between crumbs - presentational, aria-hidden
    - name: breadcrumb-ellipsis
      description: The collapsed-middle glyph (with_ellipsis) - aria-hidden; a sibling
        sr-only 'More' announces it
  poetry/ui/bubble:
    class_name: Poetry::Ui::Bubble::Component
    identifier: poetry--ui--bubble
    bem_block: poetry-ui-bubble
    styles:
    - name: variant
      type: symbol
      variants:
      - default
      - secondary
      - muted
      - tinted
      - outline
      - ghost
      - destructive
      default: default
      required: true
    options:
    - name: align
      type: symbol
      variants:
      - start
      - end
      default: start
    - name: href
      type: string
    - name: tag
      type: symbol
      variants:
      - div
      - button
      - a
      default: div
    slots:
    - name: reactions
      many: false
      setter_args:
        reactions: 0
      setter_kwargs:
        reactions:
        - label
        - side
        - align
      yieldless:
      - reactions
    description: A chat message bubble aligned to its sender.
    elements:
    - group
    - content
    - reactions
    capsule: 0dbec63bcb69
    agent_rules:
    - One Bubble per message; stack a sender's run inside poetry_bubble_group.
    - 'Quick replies are tag: :button (with the caller''s data-action) or tag: :a
      + href: - never a click handler on a div.'
    - ghost is for tool output / system text flowing full-width - not a visual preference.
    - 'Reactions REQUIRE label: (the accessible name for the cluster).'
    - Inside a Message, alignment follows the Message's align - do not set both.
    parts:
    - name: bubble
      description: The message surface root - variant and alignment ride here
      states:
      - attr: data-variant
        condition: always - the resolved variant
        values:
        - default
        - secondary
        - muted
        - tinted
        - outline
        - ghost
        - destructive
      - attr: data-align
        condition: always - the resolved align
        values:
        - start
        - end
    - name: bubble-content
      description: The body (<div>, or a <button>/<a> quick reply via tag:) - the
        content block renders here
    - name: bubble-reactions
      description: The reactions pill overlay (role=group, named by label:)
      states:
      - attr: data-side
        condition: always - which edge the pill overlays (default bottom)
      - attr: data-align
        condition: always - placement along that edge (default end)
  poetry/ui/button:
    class_name: Poetry::Ui::Button::Component
    identifier: poetry--ui--button
    bem_block: poetry-ui-button
    styles:
    - name: size
      type: symbol
      variants:
      - default
      - xs
      - sm
      - lg
      - icon
      - icon-xs
      - icon-sm
      - icon-lg
      default: default
      required: true
    - name: variant
      type: symbol
      variants:
      - default
      - destructive
      - outline
      - secondary
      - ghost
      - link
      default: default
      required: true
    options:
    - name: disabled
      type: boolean
      default: false
    - name: href
      type: string
    - name: label
      type: string
    - name: loading
      type: boolean
      default: false
    - name: tag
      type: symbol
      variants:
      - button
      - a
      default: button
    - name: type
      type: symbol
      variants:
      - button
      - submit
      - reset
      default: button
    slots:
    - name: leading
      many: false
    - name: trailing
      many: false
    description: Triggers an action or event, such as submitting a form or opening
      a dialog.
    elements: []
    capsule: 2f3c60cb16e5
    agent_rules:
    - Use poetry_button - never a raw <button> with hand-written Tailwind.
    - 'The visible text is the content block: poetry_button { "Save" }. label: is
      ONLY the accessible name.'
    - 'Icon-only buttons (size: :icon*) MUST pass label: (the accessible name).'
    - 'Link-styled actions use variant: :link - not <a> with button classes.'
    - 'Navigation wearing button styling: pass href: (renders a real <a>; tag: :a
      is implied) - never onclick navigation.'
    - 'Loading via loading: - never a manual disabled + spinner.'
    - Never nest an interactive element inside a Button.
    - Pick the variant by intent; one primary (default) action per view.
    requires_any:
    - hint: 'nothing visible renders without one - label: is only the accessible name'
      content: true
      slots:
      - leading
      - trailing
      options:
      - loading
    parts:
    - name: button
      description: 'The rendered control itself (<button>, or <a> when tag: :a) -
        every visual state rides here'
      states:
      - attr: data-variant
        condition: always - the resolved variant
        values:
        - default
        - destructive
        - outline
        - secondary
        - ghost
        - link
      - attr: data-size
        condition: always - the resolved size
        values:
        - default
        - xs
        - sm
        - lg
        - icon
        - icon-xs
        - icon-sm
        - icon-lg
      - attr: data-loading
        condition: 'loading: is set (aria-busy rides along)'
    - name: icon
      description: Wrapper span around leading/trailing slot content - sizes and centers
        whatever it holds
    - name: label
      description: 'The content block''s span (display: contents - children join the
        root''s flex row directly)'
    - name: spinner
      description: 'The loading indicator, swapped in for the leading icon while loading:'
  poetry/ui/button_group:
    class_name: Poetry::Ui::ButtonGroup::Component
    identifier: poetry--ui--button_group
    bem_block: poetry-ui-button_group
    styles:
    - name: orientation
      type: symbol
      variants:
      - horizontal
      - vertical
      default: horizontal
      required: true
    options: []
    slots: []
    description: Visually joins adjacent buttons and controls into one group.
    elements:
    - text
    - separator
    capsule: f0d4ed413dc4
    agent_rules:
    - Members go in the content block - the group's selectors join ANY data-slot children
      (buttons, inputs, select triggers); never hand-round the inner corners.
    - Give the group an aria-label when the page has more than one (role=group is
      unnamed by default).
    - A visual divider between members is poetry_button_group_separator, not a styled
      border.
    requires_content: its member controls
    parts:
    - name: button-group
      description: The role=group root - its selectors join ANY data-slot children
        into the segmented unit
      states:
      - attr: data-orientation
        condition: the join axis
        values:
        - horizontal
        - vertical
    - name: button-group-text
      description: A non-button member (the poetry_button_group_text helper's div)
        - a text affix joined like a button
