    identifier: poetry--ui--drawer
    bem_block: poetry-ui-drawer
    styles:
    - name: direction
      type: symbol
      variants:
      - down
      - up
      - left
      - right
      default: down
      required: true
      description: The dismiss direction - :down is the mobile bottom sheet; the edge
        chrome and swipe axis derive from it.
    options:
    - name: content_class
      type: string
      description: Extra classes merged onto the <dialog> panel (e.g. "max-h-[50vh]"
        caps a top/bottom sheet).
    - name: dismissible
      type: boolean
      default: true
      description: Backdrop clicks close the dialog; false keeps confirmations from
        being dismissed accidentally (Esc still closes).
    - name: modal
      type: boolean
      default: true
      description: Non-modal (false) opens with show() - no top layer, no scrim, no
        focus trap, no scroll lock; the page behind stays interactive. Esc (while
        focus is inside), the swipe, and any wired close button still exit; there
        is no backdrop to click, so pointer dismissal is off by nature.
    - name: show_swipe_handle
      type: boolean
      default: false
      description: Renders the grab pill so the swipe gesture is discoverable.
    - name: snap_points
      type:
      description: 'Preset resting heights for a bottom sheet, ascending: fractions
        of the full height (0..1] or CSS px/rem lengths (["31rem", 1]). The popup
        runs full-height and opens at the first point; drags move between points,
        below the first dismisses. direction: :down only.'
    slots:
    - name: trigger
      many: false
      description: 'The trigger is a poetry Button wired to open the dialog - agents
        pass Button props: with_trigger(variant: :outline) { "Open" }.'
      component: poetry/ui/button
      setter_args:
        trigger: 0
      yieldless:
      - trigger
    - name: title
      many: false
      description: The heading - the dialog's accessible name; required.
    - name: description
      many: false
      description: Muted copy under the title, wired to aria-describedby.
    - name: footer
      many: false
      description: The action row at the bottom of the panel.
    description: A gesture-driven panel that slides in from a screen edge.
    elements:
    - content
    - handle
    - header
    - nonmodal
    - footer
    - title
    - description
    - body
    capsule: b42028165fc3
    controllers:
    - identifier: poetry--core--drawer
      targets:
      - dialog
      values:
      - direction
      - dismissible
      - hotkey
      - modal
      - snapPoints
      actions:
      - backdropClose
      - close
      - escapeClose
      - lockScroll
      - open
      - swipeCancel
      - swipeEnd
      - swipeMove
      - swipeStart
      - toggle
      - unlockScroll
      events: []
    agent_rules:
    - Open drawers with with_trigger(...) - never a hand-wired button.
    - with_title is REQUIRED (the accessible name) - the inherited Dialog rule.
    - 'direction: is the DISMISS direction: :down is the mobile bottom sheet (the
      default); left/right make an edge panel - prefer Sheet on desktop.'
    - 'show_swipe_handle: true renders the grab pill - use it on bottom sheets so
      the gesture is discoverable.'
    - Esc and the backdrop still dismiss (the platform trap) - the swipe is an addition,
      never the only way out.
    - 'modal: false keeps the page interactive (no scrim, no focus trap) - pair a
      wired footer close; Esc while focus is inside still exits.'
    - 'snap_points: ["31rem", 1] snaps a bottom sheet between preset heights (ascending
      fractions or px/rem lengths; opens at the first) - direction: :down only.'
    required_slots:
      title: the accessible name
    parts:
    - name: drawer
      description: Root wrapper around the trigger and the <dialog> element
    - name: drawer-content
      description: The <dialog> popup - the edge chrome, presence animation, and the
        swipe contract all ride here (::backdrop inherits the swipe vars, so the overlay
        fade rides along)
      states:
      - attr: data-open
        condition: popup is open (the controller flips the pair at runtime)
      - attr: data-closed
        condition: popup is closed or animating out (the server-rendered state)
      - attr: data-swipe-direction
        condition: always - the dismiss direction
        values:
        - down
        - up
        - left
        - right
      - attr: data-swiping
        condition: a pointer drag is tracking (transitions go duration-0 - the drawer
          follows the finger)
      - attr: data-snap-points
        condition: 'snap_points: present - the popup runs full-height and --drawer-snap-point-offset
          rests it at the current point'
      - attr: data-starting-style
        condition: the enter transition's first frame (the presence helper's two-frame
          trick)
      - attr: data-ending-style
        condition: held through the exit transition before the native close()
      vars:
      - name: "--drawer-swipe-movement-x"
        description: px dragged toward a left/right dismissal (controller-written
          during swipes)
      - name: "--drawer-swipe-movement-y"
        description: px dragged toward an up/down dismissal (controller-written during
          swipes)
      - name: "--drawer-swipe-progress"
        description: 0..1 fraction of the dismiss travel (the backdrop fade rides
          it)
      - name: "--drawer-swipe-strength"
        description: remaining-travel factor set on release - scales the exit duration
          so a mostly-swiped drawer closes fast
    - name: drawer-swipe-handle
      description: 'The grab pill (show_swipe_handle: true, aria-hidden) - a drag
        may always start on it'
    - name: drawer-header
      description: Title block at the top of the popup
    - name: drawer-title
      description: The heading - the drawer's accessible name (required slot)
    - name: drawer-description
      description: Muted copy under the title, wired to aria-describedby
    - name: drawer-body
      description: The scrollable content region between header and footer
    - name: drawer-footer
      description: Action row pinned to the bottom of the popup
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--drawer
        registers: true
        values:
        - name: dismissible
        - name: direction
        - name: modal
        - name: snap_points
          conditional: if
    - element: content
      controllers:
      - identifier: poetry--core--drawer
        targets:
        - name: dialog
        actions:
        - method: close
          'on': cancel
        - method: backdropClose
          'on': click
        - method: escapeClose
          'on': keydown
          conditional: unless modal
        - method: swipeStart
          'on': pointerdown
        - method: swipeMove
          'on': pointermove
        - method: swipeEnd
          'on': pointerup
        - method: swipeCancel
          'on': pointercancel
    - element: trigger
      controllers:
      - identifier: poetry--core--drawer
        actions:
        - method: open
    - element: close
      controllers: []
    tools:
    - name: open
      title: Open
      description: Open the drawer.
      annotations:
        readOnlyHint: false
        untrustedContentHint: false
      executes: poetry--core--drawer#open
    - name: close
      title: Close
      description: Close the drawer.
      annotations:
        readOnlyHint: false
        untrustedContentHint: false
      executes: poetry--core--drawer#close
