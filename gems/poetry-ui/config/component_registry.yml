    - Use poetry_toggle - never a Button with hand-managed aria-pressed.
    - 'Toggle is UI state, NOT form data: never try to submit it. Form value -> Checkbox;
      instant setting -> Switch; exclusive/grouped -> ToggleGroup.'
    - Icon-only toggles MUST pass label:, and the label must NOT change with state
      ('Bookmark', never 'Remove bookmark').
    - aria-pressed is the vocabulary - never aria-checked or aria-expanded on a Toggle.
    - Wire the EFFECT to poetry:toggle:change (or click) and revert via set(false)
      on failure - a pressed toggle whose effect failed is a lie.
    - Pressed visual is accent - don't override data-pressed colors per-instance (theme-level
      only).
    parts:
    - name: toggle
      description: The pressed-state <button> - the whole component; aria-pressed
        carries the state and the controller flips both together
      states:
      - attr: data-pressed
        condition: pressed (bare presence boolean - absent when unpressed, never data-pressed=false)
      - attr: data-disabled
        condition: disabled (rendered alongside native disabled for styling-hook parity)
      - attr: data-variant
        condition: the visual variant
        values:
        - default
        - outline
      - attr: data-size
        condition: the size
        values:
        - default
        - sm
        - lg
  poetry/ui/toggle_group:
    class_name: Poetry::Ui::ToggleGroup::Component
    identifier: poetry--ui--toggle_group
    bem_block: poetry-ui-toggle_group
    styles:
    - name: size
      type: symbol
      variants:
      - default
      - sm
      - lg
      default: default
      required: true
    - name: variant
      type: symbol
      variants:
      - default
      - outline
      default: default
      required: true
    options:
    - name: disabled
      type: boolean
      default: false
    - name: label
      type: string
    - name: orientation
      type: symbol
      variants:
      - horizontal
      - vertical
      default: horizontal
    - name: spacing
      type: integer
      default: 0
    - name: type
      type: symbol
      default: single
    - name: value
      type: string
    - name: values
      type: list
      default: dynamic
    slots:
    - name: items
      many: true
      setter_args:
        item: 0
      yieldless:
      - item
    description: A set of toggle buttons for single or multiple selection.
    elements:
    - item
    capsule: b5c1a9940c88
    controllers:
    - identifier: poetry--core--roving-focus
      targets: []
      values:
      - loop
      - manageTabindex
      - orientation
      actions:
      - keydown
      events:
      - poetry--core--roving-focus:entry
    - identifier: poetry--core--toggle-group
      targets: []
      values:
      - type
      actions:
      - setValue
      - toggle
      events:
      - poetry:toggle-group:change
    agent_rules:
    - Use poetry_toggle_group - never hand-assemble Toggles with your own exclusivity
      logic.
    - 'ToggleGroup is UI state, NOT form data: submitting single-select -> RadioGroup;
      submitting multi-select -> Checkbox group. No name: exists; don''t route around
      it.'
    - 'Every item MUST have a unique value: (ArgumentError on duplicates); icon-only
      items MUST pass label: (state-invariant).'
    - 'Name the group via label: - a nameless radiogroup/toolbar fails the audit.'
    - Exclusive view/mode switching that shows PANELS is Tabs (aria-selected + tabpanels),
      not a single ToggleGroup.
    - 'Never mix vocabularies: single items carry aria-checked, multiple carry aria-pressed
      - the controller enforces it; agents patching DOM must too.'
    - single deselects to empty by re-press (Radix-exact) - if your UI needs always-one-selected,
      handle the empty change in the host.
    required_slots:
      item: at least one item
    parts:
    - name: toggle-group
      description: The role=radiogroup (single) / role=toolbar (multiple) root - the
        value-set machine and roving focus ride here; the axes cascade to items
      states:
      - attr: data-variant
        condition: the shared Toggle variant (root wins)
        values:
        - default
        - outline
      - attr: data-size
        condition: the shared Toggle size (root wins)
        values:
        - default
        - sm
        - lg
      - attr: data-spacing
        condition: the gap step - 0 is the segmented chain (joined corners), >0 free-standing
      - attr: data-orientation
        condition: the roving axis
        values:
        - horizontal
        - vertical
      - attr: data-disabled
        condition: the whole group is disabled (disables every item)
      vars:
      - name: "--gap"
        description: 'the item gap, set inline from spacing: - the root''s gap utility
          consumes it'
    - name: toggle-group-item
      description: One dumb <button> under the group machine - Toggle-styled, no per-item
        controller
      states:
      - attr: data-pressed
        condition: pressed (bare presence boolean - absent when off; the controller
          rederives the type-correct aria attribute from it)
      - attr: data-disabled
        condition: the item (or the whole group) is disabled - the roving-focus collection
          filter
      - attr: data-value
        condition: the item's key in the value set (always present, unique)
      - attr: data-variant
        condition: cascaded from the root
        values:
        - default
        - outline
      - attr: data-size
        condition: cascaded from the root
        values:
        - default
        - sm
        - lg
      - attr: data-spacing
        condition: cascaded from the root - keys the segmented corner/border chain
  poetry/ui/toolbar:
    class_name: Poetry::Ui::Toolbar::Component
    identifier: poetry--ui--toolbar
    bem_block: poetry-ui-toolbar
    styles:
    - name: orientation
      type: symbol
      variants:
      - horizontal
      - vertical
      default: horizontal
    options:
    - name: label
      type: string
      required: true
    - name: loop
      type: boolean
      default: true
    slots:
    - name: items
      many: true
      types:
      - button
      - input
      - separator
      setter_args:
        button: 0
        input: 0
        separator: 0
    description: A horizontal group of controls that acts as one keyboard tab stop.
    elements: []
    capsule: 77a81ff9c40f
    controllers:
    - identifier: poetry--core--roving-focus
      targets: []
      values:
      - loop
      - manageTabindex
      - orientation
      actions:
      - keydown
      events:
      - poetry--core--roving-focus:entry
    agent_rules:
    - 'A Toolbar is ONE Tab stop: arrows move between its controls - use it for grouped
      actions over a surface (table bulk actions, editor strips), never as page navigation.'
    - 'Compose through the typed slots: with_button (a real poetry Button - tag: :a
      makes it a link), with_input (search/filter - the caret keeps its arrow keys),
      with_separator (orientation flips automatically).'
    - 'label: is the toolbar''s accessible name and is required - screen readers announce
      it on entry.'
    - A ToggleGroup composed inside keeps its own arrow navigation (its items rove
      locally); place it between separators so the seam reads as a group.
    required_slots:
      button: at least one control (with_button / with_input)
    parts:
    - name: toolbar
      description: The role=toolbar root - one Tab stop; arrow keys rove across the
        slotted controls (roving-focus, with the caret guard protecting inputs)
      states:
      - attr: data-orientation
        condition: always - which arrows rove
        values:
        - horizontal
        - vertical
  poetry/ui/tooltip:
    class_name: Poetry::Ui::Tooltip::Component
    identifier: poetry--ui--tooltip
    bem_block: poetry-ui-tooltip
    styles: []
    options:
    - name: align
      type: symbol
      variants:
      - start
      - center
      - end
      default: center
    - name: content_class
      type: string
    - name: delay_duration
      type: integer
    - name: disable_hoverable_content
      type: boolean
    - name: label
      type: string
    - name: open
      type: boolean
      default: false
    - name: side
      type: symbol
      variants:
      - top
      - right
      - bottom
      - left
      default: top
    - name: side_offset
      type: integer
      default: 0
    slots:
    - name: trigger
      many: false
      component: poetry/ui/button
      setter_args:
        trigger: 0
      yieldless:
      - trigger
    description: A floating label describing an element on hover or focus.
    elements:
    - content
    - arrow
    capsule: fc21afb6426d
    controllers:
    - identifier: poetry--core--popper
      targets:
      - anchor
      - arrow
      - content
      values:
      - align
      - alignOffset
      - anchor
      - anchorPoint
      - avoidCollisions
      - side
      - sideOffset
      - strategy
      actions:
      - anchorPointValueChanged
      - reposition
      - setAnchor
      - setAnchorElement
      - strategyValueChanged
      events: []
    - identifier: poetry--core--tooltip
      targets: []
      values:
      - delayDuration
      - disableHoverableContent
      - open
      actions:
      - blurClose
      - clickClose
      - focusOpen
      - openValueChanged
      - pointerDown
      - pointerLeave
      - pointerMove
      events:
      - poetry:tooltip:closed
      - poetry:tooltip:open
    agent_rules:
    - Use poetry_tooltip - never hand-roll title-attribute replacements or hover divs.
    - Tooltip content is TEXT and never interactive/focusable - links, buttons, or
      inputs inside are a contract violation (use Popover).
    - Never put essential information only in a tooltip - touch users NEVER see it
      (no long-press path, by design).
    - 'The tooltip DESCRIBES; it never names. Icon-only triggers still require label:
      on the composed Button.'
    - Wrap toolbar/button rows in ONE poetry_tooltip_provider so the warm grace makes
      the row feel continuous.
    - 'Rich visual content needs label: (the plain-text announcement).'
    - Do not pin tooltips open as onboarding callouts - that is a Popover.
    required_slots:
      trigger: the described control
    parts:
    - name: tooltip
      description: Root wrapper around the trigger and the bubble
    - name: tooltip-content
      description: The role=tooltip bubble - positioning, animation, and the open
        state ride here
      states:
      - attr: data-open
        condition: bubble is open (the controller flips the pair at runtime)
      - attr: data-closed
        condition: bubble is closed (the server-rendered state; hidden rides along)
      - attr: data-instant
        condition: the open skipped the delay - warm-grace/programmatic or keyboard
          focus (runtime-only; absent on a delayed open)
        values:
        - delay
        - focus
      - attr: data-side
        condition: always - the side (initial placement, re-resolved live by popper
          after flip)
        values:
        - top
        - right
        - bottom
        - left
      - attr: data-align
        condition: always - the alignment (re-resolved live by popper)
        values:
        - start
        - center
        - end
      vars:
      - name: "--transform-origin"
        description: the anchor-facing origin popper writes for scale-in animation
      - name: "--available-width"
        description: viewport space left for the bubble (popper, post-flip)
      - name: "--available-height"
        description: viewport space left for the bubble (popper, post-flip)
      - name: "--anchor-width"
        description: the anchor's measured width (popper)
      - name: "--anchor-height"
        description: the anchor's measured height (popper)
    - name: tooltip-arrow
      description: The arrow wrapper (aria-hidden) - popper pins it to the bubble's
        anchor-facing edge and rotates it toward the anchor
      states:
      - attr: data-side
        condition: written by popper alongside the content's - the resolved side,
          for per-side restyling
        values:
        - top
        - right
        - bottom
        - left
  poetry/ui/tree:
    class_name: Poetry::Ui::Tree::Component
    identifier: poetry--ui--tree
    bem_block: poetry-ui-tree
    styles: []
    options:
    - name: label
      type: string
      required: true
    slots: []
    description: A hierarchical list of expandable, selectable nodes.
    slot_extras:
    - item
    elements:
    - item
    - cell
    - toggle
    - toggle_spacer
    - label
    capsule: 908b5c0a5a2b
    controllers:
    - identifier: poetry--core--tree
      targets: []
      values: []
      actions:
      - keydown
      - press
      - pressStart
      - toggle
      events:
      - poetry:tree:toggle
    agent_rules:
    - Hierarchical expandable lists are a Tree - never hand-rolled nested <ul>s with
      click handlers; the treegrid semantics, expansion keys, and focus rules ride
      the controller.
    - 'label: is REQUIRED (the treegrid''s accessible name).'
    - 'Items: tree.with_item(text:, value:, expanded:, disabled:, href:) with nesting
      via the block - the component flattens and computes aria-level/posinset/setsize.'
    - 'Expansion is client state; persist it by listening for poetry:tree:toggle and
      re-rendering with expanded: from your store.'
    - 'Navigation destinations take href: (the label renders as a link); a Tree is
      not a menu - actions belong to DropdownMenu, picking to Select/Combobox.'
    parts:
    - name: tree
      description: The treegrid container (role=treegrid, the accessible name) - roving
        focus, expansion keys, and typeahead ride here; rows are FLAT siblings
    - name: tree-item
      description: One row (role=row > gridcell) - hierarchy in aria-level/posinset/setsize,
        indentation via --poetry-tree-level; rows under a collapsed ancestor render
        hidden
      states:
      - attr: data-expanded
        condition: the row's subtree is open (parents only; aria-expanded is the canonical
          twin)
      - attr: data-disabled
        condition: the item is disabled (skipped by arrows and typeahead)
      - attr: data-value
        condition: always - the toggle event's identity
      - attr: data-level
        condition: always - the 1-based depth (aria-level's twin; --poetry-tree-level
          drives the indent)
      vars:
      - name: "--poetry-tree-level"
        description: the 1-based depth - indentation is calc((level - 1) * step) in
          the dictionary
    - name: tree-item-toggle
      description: 'The chevron (parents only): tabindex -1, never steals focus, aria-label
        flips Expand/Collapse'
      states:
      - attr: data-expand-label
        condition: always - the localized Expand string the controller swaps in on
          collapse
      - attr: data-collapse-label
        condition: always - the localized Collapse string the controller swaps in
          on expand
    - name: tree-item-label
      description: 'The row''s text - a link when href: is given'
  poetry/ui/typeset:
    class_name: Poetry::Ui::Typeset::Component
    identifier: poetry--ui--typeset
    bem_block: poetry-ui-typeset
    styles: []
    options:
    - name: preset
      type: string
    slots: []
    description: Prose styling for long-form and rendered-markdown content.
    elements: []
    capsule: d236e8297167
    agent_rules:
    - Wrap RENDERED markdown / prose HTML (headings, paragraphs, lists, tables) -
      never app chrome; poetry components style themselves.
    - 'preset: "docs" appends typeset-docs - a preset is a tiny class in the app''s
      own CSS setting --typeset-size/-leading/-flow (and font vars).'
    - 'Opt an embedded component OUT of the prose styling with class: "not-typeset"
      - it covers the whole subtree.'
    - Wrap a wide table (or any wide block) in a typeset-scroll div inside the prose
      to scroll horizontally instead of compressing.
    requires_content: the rendered prose HTML
    parts:
    - name: typeset
      description: The prose container - every bare element inside is styled by the
        app-owned typeset.css; not-typeset (class or data attribute) opts a subtree
        out
