  poetry/ui/carousel:
    class_name: Poetry::Ui::Carousel::Component
    identifier: poetry--ui--carousel
    bem_block: poetry-ui-carousel
    styles: []
    options:
    - name: label
      type: string
      required: true
      description: The carousel region's accessible name - required; rendering without
        it raises.
    - name: orientation
      type: symbol
      variants:
      - horizontal
      - vertical
      default: horizontal
      description: The scroll axis; snapping, controls, and arrow keys follow it.
    - name: show_controls
      type: boolean
      default: true
      description: Renders the prev/next buttons; slides stay reachable by swipe,
        wheel, and keyboard without them.
    - name: track_classes
      type: string
      description: 'Utility classes for the slide track - change spacing as a trio:
        track_classes: "-ml-1" pairs with item classes "pl-1 -scroll-ml-1".'
    slots:
    - name: items
      many: true
      description: 'Declares one slide. The content block is required; classes: sizes
        the slide (basis-full default).'
      setter_args:
        item: 0
      setter_kwargs:
        item:
        - classes
      yieldless:
      - item
      required_content:
        item: the slide
    description: A slideshow for cycling through content, built on native scroll-snap.
    elements:
    - content
    - content_horizontal
    - content_vertical
    - track
    - track_horizontal
    - track_vertical
    - item
    - item_horizontal
    - item_vertical
    - control
    - control_previous_horizontal
    - control_previous_vertical
    - control_next_horizontal
    - control_next_vertical
    capsule: 74025b4fc47f
    controllers:
    - identifier: poetry--core--carousel
      targets:
      - next
      - previous
      - viewport
      values:
      - orientation
      actions:
      - keydown
      - next
      - previous
      - scrollTo
      - scrolled
      events:
      - poetry:carousel:select
    agent_rules:
    - 'label: is REQUIRED - the carousel region''s accessible name.'
    - Declare slides with with_item - the component stamps the slide roles (role=group
      + aria-roledescription=slide).
    - 'Slides are REAL scroll content: they stay reachable by swipe, wheel, and keyboard
      even before JS - never gate content behind the buttons alone.'
    - Size slides with item classes (basis-full default; basis-1/2 lg:basis-1/3 for
      a gallery).
    - 'Change slide spacing as a TRIO: track_classes: "-ml-1" plus item classes "pl-1
