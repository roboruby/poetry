  poetry/ui/stat:
    class_name: Poetry::Ui::Stat::Component
    identifier: poetry--ui--stat
    bem_block: poetry-ui-stat
    styles: []
    options:
    - name: delta
      type: string
      description: The change text shown in the pill beside the value ("+12.5%").
    - name: label
      type: string
      required: true
      description: The metric's name, shown muted above the value.
    - name: sentiment
      type: symbol
      variants:
      - positive
      - negative
      - neutral
      description: Overrides the trend-derived sentiment - color follows sentiment,
        never the arrow (set :positive when DOWN is the good direction).
    - name: trend
      type: symbol
      variants:
      - up
      - down
      - flat
      default: up
      description: The arrow direction; also derives the default sentiment.
    slots:
    - name: description
      many: false
      description: Muted supporting copy rendered under the value.
    - name: media
      many: false
      description: The trend-visual slot (sparkline, chart, glyph) below the text
        stack.
    description: 'A single KPI: a muted label over a large metric value.'
    elements:
    - label
    - row
    - value
    - delta
    - delta_positive
    - delta_negative
    - delta_neutral
    - description
    - media
    capsule: dc20a8e9715e
    agent_rules:
    - 'One Stat is ONE metric: label: names it, the content block is the value - compose
      several in a grid (typically each inside a Card) for a dashboard row.'
    - 'delta: carries the change text (''+12.5%''); trend: (up/down/flat) sets the
      arrow and the default sentiment. Override sentiment: :positive when DOWN is
      the good direction (costs, churn, error rate) - color follows sentiment, never
      the arrow.'
    - Keep the value textual - tabular numerals are already applied; units and formatting
      belong in the content ('$45,231', '99.98%').
    - 'A Stat is not a chart: a trend over time goes in the media slot (or use poetry-charts).'
    requires_content: the metric value
    identity: false
    parts:
    - name: stat
      description: The stat root - a label/value/delta/description column
    - name: stat-label
      description: The muted metric name above the value
    - name: stat-value
      description: The metric itself - large, semibold, tabular numerals
    - name: stat-delta
      description: The change pill beside the value - arrow icon + delta text with
        an sr-only trend word
      states:
      - attr: data-trend
        condition: always - the arrow direction
        values:
        - up
        - down
        - flat
      - attr: data-sentiment
        condition: always - resolved sentiment (trend-derived unless overridden)
        values:
        - positive
        - negative
        - neutral
    - name: stat-description
      description: Muted supporting copy under the value
    - name: stat-media
      description: The trend-visual slot (sparkline, chart, glyph) below the text
        stack
  poetry/ui/switch:
    class_name: Poetry::Ui::Switch::Component
    identifier: poetry--ui--switch
    bem_block: poetry-ui-switch
    styles:
    - name: size
      type: symbol
      variants:
      - default
      - sm
      default: default
      required: true
      description: The control's size axis; the thumb scales to match.
    options:
    - name: checked
      type: boolean
      default: false
      description: The server-rendered on/off state.
    - name: disabled
      type: boolean
      default: false
      description: Disables the control and its hidden input - a disabled switch neither
        toggles nor submits.
    - name: label
      type: string
      description: The accessible name, rendered as aria-label - not visible text.
    - name: name
      type: string
      description: Names the hidden input, making the switch a form participant.
    - name: required
      type: boolean
      default: false
      description: Marks the switch required via aria-required (never the native attribute).
    - name: unchecked_value
      type: string
      default: '0'
      description: Submitted when the switch is off, so the field always posts. Ignored
        without name:.
    - name: value
      type: string
      default: '1'
      description: Submitted when the switch is on. Ignored without name:.
    slots: []
    description: A toggle for turning a setting on or off.
    elements:
    - thumb
    - input
    capsule: e75df2910144
    controllers:
    - identifier: poetry--core--checked
      targets: []
      values:
      - inputId
      actions:
      - check
      - set
      - toggle
      - uncheck
      events:
      - poetry:checkbox:change
      - poetry:checked:change
      - poetry:switch:change
    agent_rules:
    - Use poetry_switch - never a styled checkbox pretending to be a switch (role=switch
      announces on/off; that's the point).
    - Switch = instant effect; Checkbox = staged for submit. If nothing happens until
      a Save button, use Checkbox.
    - Every switch needs an accessible name (Label/Field for= or label:).
    - Switches are BINARY - no indeterminate, ever (ArgumentError). A third state
      means a different component.
    - The instant-effect recipe pairs the flip with server persistence (Turbo auto-submit)
      - never flip UI-only for a setting the user believes is saved.
    - NEVER write the checked attributes (data-checked/data-unchecked) without aria-checked
      and the input sync (the controller writes all three).
    parts:
    - name: switch
      description: The visual button[role=switch] - reflects the hidden input via
        aria-checked plus the checked pair (never indeterminate)
      states:
      - attr: data-checked
        condition: on (the shared checked controller reflects every toggle here, aria-checked
          in step)
      - attr: data-unchecked
        condition: off (the server-rendered default)
      - attr: data-size
        condition: always - the resolved size (the thumb reads it via group/switch
          selectors)
        values:
        - default
        - sm
    - name: switch-thumb
      description: The sliding knob - travel is pure CSS off the checked pair
      states:
      - attr: data-checked
        condition: mirrors the control (the controller reflects state on every part
          wearing the pair)
      - attr: data-unchecked
        condition: mirrors the control - the thumb sits at the start
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--checked
        registers: true
        values:
        - name: input_id
          conditional: if form_participant?
        actions:
        - method: toggle
          'on': click
  poetry/ui/table:
    class_name: Poetry::Ui::Table::Component
    identifier: poetry--ui--table
    bem_block: poetry-ui-table
    styles: []
    options:
    - name: container_class
      type: string
      description: Extra classes for the scroll container - e.g. "max-h-96" to cap
        its height.
    - name: scroll_label
      type: string
      description: 'The scroll region''s accessible name, required with sticky_header:
        a scrollable region a keyboard can''t reach fails WCAG (axe scrollable-region-focusable),
        and a focusable region needs a name.'
    - name: sticky_header
      type: boolean
      default: false
      description: Pins the <thead> while the container scrolls; needs a height cap
        (container_class:) to take effect, and requires scroll_label:.
    slots: []
    description: A semantic table for rows and columns of data.
    elements:
    - container
    - container_sticky
    - header
    - body
    - footer
    - row
    - head
    - cell
    - caption
    capsule: 22778ae1ac48
    agent_rules:
    - Compose the table with the part helpers (poetry_table_header/_body/_row/_head/_cell)
      - they carry the data-slot + classes onto real thead/tbody/tr/th/td.
    - A column header is poetry_table_head (a <th>); a data cell is poetry_table_cell
      (a <td>).
    - Mark a selected row with data-selected on poetry_table_row - never a bespoke
      highlight class.
    - 'sticky_header: true pins the thead while the container scrolls - it only scrolls
      once container_class: caps the height ("max-h-96"); without a cap nothing sticks.'
    - 'sticky_header requires scroll_label: - the container becomes a focusable scroll
      region (tabindex=0 + role=region) and a keyboard-reachable region needs a name
      (the ScrollArea rule).'
    requires_content: the table sections (poetry_table_* helpers)
    identity: false
    parts:
    - name: table
      description: The semantic <table> element itself - the root the part helpers
        compose into
    - name: table-caption
      description: The <caption> (poetry_table_caption) - the table's accessible purpose
    - name: table-header
      description: The <thead> (poetry_table_header) holding the column-header row
    - name: table-body
      description: The <tbody> (poetry_table_body) holding the data rows
    - name: table-footer
      description: The <tfoot> (poetry_table_footer) - totals/summary rows
    - name: table-row
      description: A <tr> (poetry_table_row) in any section
      states:
      - attr: data-selected
        condition: the row is marked selected (presence attribute, no value) - the
          theme tints it
    - name: table-head
      description: A column header <th> (poetry_table_head)
    - name: table-cell
      description: A data <td> (poetry_table_cell)
  poetry/ui/tabs:
    class_name: Poetry::Ui::Tabs::Component
    identifier: poetry--ui--tabs
    bem_block: poetry-ui-tabs
    styles: []
    options:
    - name: default
      type: string
      description: The value of the server-rendered active tab; defaults to the first
        enabled tab. Raises when it matches no tab.
    - name: label
      type: string
      description: The tablist's accessible name - recommended when a page has several
        tab sets.
    - name: orientation
      type: symbol
      variants:
      - horizontal
      - vertical
      default: horizontal
      description: The tab axis; :vertical stacks the triggers and flips the arrow
        keys.
    - name: variant
      type: symbol
      variants:
      - default
      - line
      default: default
      description: 'The list''s visual treatment: :default a filled capsule, :line
        an underline indicator.'
    slots:
    - name: tabs
      many: true
      description: 'Declares one tab: the title, its value:, and the panel as the
        block (defer: swaps in a lazy turbo-frame panel; panel: false declares a list-only
        tab). Omitting all three raises.'
      setter_args:
        tab: 1
      yieldless:
      - tab
    description: A tablist of triggers that switch between content panels.
    elements:
    - list
    - list_default
    - list_line
    - trigger
    - content
    capsule: 437020f84809
    controllers:
    - identifier: poetry--core--roving-focus
      targets: []
      values:
      - loop
      - manageTabindex
      - orientation
      actions:
      - keydown
      events:
      - poetry--core--roving-focus:entry
    - identifier: poetry--core--tabs
      targets: []
      values:
      - activateOnFocus
      actions:
      - activate
      - focusActivate
      - setValue
      events:
      - poetry:tabs:change
    agent_rules:
    - 'Declare tabs with with_tab(title, value:) + the panel block (or defer: for
      a lazy turbo-frame panel) - never hand-wire role=tab/tabpanel ids.'
    - 'panel: false declares a list-only tab (no tabpanel renders, the trigger drops
      aria-controls) - for demos/pattern shells; real tab sets carry panels.'
    - 'default: picks the server-rendered active tab (the first enabled tab otherwise)
      - the panel is visible without JS.'
    - 'label: names the tablist (aria-label) - recommended whenever the page has several
      tab sets.'
    - Tabs switch VIEWS of one context; use navigation (links) when the URL should
      change.
    required_slots:
      tab: at least one tab
    parts:
    - name: tabs
      description: Root wrapper - the orientation rides here and flips the flex direction
      states:
      - attr: data-orientation
        condition: the tab axis (matches aria-orientation on the list)
        values:
        - horizontal
        - vertical
    - name: tabs-list
      description: The role=tablist row of triggers - the roving-focus keyboard group
        and the visual variant ride here
      states:
      - attr: data-variant
        condition: the list treatment - default (filled capsule) or line (underline
          indicator)
    - name: tabs-trigger
      description: One role=tab button per tab
      states:
      - attr: data-active
        condition: the selected tab (the controller moves it with aria-selected on
          activation)
      - attr: data-disabled
        condition: tab is disabled - also filters it from the roving-focus collection
      - attr: data-value
        condition: the tab's value - the key the controller matches panels against
    - name: tabs-content
      description: One role=tabpanel per tab - only the active panel is visible
      states:
      - attr: data-hidden
        condition: panel is inactive (paired with the hidden property - the controller
          flips both)
      - attr: data-value
        condition: the owning tab's value
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--tabs
        registers: true
    - element: list
      controllers:
      - identifier: poetry--core--roving-focus
        registers: true
        values:
        - name: orientation
        - name: loop
        actions:
        - method: keydown
          'on': keydown
      - identifier: poetry--core--tabs
        actions:
        - method: focusActivate
          'on': poetry--core--roving-focus:entry
    - element: trigger
      controllers:
      - identifier: poetry--core--tabs
        actions:
        - method: activate
          'on': click
    tools:
    - name: set_value
      title: Set value
      description: Activate the tab whose value matches and show its panel.
      inputSchema:
        type: object
        properties:
          value:
            type: string
            description: The tab's value.
        required:
        - value
        additionalProperties: false
      annotations:
        readOnlyHint: false
        untrustedContentHint: false
      executes: poetry--core--tabs#setValue
  poetry/ui/tag_group:
    class_name: Poetry::Ui::TagGroup::Component
    identifier: poetry--ui--tag_group
    bem_block: poetry-ui-tag_group
    styles: []
    options:
    - name: described_by
      type: string
      description: Space-separated hint/error ids for the GRID (the labelled element)
        - a raw aria-describedby in html_attributes would land on the outer wrapper
        div, unassociated for AT.
    - name: label
      type: string
      required: true
      description: The grid's accessible name, rendered as a caption span. Required.
    - name: name
      type: string
      description: 'Makes the group a form value: one hidden <name>[] input submits
        per tag.'
    slots:
    - name: tags
      many: true
      description: 'Declares one chip. value: is its identity (and form value); label:
        is the accessible name and the visible text when no block is given; removable:
        false drops the remove button.'
      setter_args:
        tag: 0
      yieldless:
      - tag
    description: A set of removable chips or tokens.
    elements:
    - label
    - grid
    - tag
    - cell
    - remove
    capsule: 5085927b7e17
    controllers:
    - identifier: poetry--core--roving-focus
      targets: []
      values:
      - loop
      - manageTabindex
      - orientation
      actions:
      - keydown
      events:
      - poetry--core--roving-focus:entry
    - identifier: poetry--core--tag-group
      targets: []
      values: []
      actions:
      - keydown
      - remove
      events:
      - poetry:tag-group:remove
    agent_rules:
    - Removable chips are a TagGroup - never hand-rolled badges with x buttons; removal
      keyboard (Delete/Backspace), focus recovery, and the live region ride the controller.
    - 'label: is REQUIRED (the grid''s accessible name, rendered as a caption span).'
    - 'name: turns the group into a form value - one hidden <name>[] input per tag
      submits; removing a tag removes its input.'
    - 'Removal is cancelable: listen for poetry:tag-group:remove and preventDefault
      to own the removal server-side (Turbo re-render).'
    - Choosing from options is Combobox multiple; toggling fixed choices is ToggleGroup
      - a TagGroup holds items that exist until removed.
    parts:
    - name: tag-group
      description: The labelled wrapper - caption span + grid stack here
    - name: tag-group-label
      description: The caption span (label:), wired via aria-labelledby (a grid is
        not a labelable form control - never a <label>)
    - name: tag-group-grid
      description: The tag collection (role=grid; role=group + the tab stop when empty)
        - roving focus, removal keys, and the focus-scoped live region ride here
      states:
      - attr: data-empty
        condition: no tags remain (controller-kept after removals)
    - name: tag-group-tag
      description: 'One chip (role=row > gridcell): content, the remove button, and
        - in form mode - the hidden name[] input'
      states:
      - attr: data-disabled
        condition: the tag is disabled (skipped by arrows and removal)
      - attr: data-value
        condition: always - the tag's value (the remove event's detail and the hidden
          input's value)
    - name: tag-group-remove
      description: The per-tag remove button - tabbable (Tab steps from the row into
        it), removes exactly its own tag
    stimulus:
    - element: grid
      controllers:
      - identifier: poetry--core--tag-group
        registers: true
        actions:
        - method: keydown
          'on': keydown
      - identifier: poetry--core--roving-focus
        registers: true
        values:
        - name: orientation
        - name: loop
        actions:
        - method: keydown
          'on': keydown
    - element: remove
      controllers:
      - identifier: poetry--core--tag-group
        actions:
        - method: remove
          'on': click
  poetry/ui/textarea:
    class_name: Poetry::Ui::Textarea::Component
    identifier: poetry--ui--textarea
    bem_block: poetry-ui-textarea
    styles: []
    options:
    - name: disabled
      type: boolean
      default: false
      description: Disables the control and forwards to the native element.
    - name: invalid
      type: boolean
      default: false
      description: Marks the field errored (aria-invalid + the destructive ring);
        set by Field/FormBuilder from model errors.
    - name: name
      type: string
      description: The submitted field name.
    - name: placeholder
      type: string
      description: Hint text shown while empty - never a substitute for a label.
    - name: rows
      type: integer
      description: The initial visual rows - the minimum height under CSS auto-grow,
        and the fixed size in browsers without it.
    - name: value
      type: string
      description: The initial text, rendered as the element's content.
    slots: []
    description: A form control for entering multiple lines of text.
    elements: []
    capsule: ccb23b46547a
    agent_rules:
    - Wire through Field/FormBuilder (control_attributes) - never hand-write the aria
      plumbing.
    - Placeholder is NOT a label - pair with Label/Field always.
    - Use Textarea for free text; Input for single-line; do not bolt a JS autosizer
      on (auto-grow is CSS).
    - Do not set native required - required flows as aria-required via Field.
    identity: false
    parts:
    - name: textarea
      description: The <textarea> element itself - value renders as content; auto-grow
        is the field-sizing-content CSS property, zero JS
  poetry/ui/time_field:
    class_name: Poetry::Ui::TimeField::Component
    identifier: poetry--ui--time_field
    bem_block: poetry-ui-time_field
    styles: []
    options:
    - name: described_by
      type: string
      description: Ids for aria-describedby (hint or error text).
    - name: disabled
      type: boolean
      default: false
      description: Disables the field; the segment group dims and goes inert.
    - name: hour_cycle
      type: string
      description: Pins the hour cycle (h12/h23/h11/h24) instead of the locale's.
    - name: id
      type: string
      description: The native input's DOM id - the Field label target.
    - name: invalid
      type: boolean
      default: false
      description: Paints the destructive border/ring and sets aria-invalid.
    - name: label
      type: string
      description: Standalone accessible name; inside a form the Field label wires
        ids instead. Segments announce it themselves.
    - name: locale
      type: string
      description: Pins the field to a locale other than the page's.
    - name: max
      type:
      description: The latest allowed date (Date or ISO string) - rides native constraint
        validation.
    - name: min
      type:
      description: The earliest allowed date (Date or ISO string) - rides native constraint
        validation.
    - name: name
      type: string
      required: true
      description: The form field name - required; the value posts as ISO yyyy-mm-dd
        with or without JS.
    - name: placeholder_value
      type:
      description: What the first arrow press on an empty segment lands on; defaults
        to today.
    - name: readonly
      type: boolean
      default: false
      description: The value shows but cannot be edited.
    - name: required
      type: boolean
      default: false
      description: Marks the native input required.
    - name: seconds
      type: boolean
      default: false
      description: Adds the seconds segment; the wire format becomes HH:MM:SS.
    - name: value
      type:
      description: Date, or an ISO yyyy-mm-dd string; nil renders empty.
    slots: []
    description: A segmented input for typing a time one part at a time.
    elements:
    - group
    - input
    capsule: c812f47a82a9
    controllers:
    - identifier: poetry--core--date-field
      targets:
      - group
      - input
      values:
      - hourCycle
      - labels
      - locale
      - placeholder
      - placeholders
      - seconds
      actions:
      - focusGap
      - settle
      events:
      - poetry:date-field:change
    agent_rules:
    - Time entry is a TimeField (poetry_time_field / form.time_field) - never a masked
      Input or a pair of selects; params[<name>] is HH:MM (HH:MM:SS with seconds:).
    - '12- vs 24-hour follows the user''s locale automatically (the dayPeriod segment
      appears only under twelve-hour cycles); hour_cycle: pins it when a product must.'
    - 'For a date AND a time, use a DateTimeField (poetry_date_time_field / form.datetime_field):
      one control, one datetime-local value.'
    parts:
    - name: time-field
      description: Root - the controller and the enhanced/disabled surface ride here
        (segments inside share the date-field-* vocabulary)
      states:
      - attr: data-enhanced
        condition: the controller connected and built segments (no JS = the native
          input, visible and styled)
      - attr: data-disabled
        condition: 'disabled: is set'
      - attr: data-invalid
        condition: 'invalid: is set (the group wears the destructive ring)'
    - name: time-field-group
      description: The bordered segment row - hidden until enhancement, then the editing
        surface (cn-input chrome, focus-within ring)
      states:
      - attr: data-disabled
        condition: 'disabled: is set (chrome dims, pointer events off)'
      - attr: data-invalid
        condition: 'invalid: is set (destructive border + ring)'
    - name: time-field-input
      description: The native <input type=time> - THE form value in both modes; tabindex
        -1 + aria-hidden once segments exist
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--date-field
        registers: true
        values:
        - name: locale
          conditional: if
        - name: placeholder
        - name: labels
        - name: placeholders
      - identifier: poetry--core--date-field
        values:
        - name: seconds
          conditional: if seconds
        - name: hour_cycle
          conditional: if
    - element: group
      controllers:
      - identifier: poetry--core--date-field
        targets:
        - name: group
        actions:
        - method: focusGap
          'on': click
        - method: settle
          'on': focusout
    - element: input
      controllers:
      - identifier: poetry--core--date-field
        targets:
        - name: input
  poetry/ui/timeline:
    class_name: Poetry::Ui::Timeline::Component
    identifier: poetry--ui--timeline
    bem_block: poetry-ui-timeline
    styles:
    - name: orientation
      type: symbol
      variants:
      - vertical
      - horizontal
      default: vertical
      description: 'The layout axis: :vertical reads as a feed, :horizontal as a step
        tracker.'
    options: []
    slots:
    - name: items
      many: true
      description: 'Declares one event: title:, optional time: (renders a <time>),
        optional icon: (replaces the dot), completed: for progress - the description
        is the block.'
      setter_args:
        item: 0
      yieldless:
      - item
    description: A sequence of dated events as an ordered list.
    elements:
    - item
    - indicator
    - indicator_dot
    - indicator_icon
    - separator
    - header
    - title
    - time
    - content
    capsule: 70bf132a2f6e
    agent_rules:
    - A sequence of dated events (activity feed, order status, deploy history) is
      a Timeline - never a hand-rolled stack of dots and left borders (this is the
      <ol> the sequence owes its readers).
    - 'Each with_item takes title:, optional time: (renders a <time>), optional icon:
      (swaps the dot for a glyph), completed: for progress - the description is the
      block.'
    - 'completed: colors the item''s indicator and its rail segment - mark every step
      up to the current one, not just the latest.'
    - 'orientation: :horizontal lays the steps left-to-right (an order tracker); the
      vertical default reads as a feed. For steps the USER advances through, use Stepper
      - a Timeline records, it never navigates.'
    required_slots:
      item: at least one item (title:, with the description as its block)
    identity: false
    parts:
    - name: timeline
      description: The <ol> root - the event sequence
      states:
      - attr: data-orientation
        condition: always - the layout axis
        values:
        - vertical
        - horizontal
    - name: timeline-item
      description: 'One event (<li>): indicator + rail segment + header + description'
      states:
      - attr: data-completed
        condition: the step is done - recolors its indicator and rail segment
    - name: timeline-indicator
      description: The decorative marker on the rail - a dot, or icon:'s glyph (aria-hidden;
        the sequence lives in the list semantics)
    - name: timeline-separator
      description: The decorative rail segment toward the next item - hidden on the
        last
    - name: timeline-header
      description: The title/time row
    - name: timeline-title
      description: The event's name
    - name: timeline-time
      description: The event's <time> - muted, small
    - name: timeline-content
      description: Muted description under the header (the item's block)
  poetry/ui/toast:
    class_name: Poetry::Ui::Toast::Component
    identifier: poetry--ui--toast
    bem_block: poetry-ui-toast
    styles:
    - name: variant
      type: symbol
      variants:
      - default
      - success
      - info
      - warning
      - destructive
      - loading
      default: default
      required: true
      description: 'The intent axis: it picks the icon, and :destructive announces
        assertively while :loading defaults to persistent.'
    options:
    - name: duration
      type: integer
      description: 'nil = derived: 5000ms, or PERSISTENT when an action slot is present
        (the missable-undo guard). <= 0 = persistent.'
    - name: politeness
      type: symbol
      variants:
      - polite
      - assertive
      default: dynamic
      description: 'Derived from the variant: destructive announces assertively.'
    - name: show_close_button
      type: boolean
      default: true
      description: The corner dismiss button - named as the dialog family names it.
    slots:
    - name: title
      many: false
      description: The message (REQUIRED - the announced payload's first line).
    - name: description
      many: false
      description: Supporting copy under the title.
    - name: action
      many: false
      description: 'Typed Button slot (undo / view / retry): clicking it dismisses
        the toast with reason "action". Its presence makes the toast persistent by
        default.'
      component: poetry/ui/button
      setter_args:
        action: 0
      yieldless:
      - action
    description: A brief, auto-dismissing notification message.
    elements:
    - icon
    - body
    - title
    - description
    - action
    - close
    capsule: bcc3d06692ee
    controllers:
    - identifier: poetry--core--toast
      targets:
      - action
      - close
      values:
      - duration
      - politeness
      actions:
      - dismiss
      - pause
      - resume
      events:
      - poetry:toast:dismiss
      - poetry:toast:show
    agent_rules:
    - 'Server-side toasts go through turbo_stream.poetry_toast / the flash recipe
      - never hand-append into #poetry-toaster.'
    - Undo/consequence toasts MUST carry an action slot - action-bearing toasts default
      to persistent (duration nil); give an explicit duration only when missing the
      action is safe.
    - 'variant: :destructive is for failures the user must hear about (it announces
      ASSERTIVELY); do not use it for styling.'
    - Never put required interactions in a toast (toasts are missable) - that is AlertDialog.
    - 'Toasts are supplementary: never the only place an outcome is recorded.'
    required_slots:
      title: the message
    identity: false
    parts:
    - name: toast
      description: The notification item itself (<li>, role=status) - variant, open
        state, and the toaster's stack facts all ride here
      states:
      - attr: data-open
        condition: toast is showing (the server-rendered state; the dismiss exit flips
          the pair before removal)
      - attr: data-closed
        condition: toast is animating out
      - attr: data-variant
        condition: always - the resolved variant
        values:
        - default
        - success
        - info
        - warning
        - destructive
        - loading
      - attr: data-queued
        condition: the toaster holds it hidden past the visible limit (timer paused
          until a slot frees up)
      vars:
      - name: "--poetry-toast-index"
        description: stack position written by the toaster's reflow (newest visible
          toast = 0)
    - name: toast-icon
      description: The variant's icon well (aria-hidden; the default variant renders
        none)
    - name: toast-title
      description: The message - the announced payload's first line (required slot)
    - name: toast-description
      description: Supporting copy under the title
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--toast
        registers: true
        values:
        - name: duration
        - name: politeness
        actions:
        - method: pause
          'on':
          - mouseenter
          - focusin
        - method: resume
          'on':
          - mouseleave
          - focusout
    - element: action
      controllers:
      - identifier: poetry--core--toast
        targets:
        - name: action
        actions:
        - method: dismiss
          'on': click
    - element: close
      controllers:
      - identifier: poetry--core--toast
        targets:
        - name: close
        actions:
        - method: dismiss
          'on': click
  poetry/ui/toast_trigger:
    class_name: Poetry::Ui::ToastTrigger::Component
    identifier: poetry--ui--toast_trigger
    bem_block: poetry-ui-toast_trigger
    styles: []
