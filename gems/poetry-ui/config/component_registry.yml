      default: text
    - name: value
      type: string
    slots: []
    elements: []
    capsule: f0c8d25982d7
    agent_rules:
    - Inside a form, never render Input directly - use the FormBuilder's field (it
      wires ids, errors, and aria).
    - Error styling comes from aria-invalid, set from model errors - never hand-toggle
      error classes.
  poetry/ui/label:
    class_name: Poetry::Ui::Label::Component
    identifier: poetry--ui--label
    bem_block: poetry-ui-label
