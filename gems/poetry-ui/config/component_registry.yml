      - modal
      - open
      actions:
      - close
      - open
      - openValueChanged
      - toggle
      events:
      - poetry:popover:closed
      - poetry:popover:open
    - identifier: poetry--core--popper
      targets:
      - anchor
      - arrow
      - content
      values:
      - align
      - alignOffset
