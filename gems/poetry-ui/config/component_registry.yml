      - attr: data-copied
        condition: 'copy: only - stamped for a beat after a successful copy (the clipboard-text
          engine)'
    - name: code-block-pre
      description: The scroll container - tabindex 0 + role region + label (a scrollable
        region must be keyboard-reachable and named)
    - name: code-block-code
      description: The code element - rouge's .line/.hll spans and the seven --syntax-*
        token maps live under it; the copy affordance reads ITS textContent
    stimulus:
    - element: root
      conditional: if copy
      controllers:
      - identifier: poetry--core--clipboard-text
        registers: true
        values:
        - name: message
    - element: source
      conditional: if copy
      controllers:
      - identifier: poetry--core--clipboard-text
