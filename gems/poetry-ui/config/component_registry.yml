          in step)
      - attr: data-unchecked
        condition: off (the server-rendered default)
      - attr: data-size
        condition: always - the resolved size (the thumb reads it via group/switch
          selectors)
        values:
        - default
        - sm
    - name: switch-thumb
      description: The sliding knob - travel is pure CSS off the checked pair
      states:
      - attr: data-checked
        condition: mirrors the control (the controller reflects state on every part
          wearing the pair)
      - attr: data-unchecked
        condition: mirrors the control - the thumb sits at the start
