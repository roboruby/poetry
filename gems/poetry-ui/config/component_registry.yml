    - Never write the state attributes (data-popup-open / data-checked / data-unchecked)
      without their aria twin (aria-expanded / aria-checked) - the controller writes
      both; agents patching DOM must too.
    - 'Destructive items use variant: :destructive AND still confirm irreversible
      actions via a dialog.'
    - 'shortcut: is a visual hint only - it does NOT bind the key; wire a real hotkey
      separately or omit it.'
    - Do not nest interactive elements inside items (a menuitem IS the interactive
      unit).
    - Keep submenus <= 2 levels; prefer grouping + separators over deep nesting.
    - Critical actions must exist somewhere reachable without JS (menus are JS-required
      interaction).
