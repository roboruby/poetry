# poetry component registry - generated by `bin/rake registry:generate` FROM SOURCE.
# DO NOT EDIT: CI verifies this file matches a fresh build (rake registry:verify).
---
components:
  poetry/ui/button:
    class_name: Poetry::Ui::Button::Component
    identifier: poetry--ui--button
    bem_block: poetry-ui-button
    styles:
    - name: size
      type: symbol
      variants:
      - default
      - xs
      - sm
      - lg
      - icon
      - icon-xs
      - icon-sm
      - icon-lg
      default: default
      required: true
    - name: variant
      type: symbol
      variants:
      - default
      - destructive
      - outline
      - secondary
      - ghost
      - link
      default: default
      required: true
    options:
    - name: disabled
      type: boolean
      default: false
    - name: href
      type: string
    - name: label
      type: string
    - name: loading
      type: boolean
      default: false
    - name: tag
      type: symbol
      default: button
    - name: type
      type: symbol
      default: button
    slots:
    - name: leading
      many: false
    - name: trailing
      many: false
    elements: []
    capsule: aa16559d9dce
    agent_rules:
    - Use poetry_button - never a raw <button> with hand-written Tailwind.
    - 'Icon-only buttons (size: :icon*) MUST pass label: (the accessible name).'
    - 'Link-styled actions use variant: :link - not <a> with button classes.'
    - 'Loading via loading: - never a manual disabled + spinner.'
    - Never nest an interactive element inside a Button.
    - Pick the variant by intent; one primary (default) action per view.
  poetry/ui/icon:
    class_name: Poetry::Ui::Icon::Component
    identifier: poetry--ui--icon
    bem_block: poetry-ui-icon
    styles: []
    options:
    - name: label
      type: string
    - name: library
      type: symbol
    - name: name
      type: symbol
      required: true
    slots: []
    agent_rules:
    - 'Icons are decorative by default (aria-hidden); pass label: when the icon stands
      alone.'
    - Never inline raw <svg> markup where an icon exists - use poetry_icon.
