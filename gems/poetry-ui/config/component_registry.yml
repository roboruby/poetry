        condition: the placement side (popper re-writes it after collision flips)
        values:
        - top
        - right
        - bottom
        - left
      - attr: data-align
        condition: the alignment against the trigger (popper re-resolves it)
        values:
        - start
        - center
        - end
      vars:
      - name: "--transform-origin"
        description: popper's anchor-facing animation origin
      - name: "--available-width"
        description: 'popper: viewport space left for the panel (post-flip)'
      - name: "--available-height"
        description: 'popper: viewport space left for the panel (post-flip)'
      - name: "--anchor-width"
        description: 'popper: the trigger''s measured width'
      - name: "--anchor-height"
        description: 'popper: the trigger''s measured height'
    - name: dropdown-menu-group
      description: role=group semantic grouping between separators
    - name: dropdown-menu-label
      description: Non-interactive heading for a run of items
      states:
      - attr: data-inset
        condition: 'indented to align with checkbox/radio item text (inset: true)'
    - name: dropdown-menu-item
      description: One role=menuitem action row
      states:
      - attr: data-variant
        condition: default or destructive (the danger treatment)
      - attr: data-inset
        condition: 'indented to align with checkbox/radio item text (inset: true)'
      - attr: data-disabled
        condition: item is disabled (always written together with aria-disabled)
    - name: dropdown-menu-checkbox-item
      description: A role=menuitemcheckbox toggle row
      states:
      - attr: data-checked
        condition: checked (the controller re-writes the pair with aria-checked on
          activation)
      - attr: data-unchecked
        condition: unchecked
      - attr: data-disabled
        condition: item is disabled (always written together with aria-disabled)
      - attr: data-close-on-select
        condition: per-item override of the menu's close-on-select default ("false"
          keeps the menu open)
    - name: dropdown-menu-radio-group
      description: role=group scoping one single-select value
      states:
      - attr: data-value
        condition: the selected radio value (the controller re-writes it on change)
    - name: dropdown-menu-radio-item
      description: A role=menuitemradio row inside a radio group
      states:
      - attr: data-checked
        condition: the selected radio (the controller re-writes the pair with aria-checked)
      - attr: data-unchecked
        condition: not selected
      - attr: data-value
        condition: the radio's value
    - name: dropdown-menu-item-indicator
      description: The check/circle glyph slot inside checkbox and radio items - state
        rides the parent item; the glyph stays decorative
    - name: dropdown-menu-separator
      description: role=separator rule between groups
    - name: dropdown-menu-shortcut
      description: The trailing keybinding HINT - aria-hidden, never binds the key
    - name: dropdown-menu-sub
      description: A submenu scope - hosts its own popper around the sub trigger/content
        pair
    - name: dropdown-menu-sub-trigger
      description: The role=menuitem row opening its submenu
      states:
      - attr: data-popup-open
        condition: its submenu is open (written with aria-expanded; absence is the
          closed state)
    - name: dropdown-menu-sub-content
      description: The nested role=menu panel - its own popper content on the same
        presence machinery
      states:
      - attr: data-open
        condition: submenu is open (presence flips the pair at runtime)
      - attr: data-closed
        condition: submenu is closed (the server-rendered state)
      - attr: data-side
        condition: the placement side (right/left by direction; popper resolves it
          at runtime)
        values:
        - top
        - right
        - bottom
        - left
      - attr: data-align
        condition: the alignment against the sub-trigger (popper resolves it at runtime)
        values:
        - start
        - center
        - end
      vars:
      - name: "--transform-origin"
        description: popper's anchor-facing animation origin
      - name: "--available-width"
        description: 'popper: viewport space left for the panel (post-flip)'
      - name: "--available-height"
        description: 'popper: viewport space left for the panel (post-flip)'
      - name: "--anchor-width"
        description: 'popper: the sub-trigger''s measured width'
      - name: "--anchor-height"
        description: 'popper: the sub-trigger''s measured height'
  poetry/ui/empty:
    class_name: Poetry::Ui::Empty::Component
    identifier: poetry--ui--empty
    bem_block: poetry-ui-empty
    styles: []
    options:
    - name: media_variant
      type: symbol
      variants:
      - default
      - icon
      default: default
    - name: title_tag
      type: symbol
      variants:
      - h1
      - h2
      - h3
      - h4
      - h5
      - h6
      default: h3
    slots:
    - name: media
      many: false
    - name: title
      many: false
    - name: description
      many: false
    description: An empty-state placeholder with an icon, message, and actions.
    elements:
    - header
    - media
    - media_default
    - media_icon
    - title
    - description
    - content
    capsule: d036f9755885
    agent_rules:
    - An empty collection gets an Empty state with a next action - never a bare 'No
      results' div.
    - Compose with the slots (media/title/description); the actions are the content
      block.
    - 'The title renders as a real heading (h3 default) - set title_tag: to fit the
      page outline.'
    - 'media_variant: :icon gives the rounded muted icon tile; wrap a poetry_icon
      in with_media.'
    parts:
    - name: empty
      description: The empty-state root - the centered header and content stack
    - name: empty-header
      description: Wrapper around media/title/description - renders when at least
        one of those slots is set
    - name: empty-icon
      description: 'The media slot''s box - media_variant: :icon gives the rounded
        muted icon tile'
      states:
      - attr: data-variant
        condition: always - the resolved media_variant
        values:
        - default
        - icon
    - name: empty-title
      description: The title as a real heading (title_tag, h3 by default)
    - name: empty-description
      description: Muted copy under the title
    - name: empty-content
      description: The actions that fix the emptiness - the content block renders
        here
  poetry/ui/field:
    class_name: Poetry::Ui::Field::Component
    identifier: poetry--ui--field
    bem_block: poetry-ui-field
    styles:
    - name: orientation
      type: symbol
      variants:
      - vertical
      - horizontal
      - responsive
      default: vertical
      required: true
    options:
    - name: error
      type: string
    - name: group
      type: boolean
      default: false
    - name: hint
      type: string
    - name: id
      type: string
      required: true
    - name: label_text
      type: string
    - name: required
      type: boolean
      default: false
    slots: []
    description: Wraps a form control with its label, hint, and validation message.
    elements:
    - hint
    - error
    capsule: 1aaa37ea0a25
    agent_rules:
    - Wire the control with field.control_attributes - never hand-write aria-describedby.
    - 'Error text arrives via error: (from model errors upstream) - never a bare red
      <p>.'
    - 'orientation: :horizontal is the boolean-control layout (checkbox/switch left,
      label + hint stacked right) - text inputs and groups stay vertical.'
    - 'orientation: :responsive stacks by default and flips label-left / control-right
      once its poetry_field_group container passes the md mark - the settings-page
      recipe (it needs that FieldGroup ancestor to measure against).'
    parts:
    - name: field
      description: The quartet's grid root - label, control, hint, and error stack
        inside
      states:
      - attr: data-invalid
        condition: 'always - true when error: is present, else false'
        values:
        - 'true'
        - 'false'
      - attr: data-orientation
        condition: always - the resolved orientation (horizontal is the boolean-control
          layout)
        values:
        - vertical
        - horizontal
        - responsive
    - name: field-hint
      description: The hint <p> - its id lands in the control's aria-describedby
    - name: field-error
      description: 'The error <p> - present only when error: is set; its id leads
        the control''s aria-describedby'
    - name: checkbox-input
      description: A nested Checkbox's hidden native input - the toggle renders as
        a wrapper-free fragment, so its sibling form store sits directly in the field's
        DOM (the horizontal boolean-control layout)
  poetry/ui/field_group:
    class_name: Poetry::Ui::FieldGroup::Component
    identifier: poetry--ui--field_group
    bem_block: poetry-ui-field_group
    styles:
    - name: variant
      type: symbol
      variants:
      - default
      - choices
      default: default
      required: true
    options: []
    slots: []
    elements: []
    capsule: 3a6d6c901a2d
    agent_rules:
    - Stack Fields (and Fieldsets) with poetry_field_group - the theme owns the rhythm;
      never hand-space a form column with gap utilities.
    - 'variant: :choices packs a run of horizontal checkbox/switch fields tighter
      (the upstream checkbox-group form).'
    - 'Field''s orientation: :responsive is container-driven: it needs a FieldGroup
      ancestor to measure against - without one it stays stacked.'
    parts:
    - name: field-group
      description: The stacking container - fields, fieldsets, and separators render
        as direct children; also the @container responsive fields measure against
  poetry/ui/field_separator:
    class_name: Poetry::Ui::FieldSeparator::Component
    identifier: poetry--ui--field_separator
    bem_block: poetry-ui-field_separator
    styles: []
    options: []
    slots: []
    elements:
    - content
    capsule: 568b511b71b3
    agent_rules:
    - Divides stacked fields inside a poetry_field_group - not a general-purpose rule
      (that is poetry_separator).
    - Pass a block for the inline caption form ("Or continue with") - the caption
      sits on the line, backed by the page background.
    parts:
    - name: field-separator
      description: The divider row - a decorative Separator drawn across it
      states:
      - attr: data-content
        condition: always - whether the inline caption renders
        values:
        - 'true'
        - 'false'
    - name: field-separator-content
      description: The inline caption span (block content) - sits on the line, backed
        by the page background
  poetry/ui/fieldset:
    class_name: Poetry::Ui::Fieldset::Component
    identifier: poetry--ui--fieldset
    bem_block: poetry-ui-fieldset
    styles: []
    options:
    - name: hint
      type: string
    - name: legend
      type: string
      required: true
    - name: legend_variant
      type: symbol
      variants:
      - legend
      - label
      default: legend
    slots: []
    elements:
    - legend
    - hint
    capsule: ded27f98b84a
    agent_rules:
    - 'A run of related fields gets poetry_fieldset with legend: - the group''s accessible
      name (a bare <div> around fields tells AT nothing).'
    - 'legend_variant: :label renders the legend at label size - use it when the group
      is one setting explained by its rows (checkbox/switch runs).'
    - 'hint: is the muted description under the legend; per-field hints stay on the
      fields.'
    - Stack the fields inside with poetry_field_group - never hand-spaced flex columns.
    parts:
    - name: field-set
      description: The <fieldset> root - legend, optional hint, then the fields
    - name: field-legend
      description: The <legend> - the group's accessible name
      states:
      - attr: data-variant
        condition: always - the legend's size treatment
        values:
        - legend
        - label
    - name: field-set-hint
      description: Muted description under the legend (hint:)
  poetry/ui/file_input:
    class_name: Poetry::Ui::FileInput::Component
    identifier: poetry--ui--file_input
    bem_block: poetry-ui-file_input
    styles:
    - name: variant
      type: symbol
      variants:
      - input
      - dropzone
      default: input
    options:
    - name: accept
      type: string
    - name: described_by
      type: string
    - name: disabled
      type: boolean
      default: false
    - name: hint
      type: string
    - name: id
      type: string
    - name: invalid
      type: boolean
      default: false
    - name: multiple
      type: boolean
      default: false
    - name: name
      type: string
    - name: prompt
      type: string
    slots: []
    description: A control for selecting, previewing, and removing files to upload.
    elements:
    - dropzone
    - dropzone_disabled
    - icon
    - prompt
    - hint
    - list
    - clear
    capsule: 14a68c52b6be
    controllers:
    - identifier: poetry--core--file-input
      targets:
      - clear
      - input
      - list
      values:
      - multiple
      actions:
      - changed
      - clear
      - dragenter
      - dragleave
      - dragover
      - drop
      events:
      - poetry:file-input:change
    agent_rules:
    - 'File selection is a FileInput: variant: :input for compact forms, :dropzone
      when dragging is expected (uploads as the page''s point) - never a hand-rolled
      drop div.'
    - 'The native input is the form value: set name: (multiple: true wants a name
      ending in [] for Rails params); ActiveStorage direct upload attaches to it as
      usual.'
    - 'The dropzone''s selected-file list and clear button are controller-rendered
      - compose prompt:/hint: copy instead of adding your own list markup.'
    - In a Field, prefer form.file_input (the builder wires id/label/errors); the
      bare component suits standalone dropzones.
    parts:
    - name: file-input
      description: The dropzone root - wraps the zone, the selection list, and clear
      states:
      - attr: data-variant
        condition: always on the dropzone root (the input variant renders the Input
          component instead)
        values:
        - dropzone
      - attr: data-dragging
        condition: a file drag is over the zone (controller-written, enter/leave counted)
      - attr: data-populated
        condition: the native input holds at least one file (controller-written)
    - name: file-input-dropzone
      description: The <label> drop surface - dashed, platform click-to-browse; its
        text is the control's accessible name
    - name: file-input-control
      description: The native <input type=file> - visually hidden in the dropzone,
        THE form value in both variants
    - name: file-input-prompt
      description: 'The zone''s instruction line (prompt: overrides the default)'
    - name: file-input-hint
      description: 'Muted constraints copy under the prompt (hint: - formats, size)'
    - name: file-input-list
      description: The selected-file <ul> the controller fills (name + size per item;
        items are controller-built, not server parts)
    - name: file-input-clear
      description: The clear affordance - hidden until populated; never re-opens the
        picker
  poetry/ui/hover_card:
    class_name: Poetry::Ui::HoverCard::Component
    identifier: poetry--ui--hover_card
    bem_block: poetry-ui-hover_card
    styles: []
    options:
    - name: align
      type: symbol
      variants:
      - start
      - center
      - end
      default: center
    - name: align_offset
      type: integer
      default: 0
    - name: avoid_collisions
      type: boolean
      default: true
    - name: close_delay
      type: integer
      default: 300
    - name: content_class
      type: string
    - name: defer
      type: string
    - name: open
      type: boolean
      default: false
    - name: open_delay
      type: integer
      default: 700
    - name: side
      type: symbol
      variants:
      - top
      - right
      - bottom
      - left
      default: bottom
    - name: side_offset
      type: integer
      default: 4
    slots:
    - name: trigger
      many: false
      setter_args:
        trigger: 0
    description: A card that reveals preview content when its trigger is hovered.
    elements:
    - content
    capsule: 4e75d7b14fde
    controllers:
    - identifier: poetry--core--hover-card
      targets: []
      values:
      - closeDelay
      - open
      - openDelay
      actions:
      - blurClose
      - focusOpen
      - openValueChanged
      - pointerEnter
      - pointerLeave
      - touchGuard
      events:
      - poetry:hover-card:closed
      - poetry:hover-card:open
    - identifier: poetry--core--popper
      targets:
      - anchor
      - arrow
      - content
      values:
      - align
      - alignOffset
      - anchor
      - anchorPoint
      - avoidCollisions
      - side
      - sideOffset
      - strategy
      actions:
      - anchorPointValueChanged
      - reposition
      - setAnchor
      - setAnchorElement
      - strategyValueChanged
      events: []
    agent_rules:
    - Use poetry_hover_card - never hand-roll hover-div previews.
    - 'THE REACHABLE-ELSEWHERE RULE (non-negotiable): every piece of information in
      a hover card MUST exist at the trigger link''s destination (or another keyboard/touch-reachable
      surface). The card is pointer-only enrichment - keyboard and touch users never
      see inside it.'
    - The trigger must be a REAL link with a real href - it is the fallback, the touch
      path, and the keyboard path all at once.
    - NO interactive elements inside the card - they get tabindex=-1 stripped and
      become pointer-only traps. Actions belong in a Popover or at the destination.
    - Don't add aria-expanded/haspopup to the trigger - advertising an unreachable
      surface is worse than silence (Radix-aligned).
    - Never use HoverCard for hints (Tooltip) or for content users act on (Popover).
    - 'Prefer defer: for expensive previews - a lazy turbo-frame that fetches on first
      open.'
    required_slots:
      trigger: the enriched link
    parts:
    - name: hover-card
      description: Root wrapper around the trigger link and the panel
    - name: hover-card-trigger
      description: The enriched link itself - simultaneously the no-JS fallback, the
        touch path, and the keyboard path
      states:
      - attr: data-popup-open
        condition: bare while the card is open; absent while closed (Base UI absence-is-the-state)
    - name: hover-card-content
      description: The role-less preview panel (invisible to AT on purpose) - positioning,
        animation, and the open state ride here
      states:
      - attr: data-open
        condition: card is open (the controller flips the pair at runtime)
      - attr: data-closed
        condition: card is closed (the server-rendered state; hidden rides along)
      - attr: data-side
        condition: always - the side (initial placement, re-resolved live by popper
          after flip)
        values:
        - top
        - right
        - bottom
        - left
      - attr: data-align
        condition: always - the alignment (re-resolved live by popper)
        values:
        - start
        - center
        - end
      vars:
      - name: "--transform-origin"
        description: the anchor-facing origin popper writes for scale-in animation
      - name: "--available-width"
        description: viewport space left for the panel (popper, post-flip)
      - name: "--available-height"
        description: viewport space left for the panel (popper, post-flip)
      - name: "--anchor-width"
        description: the anchor's measured width (popper)
      - name: "--anchor-height"
        description: the anchor's measured height (popper)
  poetry/ui/icon:
    class_name: Poetry::Ui::Icon::Component
    identifier: poetry--ui--icon
    bem_block: poetry-ui-icon
    styles: []
    options:
    - name: label
      type: string
    - name: library
      type: symbol
    - name: name
      type: symbol
      required: true
      format: icon-name
    slots: []
    description: Renders an inline SVG icon from the icon set.
    agent_rules:
    - 'Icons are decorative by default (aria-hidden); pass label: when the icon stands
      alone.'
    - Never inline raw <svg> markup where an icon exists - use poetry_icon.
    parts:
    - name: icon
      description: 'The <svg> root itself - the vendored icon markup renders inside;
        ARIA (label: vs decorative) rides here'
  poetry/ui/input:
    class_name: Poetry::Ui::Input::Component
    identifier: poetry--ui--input
    bem_block: poetry-ui-input
    styles: []
    options:
    - name: disabled
      type: boolean
      default: false
    - name: invalid
      type: boolean
      default: false
    - name: mask
      type: string
    - name: name
      type: string
    - name: placeholder
      type: string
    - name: type
      type: string
      default: text
    - name: value
      type: string
    slots: []
    description: A form control for entering a single line of text.
    elements: []
    capsule: 6c6f930e4e44
    controllers:
    - identifier: poetry--core--mask
      targets: []
      values:
      - alwaysShowMask
      - autoClear
      - mask
      - showMaskOnFocus
      - slotChar
      - upcase
      actions: []
      events:
      - poetry:mask:change
      - poetry:mask:complete
    agent_rules:
    - Inside a form, never render Input directly - use the FormBuilder's field (it
      wires ids, errors, and aria).
    - Error styling comes from aria-invalid, set from model errors - never hand-toggle
      error classes.
    - 'mask: formats as the user types (''(999) 999-9999''; 9=digit, a=letter, A=upper,
      *=alnum, #=sign/digit, \\ escapes, ? makes the rest optional) - the MASKED text
      submits; read data-raw for the bare value.'
    parts:
    - name: input
      description: The <input> element itself - no inner anatomy; error state is aria-invalid
        (set by Field/FormBuilder), never a parallel class
      states:
      - attr: data-raw
        condition: 'mask: is set - the unmasked value, kept live by the mask controller
          (the masked text is what submits)'
  poetry/ui/input_group:
    class_name: Poetry::Ui::InputGroup::Component
    identifier: poetry--ui--input_group
    bem_block: poetry-ui-input_group
    styles: []
    options: []
    slots: []
    description: One bordered surface combining an input with buttons, icons, or add-ons.
    elements:
    - addon
    - addon_inline_start
    - addon_inline_end
    - addon_block_start
    - addon_block_end
    - text
    - control_input
    - control_textarea
    - button
    - button_xs
    - button_icon_xs
    - button_icon_sm
    capsule: 4a85770e4326
    agent_rules:
    - The control INSIDE must be poetry_input_group_input/_textarea - a plain poetry_input
      keeps its own border+ring and double-chromes the group.
    - Addons are poetry_input_group_addon(align:) wrapping icons/text/buttons; use
      poetry_input_group_text for muted captions and poetry_input_group_button for
      tiny actions.
    - The group is a surface, not a label - the control still needs its Label/Field
      pairing.
    requires_content: its control + addons
    parts:
    - name: input-group
      description: The bordered group surface (role=group) - wears the border, the
        focus-within ring, and the invalid ring for the borderless control inside
    - name: input-group-addon
      description: One addon cell (icons, text, kbd hints, tiny buttons) rendered
        by poetry_input_group_addon around the control
      states:
      - attr: data-align
        condition: 'always - the addon''s align: axis (inline rides the row, block
          takes a full-width row)'
        values:
        - inline-start
        - inline-end
        - block-start
        - block-end
  poetry/ui/input_otp:
    class_name: Poetry::Ui::InputOtp::Component
    identifier: poetry--ui--input_otp
    bem_block: poetry-ui-input_otp
    styles: []
    options:
    - name: disabled
      type: boolean
      default: false
    - name: groups
      type:
    - name: invalid
      type: boolean
      default: false
    - name: length
      type: integer
      required: true
    - name: name
      type: string
      required: true
    - name: pattern
      type:
      default: digits
    - name: required
      type: boolean
      default: false
    - name: separator
      type: boolean
      default: true
    - name: value
      type: string
    slots: []
    description: A fixed-length, segmented input for one-time passcodes.
    elements:
    - input
    - group
    - slot
    - caret
    - caret_bar
    capsule: ed09d64cf39e
    controllers:
    - identifier: poetry--core--otp
      targets:
      - input
      - slot
      values:
      - length
      - pattern
      actions:
      - focusInput
      - paste
      - sync
      events:
      - poetry:otp:change
      - poetry:otp:complete
    agent_rules:
    - Use poetry_input_otp / form.otp_field - NEVER build per-cell inputs (n Tab stops,
      broken paste, broken SMS autofill, unnameable cells).
    - Label via Field always ('Verification code'); put the length in the hint.
    - groups must sum to length (ArgumentError).
    - Do NOT auto-submit on poetry:otp:complete without a visible confirm affordance
      - silent submit on the 6th keystroke strands users who mistyped char 3.
    - 'Never pre-fill value: with a real code in previews/test fixtures beyond dummies;
      never log the value (it is a live credential).'
    - InputOTP is for CODES - passwords use Input type=password, longer identifiers
      use Input.
    parts:
    - name: input-otp-container
      description: Root row (forced dir=ltr - slot order equals string index order
        even on RTL pages) wrapping the real input and the mirror cells
    - name: input-otp
      description: THE real native <input> (autocomplete one-time-code) stretched
        invisibly over the row - the only AT and serialization surface
    - name: input-otp-group
      description: 'One aria-hidden cluster of mirror cells (groups: clustering)'
    - name: input-otp-slot
      description: One presentational mirror cell - paints its char and the active-cell
        ring
      states:
      - attr: data-active
        condition: '"true" while the native caret sits on this cell (the controller
          projects selectionStart while the input is focused; the server renders "false")'
        values:
        - 'true'
        - 'false'
    - name: input-otp-caret
      description: The fake-caret overlay - hidden server-side; the controller unhides
        it on the active EMPTY cell
    - name: input-otp-separator
      description: The between-groups dash - role=separator kept for parity but aria-hidden
        (a recorded divergence)
  poetry/ui/item:
    class_name: Poetry::Ui::Item::Component
    identifier: poetry--ui--item
    bem_block: poetry-ui-item
    styles:
    - name: size
      type: symbol
      variants:
      - default
      - sm
      - xs
      default: default
      required: true
    - name: variant
      type: symbol
      variants:
      - default
      - outline
      - muted
      default: default
      required: true
    options:
    - name: media_variant
      type: symbol
      variants:
      - default
      - icon
      - image
      default: default
    - name: tag
      type: symbol
      default: div
    slots:
    - name: media
      many: false
    - name: title
      many: false
    - name: description
      many: false
    - name: actions
      many: false
    - name: header
      many: false
    - name: footer
      many: false
    description: A generic list row with media, content, and actions.
    elements:
    - media
    - media_default
    - media_icon
    - media_image
    - content
    - title
    - description
    - actions
    - header
    - footer
    - group
    - separator
    capsule: 0c4d5480a0b2
    agent_rules:
    - 'Rows live inside poetry_item_group (role=list) and each row passes role: "listitem"
      - a role=list parent with roleless children fails aria-required-children.'
    - Separate grouped rows with poetry_item_separator.
    - Compose with the slots (media/title/description/actions); loose content lands
      in the content column after the description.
    - 'media_variant: :icon for a glyph, :image for a thumbnail (sized/rounded automatically).'
    - 'A clickable row is tag: :a with href: - never wrap an Item in a bare <a>.'
    parts:
    - name: item
      description: 'The row root (a div by default; tag: :a for a clickable row) -
        variant and density land here as data attributes'
      states:
      - attr: data-variant
        condition: the row's visual variant
        values:
        - default
        - outline
        - muted
      - attr: data-size
        condition: the row's density
        values:
        - default
        - sm
        - xs
    - name: item-media
      description: The leading media cell - sized and rounded by its variant
      states:
      - attr: data-variant
        condition: the media treatment
        values:
        - default
        - icon
        - image
    - name: item-content
      description: The center column collecting title, description, and loose content
    - name: item-title
      description: The title row
    - name: item-description
      description: The muted description line
    - name: item-actions
      description: The trailing actions cell
  poetry/ui/kbd:
    class_name: Poetry::Ui::Kbd::Component
    identifier: poetry--ui--kbd
    bem_block: poetry-ui-kbd
