  poetry/ui/field:
    class_name: Poetry::Ui::Field::Component
    identifier: poetry--ui--field
    bem_block: poetry-ui-field
    styles:
    - name: orientation
      type: symbol
      variants:
      - vertical
      - horizontal
      - setting
      - responsive
      default: vertical
      required: true
      description: 'The layout axis. :horizontal is the boolean-control pattern: the
        control lands in the first grid column, label + hint/error stack in the second,
        and the control row-centers against the label line.'
    options:
    - name: error
      type: string
      description: The error line (typically from model errors) - presence flips the
        invalid skin and leads the control's aria-describedby.
    - name: group
      type: boolean
      default: false
      description: 'group: the control is a role-bearing <div> (RadioGroup, Slider)
        - label[for] would be inert (Chrome flags it), so the label drops for=, carries
        label_id, and control_attributes names the group via aria-labelledby (the
        visible label, i18n-proof).'
    - name: hint
      type: string
      description: Plain-text guidance under the control (escaped wholesale); use
        with_hint for authored markup.
    - name: hint_position
      type: symbol
      default: below
      description: Where the hint renders relative to the control - :above puts guidance
        before a tall control. aria-describedby is identical either way; this is visual
        order only.
    - name: id
      type: string
      required: true
      description: The control's DOM id - the hint/error/label ids derive from it.
    - name: invalid
      type: boolean
      default: false
      description: 'Flips the invalid skin (data-invalid + aria-invalid) WITHOUT an
        error line. error: implies it; use invalid: alone when the hint copy IS the
        requirement.'
    - name: label_text
      type: string
      description: The visible label text, associated with the control via for=.
    - name: required
      type: boolean
      default: false
      description: Marks the control required via aria-required only - never the native
        required attribute.
    slots: []
    description: Wraps a form control with its label, hint, and validation message.
    slot_extras:
    - hint
    elements:
    - label
    - hint
    - error
    capsule: 98d08f080836
    agent_rules:
    - Wire the control with field.control_attributes - never hand-write aria-describedby.
    - 'Error text arrives via error: (from model errors upstream) - never a bare red
      <p>.'
    - 'hint: (escaped string) for pure data; with_hint { } for authored markup (links)
      - call it BEFORE the control so the hint id lands in aria-describedby.'
    - 'orientation: :horizontal is the boolean-control layout (checkbox/switch left,
      label + hint stacked right) - text inputs and groups stay vertical.'
    - 'orientation: :responsive stacks by default and flips label-left / control-right
      once its poetry_field_group container passes the md mark - the settings-page
      recipe (it needs that FieldGroup ancestor to measure against).'
    identity: false
    parts:
    - name: field
      description: The quartet's grid root - label, control, hint, and error stack
        inside
      states:
      - attr: data-invalid
        condition: 'always - true when error: is present or invalid: is set, else
          false'
        values:
        - 'true'
        - 'false'
      - attr: data-orientation
        condition: always - the resolved orientation (horizontal is the boolean-control
          layout)
        values:
        - vertical
        - horizontal
        - setting
        - responsive
    - name: field-label
      description: The Label (composed) wearing the source's field-label slot - names
        the control
    - name: field-description
      description: The hint <p> (the source's description) - its id lands in the control's
        aria-describedby
    - name: field-error
      description: 'The error <p> - present only when error: is set; its id leads
        the control''s aria-describedby'
    - name: checkbox-input
      description: A nested Checkbox's hidden native input - the toggle renders as
        a wrapper-free fragment, so its sibling form store sits directly in the field's
        DOM (the horizontal boolean-control layout)
    - name: switch-input
      description: A nested Switch's hidden native input - the same wrapper-free fragment
        escape as checkbox-input (the setting-row layout)
  poetry/ui/field_group:
