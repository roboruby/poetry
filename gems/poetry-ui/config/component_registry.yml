# poetry component registry - generated by `bin/rake registry:generate` FROM SOURCE.
# DO NOT EDIT: CI verifies this file matches a fresh build (rake registry:verify).
---
components:
  poetry/ui/accordion:
    class_name: Poetry::Ui::Accordion::Component
    identifier: poetry--ui--accordion
    bem_block: poetry-ui-accordion
    styles: []
    options:
    - name: collapsible
      type: boolean
      default: false
      description: 'With type: :single, allows the open section to be closed again.'
    - name: heading_level
      type: symbol
      variants:
      - h2
      - h3
      - h4
      - h5
      - h6
      default: h3
      description: The heading element wrapping each trigger; pick it to fit the page
        outline.
    - name: open
      type: list
      default: dynamic
      description: Value keys of the sections rendered expanded on load.
    - name: type
      type: symbol
      variants:
      - single
      - multiple
      default: single
      description: Whether one section (:single) or several (:multiple) may be open
        at once.
    slots:
    - name: items
      many: true
      description: 'The accordion sections. Each takes value: (its open-state key),
        title:, and a block of panel content; disabled: true locks the section closed.'
      setter_args:
        item: 0
      yieldless:
      - item
    description: A vertically stacked set of interactive headings that each reveal
      a section of content.
    elements:
    - item
    - header
    - trigger
    - indicator
    - content
    - inner
    capsule: 206ee68faf91
    controllers:
    - identifier: poetry--core--accordion
      targets: []
      values:
      - collapsible
      - type
      actions:
      - toggle
      events:
      - poetry:accordion:change
    - identifier: poetry--core--roving-focus
      targets: []
      values:
      - loop
      - manageTabindex
      - orientation
      actions:
      - keydown
      events:
      - poetry--core--roving-focus:entry
    agent_rules:
    - Items via with_item(value:, title:) { panel content } - value is the open-state
      key.
    - 'type: :single (default) opens one at a time; pass collapsible: true to allow
      closing it.'
    - 'Server-render the open item(s) via open: %w[value] - never toggle data-open/data-closed
      by hand.'
    - 'heading_level: fits the page outline (h3 default) - the trigger button lives
      inside it.'
    - The chevron is built in - never add another indicator icon to the trigger.
    - 'disabled: true on with_item locks that item (native disabled on the trigger;
      roving focus skips it).'
    required_slots:
      item: at least one item
    parts:
    - name: accordion
      description: The list root - both controllers (the open-set machine and roving
        focus) ride here
      states:
      - attr: data-orientation
        condition: always vertical - the only axis the accordion ships
        values:
        - vertical
    - name: accordion-item
      description: One value-keyed section wrapping its header and panel
      states:
      - attr: data-open
        condition: the item is expanded (server-rendered from open:; the controller
          flips the pair at runtime)
      - attr: data-closed
        condition: the item is collapsed
      - attr: data-value
        condition: the item's open-state key (always present)
      - attr: data-disabled
        condition: 'with_item(disabled: true) - the item is locked (styling hook;
          the trigger carries the native disabled attribute)'
    - name: accordion-header
      description: The heading element (heading_level:, h3 default) hosting the trigger
        button
    - name: accordion-trigger
      description: The toggle button inside the header - the chevron rotation rides
        aria-expanded, not a data attribute
      states:
      - attr: data-panel-open
        condition: its panel is open (controller-written; absent while closed)
      - attr: data-disabled
        condition: 'with_item(disabled: true) - stamped beside the native disabled
          attribute; roving focus filters it out at query time'
    - name: accordion-trigger-icon
      description: The chevron svg inside the trigger (aria-hidden) - rotates with
        the item
    - name: accordion-content
      description: The role=region panel - the presence animation and the measured
        height var ride here
      states:
      - attr: data-open
        condition: panel is open or entering
      - attr: data-closed
        condition: panel is closed or animating out (hidden lands after the exit finishes)
      vars:
      - name: "--accordion-panel-height"
        description: the measured content height (controller-written) that feeds the
          accordion-down/up keyframes
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--accordion
        registers: true
        values:
        - name: type
        - name: collapsible
      - identifier: poetry--core--roving-focus
        registers: true
        values:
        - name: orientation
        - name: manage_tabindex
        actions:
        - method: keydown
          'on': keydown
    - element: trigger
      controllers:
      - identifier: poetry--core--accordion
        actions:
        - method: toggle
          'on': click
  poetry/ui/alert:
    class_name: Poetry::Ui::Alert::Component
    identifier: poetry--ui--alert
    bem_block: poetry-ui-alert
    styles:
    - name: variant
      type: symbol
      variants:
      - default
      - destructive
      default: default
      required: true
      description: The intent axis; :destructive marks errors and announces assertively.
    options: []
    slots:
    - name: icon
      many: false
      description: 'Optional leading icon; pass icon props (e.g. name: :"triangle-alert"),
        not a block.'
      component: poetry/ui/icon
      setter_args:
        icon: 1
    - name: title
      many: false
      description: The heading line of the callout.
    - name: action
      many: false
      description: Optional corner action (a dismiss button or link), pinned to the
        top-right.
    description: A callout that highlights an important inline message.
    elements:
    - title
    - action
    - description
    capsule: 5fb1cebf9cca
    agent_rules:
    - Use poetry_alert for inline callouts - it carries role/aria-live; never a hand-rolled
      div.
    - destructive announces assertively (role=alert) - reserve it for errors, not
      emphasis.
    identity: false
    parts:
    - name: alert
      description: The callout root - role rides the variant (destructive announces
        assertively via role=alert; default is a polite role=status)
      states:
      - attr: data-variant
        condition: always - the resolved variant
        values:
        - default
        - destructive
    - name: alert-title
      description: The heading line, rendered when the title slot is set
    - name: alert-action
      description: The corner action well (with_action) - a dismiss or link pinned
        to the top-right by the theme
    - name: alert-description
      description: The body copy - the content block renders here
  poetry/ui/alert_dialog:
    class_name: Poetry::Ui::AlertDialog::Component
    identifier: poetry--ui--alert_dialog
    bem_block: poetry-ui-alert_dialog
    styles:
    - name: size
      type: symbol
      variants:
      - default
      - sm
      default: default
      required: true
      description: The panel size; :sm compacts the layout and switches the footer
        to a two-column grid.
    options:
    - name: content_class
      type: string
      description: Extra classes merged onto the panel element.
    slots:
    - name: trigger
      many: false
      description: The button that opens the dialog; keywords are forwarded as Button
        props.
      component: poetry/ui/button
      setter_args:
        trigger: 0
      yieldless:
      - trigger
    - name: title
      many: false
      description: The heading - the dialog's accessible name (required).
    - name: description
      many: false
      description: The explanation read alongside the title by assistive tech (required).
    - name: media
      many: false
      description: Optional icon/illustration well above the title.
    - name: action
      many: false
      description: 'The confirming choice (required) - a Button; pass variant: :destructive
        for deletes. Activating it also closes the dialog (a caller-supplied data-action
        opts out).'
      component: poetry/ui/button
      setter_args:
        action: 0
      yieldless:
      - action
    - name: cancel
      many: false
      description: The safe way out (required) - an outline Button that takes initial
        focus and closes the dialog on activation.
      component: poetry/ui/button
      setter_args:
        cancel: 0
      yieldless:
      - cancel
    description: A modal dialog that interrupts the user and expects a response.
    elements:
    - content
    - header
    - header_with_media
    - header_size_default
    - header_size_default_with_media
    - media
    - media_size_default
    - title
    - title_beside_media
    - description
    - footer
    - footer_size_sm
    capsule: e5c1096d0fe6
    controllers:
    - identifier: poetry--core--dialog
      targets:
      - dialog
      values:
      - dismissible
      - hotkey
      actions:
      - backdropClose
      - close
      - lockScroll
      - open
      - toggle
      - unlockScroll
      events: []
    agent_rules:
    - 'with_trigger(compose: true) { |wiring| ... } composes YOUR control as the trigger:
      the block is yielded the trigger wiring (the Stimulus behavior the overlay needs;
      poppers add id/aria and their trigger slot, modals hand only the open action)
      - splat it onto a wiring-free control (poetry_sidebar_menu_button, a plain tag);
      without compose: the classic composed Button renders.'
    - 'Destructive confirmations use AlertDialog with with_action(variant: :destructive)
      - never a bare Dialog, never data-turbo-confirm.'
    - with_title AND with_description are REQUIRED (both raise).
    - The action must be an explicit user activation - agents NEVER auto-submit the
      action.
    - No extra form fields inside an AlertDialog - if input is needed, use a Dialog.
    - 'Cancel keeps variant: :outline; do not make cancel visually primary.'
    required_slots:
      title: the accessible name
      description: the alertdialog must explain itself
      action: the confirming choice
      cancel: the safe way out
    parts:
    - name: alert-dialog
      description: Root wrapper around the trigger and the <dialog> element
    - name: alert-dialog-content
      description: The role=alertdialog <dialog> panel - sizing, animation, and the
        open state ride here
      states:
      - attr: data-open
        condition: panel is open (the shared dialog controller flips the pair at runtime)
      - attr: data-closed
        condition: panel is closed (the server-rendered state)
      - attr: data-size
        condition: always - the resolved size
        values:
        - default
        - sm
    - name: alert-dialog-header
      description: Title block - holds the optional media well, the title, and the
        description
    - name: alert-dialog-media
      description: The optional media well above the title (an icon or illustration)
        - the header's first row; absent unless with_media is used
    - name: alert-dialog-title
      description: The heading - the alertdialog's accessible name (required slot)
    - name: alert-dialog-description
      description: The explanation, wired to aria-describedby (required slot)
    - name: alert-dialog-footer
      description: The choice row - cancel then action
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--dialog
        registers: true
        values:
        - name: dismissible
    - element: content
      controllers:
      - identifier: poetry--core--dialog
        targets:
        - name: dialog
        actions:
        - method: close
          'on': cancel
        - method: backdropClose
          'on': click
    - element: trigger
      controllers:
      - identifier: poetry--core--dialog
        actions:
        - method: open
    - element: close
      controllers:
      - identifier: poetry--core--dialog
        actions:
        - method: close
  poetry/ui/aspect_ratio:
    class_name: Poetry::Ui::AspectRatio::Component
    identifier: poetry--ui--aspect_ratio
    bem_block: poetry-ui-aspect_ratio
    styles: []
    options:
    - name: ratio
      type: string
      required: true
      description: 'A CSS <ratio>: "16/9", "1", "1.5" - kept a string so the fraction
        survives verbatim into the --ratio custom property.'
    slots: []
    description: Locks its content to a fixed width-to-height ratio.
    elements: []
    capsule: e82cf8a38845
    agent_rules:
    - 'Pass ratio: as a string fraction (''16/9'', ''1/1'') - Ruby''s 16/9 is integer
      division (1).'
    - The child fills the box itself (size-full object-cover on an image).
    identity: false
    parts:
    - name: aspect-ratio
      description: The ratio-locked box - the content block fills it
      vars:
      - name: "--ratio"
        description: 'always - the ratio: fraction verbatim (''16/9''), consumed by
          the theme''s aspect-ratio rule'
  poetry/ui/attachment:
    class_name: Poetry::Ui::Attachment::Component
    identifier: poetry--ui--attachment
    bem_block: poetry-ui-attachment
    styles:
    - name: orientation
      type: symbol
      variants:
      - horizontal
      - vertical
      default: horizontal
      required: true
      description: Row (:horizontal) or stacked thumbnail-card (:vertical) layout.
    - name: size
      type: symbol
      variants:
      - default
      - sm
      - xs
      default: default
      required: true
      description: The chip density axis.
    options:
    - name: state
      type: symbol
      variants:
      - idle
      - uploading
      - processing
      - error
      - done
      default: done
      description: The upload lifecycle state; flip it by re-render or Turbo Stream
        replace, never in JS.
    slots:
    - name: media
      many: false
      description: 'Leading visual: :icon (default) boxes an icon tile, :image wraps
        the caller''s <img>.'
      setter_args:
        media: 0
      setter_kwargs:
        media:
        - variant
      yieldless:
      - media
    - name: title
      many: false
      description: The file name line. User content - never mark it html_safe.
    - name: description
      many: false
      description: Muted metadata under the title (size, type); in the error state,
        the failure explanation.
    - name: actions
      many: true
      description: Trailing icon actions - each renders a Button (ghost, icon-xs defaults)
        and requires label:.
      setter_args:
        action: 0
      yieldless:
      - action
    - name: trigger
      many: false
      description: 'Makes the whole chip the control - a stretched button (or anchor
        via tag: :a, href:) layered under the actions. Don''t also wrap the chip in
        a link.'
      setter_args:
        trigger: 0
      yieldless:
      - trigger
    description: A file or image chip showing its name, type, and size.
    elements:
    - media
    - content
    - title
    - description
    - actions
    - trigger
    - group
    capsule: 5391289a07dd
    agent_rules:
    - 'State is server-owned: render data-upload-state and flip it by Turbo Stream
      replace - never toggle it in JS.'
    - 'with_media(variant: :image) wraps the caller''s <img>; file names and URLs
      are user content - never render them html_safe.'
    - 'Actions are with_action(...) poetry Buttons (ghost/icon-xs defaults) - each
      needs label: (icon-only).'
    - with_trigger makes the whole chip the control (a stretched overlay UNDER the
      actions) - don't also wrap the chip in a link.
    - error state needs a with_description explaining the failure - the tint alone
      is not the message.
    identity: false
    parts:
    - name: attachment
      description: The chip root - the server-owned upload lifecycle rides here (flip
        data-upload-state by re-render / Turbo Stream replace)
      states:
      - attr: data-upload-state
        condition: always - the resolved state
        values:
        - idle
        - uploading
        - processing
        - error
        - done
      - attr: data-size
        condition: always - the resolved size
        values:
        - default
        - sm
        - xs
      - attr: data-orientation
        condition: always - the resolved orientation
        values:
        - horizontal
        - vertical
    - name: attachment-media
      description: The media slot's box - the icon tile or the caller's <img>
      states:
      - attr: data-variant
        condition: always - the media variant
        values:
        - icon
        - image
    - name: attachment-content
      description: Text column wrapping title/description - renders when either slot
        is set
    - name: attachment-title
      description: The file name line (title slot; user content, never html_safe)
    - name: attachment-description
      description: Muted metadata / failure copy under the title
    - name: attachment-actions
      description: Row of with_action poetry Buttons
    - name: attachment-trigger
      description: 'The whole-chip control (with_trigger: a button or tag: :a anchor)
        - wraps the picker/download affordance'
    - name: attachment-status
      description: sr-only role=status announcement for the in-flight and error states
        (uploading/processing/error)
  poetry/ui/autocomplete:
    class_name: Poetry::Ui::Autocomplete::Component
    identifier: poetry--ui--autocomplete
    bem_block: poetry-ui-autocomplete
    styles: []
    options:
    - name: empty_text
      type: string
      default: No results.
      description: The no-matches message; hidden while anything matches.
    - name: id
      type: string
      description: Stable DOM id token for the root and list ids.
    - name: label
      type: string
      description: The accessible name (or wire aria-labelledby via html attrs).
    - name: name
      type: string
      required: true
      description: The form param key; the input's text submits under it as-is.
    - name: open
      type: boolean
      default: false
      description: Server-renders the suggestion popup open.
    - name: open_on_focus
      type: boolean
      default: true
      description: Opens the suggestions on focus; false waits for typing.
    - name: placeholder
      type: string
      description: Placeholder text shown while the input is empty.
    - name: value
      type: string
      description: The initial input text.
    slots: []
    description: An input that suggests options as you type - the text itself is the
      value.
    slot_extras:
    - item
    elements:
    - content
    capsule: 321d3966b80a
    controllers:
    - identifier: poetry--core--autocomplete
      targets:
      - content
      - empty
      - input
      - list
      values:
      - open
      - openOnFocus
      actions:
      - blurred
      - focus
      - input
      - itemEnter
      - itemPress
      - keydown
      events:
      - poetry:autocomplete:closed
      - poetry:autocomplete:commit
      - poetry:autocomplete:open
    - identifier: poetry--core--popper
      targets:
      - anchor
      - arrow
      - content
      values:
      - align
      - alignOffset
      - anchor
      - anchorPoint
      - avoidCollisions
      - side
      - sideOffset
      - strategy
      actions:
      - anchorPointValueChanged
      - reposition
      - setAnchor
      - setAnchorElement
      - strategyValueChanged
      events: []
    agent_rules:
    - 'The input IS the value: name: is the param key and free text submits as-is
      - suggestions are conveniences, not constraints (constrained pick = Combobox).'
    - 'Items via with_item(label:) - label is what filtering matches and what commit
      writes; value: overrides the committed text when it differs from the label.'
    - 'empty_text: renders the no-matches state (hidden while anything matches).'
    - 'open_on_focus: false waits for typing before suggesting.'
    - 'Server-side filtering stays yours: render fewer items on re-render - the client
      filter only narrows what the server sent.'
    parts:
    - name: autocomplete
      description: Root wrapper carrying the controller + popper pair
    - name: autocomplete-input
      description: The REAL text input - role=combobox with aria-expanded tracking
        the popup, the form value itself
    - name: autocomplete-content
      description: The popper-positioned popup shell
      states:
      - attr: data-open
        condition: popup visible
      - attr: data-closed
        condition: popup hidden (the server-rendered default)
      - attr: data-empty
        condition: no item matches the query - the empty state shows
    - name: autocomplete-list
      description: role=listbox holding the options
    - name: autocomplete-item
      description: One suggestion - role=option; commit writes its label (or value:)
        into the input
      states:
      - attr: data-label
        condition: always - what filtering matches and commit writes
      - attr: data-value
        condition: 'value: given - overrides the committed text'
      - attr: data-highlighted
        condition: the keyboard/pointer highlight
      - attr: data-disabled
        condition: 'disabled: - skipped by filtering and commit'
    - name: autocomplete-empty
      description: The no-matches message (hidden while anything matches)
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--autocomplete
        registers: true
        values:
        - name: open_on_focus
          conditional: if
      - identifier: poetry--core--popper
        registers: true
    - element: input
      controllers:
      - identifier: poetry--core--autocomplete
        targets:
        - name: input
        actions:
        - method: input
          'on': input
        - method: focus
          'on': focus
        - method: blurred
          'on': focusout
        - method: keydown
          'on': keydown
      - identifier: poetry--core--popper
        targets:
        - name: anchor
    - element: content
      controllers:
      - identifier: poetry--core--autocomplete
        targets:
        - name: content
      - identifier: poetry--core--popper
        targets:
        - name: content
    - element: list
      controllers:
      - identifier: poetry--core--autocomplete
        targets:
        - name: list
    - element: empty
      controllers:
      - identifier: poetry--core--autocomplete
        targets:
        - name: empty
    - element: item
      controllers:
      - identifier: poetry--core--autocomplete
        actions:
        - method: itemPress
          'on': pointerdown
        - method: itemEnter
          'on': pointerenter
  poetry/ui/avatar:
    class_name: Poetry::Ui::Avatar::Component
    identifier: poetry--ui--avatar
    bem_block: poetry-ui-avatar
    styles: []
    options:
    - name: label
      type: string
      required: true
      description: The person's name - the avatar's accessible name (blank raises).
        The required flag also carries the fact to the registry so static checks see
        it.
    - name: size
      type: symbol
      variants:
      - default
      - sm
      - lg
      default: default
      description: The diameter axis.
    - name: src
      type: string
      description: The image URL; without it only the initials fallback shows.
    slots:
    - name: badge
      many: false
      description: Decorative presence dot, bottom-right; keep the status meaning
        in label:.
    description: A user's image with an initials fallback.
    elements:
    - image
    - fallback
    - badge
    - group
    - group_count
    capsule: 51971e7f585d
    agent_rules:
    - 'label: (the person''s name) is REQUIRED - it is the avatar''s accessible name
      (role=img).'
    - The content block is the fallback (initials) and is also required - it is what
      shows while the image loads or when it fails.
    - The badge slot is decorative (a presence dot); put the status meaning in label:,
      not in the badge.
    - Stack avatars with poetry_avatar_group; the overflow count is poetry_avatar_group_count.
    requires_content: the initials fallback
    identity: false
    parts:
    - name: avatar
      description: Root span (role=img carrying the accessible name) - fallback, image,
        and badge layer inside it
      states:
      - attr: data-size
        condition: always - the resolved size
        values:
        - default
        - sm
        - lg
    - name: avatar-fallback
      description: The initials layer (the content block) - always in the DOM, showing
        until the image covers it
    - name: avatar-image
      description: 'The <img> layered absolutely over the fallback - only when src:
        is given; a failed load paints nothing'
    - name: avatar-badge
      description: The decorative presence dot (the badge slot), bottom-right
  poetry/ui/badge:
    class_name: Poetry::Ui::Badge::Component
    identifier: poetry--ui--badge
    bem_block: poetry-ui-badge
    styles:
    - name: variant
      type: symbol
      variants:
      - default
      - secondary
      - destructive
      - outline
      - ghost
      - link
      - success
      - warning
      - info
      default: default
      required: true
      description: The intent axis; success/warning/info are the soft record-status
        treatments.
    options:
    - name: href
      type: string
      description: Renders the pill as a real <a> - a navigational chip; the theme's
        link hover treatments activate on exactly this element.
    slots: []
    description: A small count or status descriptor.
    elements: []
    capsule: 393fe8c869c4
    agent_rules:
    - Badges are non-interactive status labels - never attach click handlers; use
      Button for actions. The one interactive form is href:, which renders the badge
      AS a real link (a navigational chip - the themes' [a&]:hover treatments activate).
    - 'The visible text is the content block: render ... { "beta" } - there is no
      label: option.'
    - Pick the variant by intent (destructive = error states; success/warning/info
      = record status, e.g. Fulfilled/Processing/Syncing), never by color preference.
    - 'Status badges on one surface read as a SET: keep one treatment family per table/list
      - the soft trio (+ outline for neutral) together, or the solid pair together;
      never a solid destructive pill inside a soft status column (design lint flags
      the mix).'
    requires_content: the visible status text
    identity: false
    parts:
    - name: badge
      description: 'The status pill itself (a <span>; a real <a> when href: is given)
        - the whole component is this one element'
      states:
      - attr: data-variant
        condition: always - the resolved variant
        values:
        - default
        - secondary
        - destructive
        - outline
        - ghost
        - link
        - success
        - warning
        - info
  poetry/ui/breadcrumb:
    class_name: Poetry::Ui::Breadcrumb::Component
    identifier: poetry--ui--breadcrumb
    bem_block: poetry-ui-breadcrumb
    styles: []
    options: []
    slots:
    - name: items
      many: true
      description: 'The crumbs, in declaration order. A label with href: renders a
        link; without one, the current page. A block makes the <li>''s content caller-owned
        (a dropdown crumb, a custom-rendered link).'
      setter_args:
        item: 1
      yieldless:
      - item
    - name: separator
      many: false
      description: 'Replaces the separator glyph in EVERY gap: an icon name, or a
        block for arbitrary content. Absent, the default chevron renders (with its
        RTL flip - a custom glyph is used as given).'
      setter_args:
        separator: 0
      setter_kwargs:
        separator:
        - icon
      yieldless:
      - separator
    description: Shows the path to the current page as a trail of links.
    slot_extras:
    - ellipsis
    elements:
    - list
    - item
    - link
    - page
    - separator
    - ellipsis
    capsule: 898795a6a491
    agent_rules:
    - Declare the trail with with_item(label, href:) - never hand-build the nav/ol/li
      chain.
    - 'The current page is the item WITHOUT href: (it renders aria-current=page, not
      a link).'
    - Collapse a long middle with with_ellipsis - it announces 'More' to screen readers.
    - A BLOCK item (with_item { ... }) renders your content inside the <li> - the
      seat for a dropdown crumb or a custom-rendered link; you own its semantics (aria-current
      only applies to label items).
    - 'with_separator(icon: :dot) - or a block - replaces the chevron in EVERY gap;
      the default chevron RTL-flips, a custom glyph is used as given.'
    required_slots:
      item: at least one item
    identity: false
    parts:
    - name: breadcrumb
      description: The <nav> landmark (aria-label=breadcrumb) around the trail
    - name: breadcrumb-list
      description: The <ol> laying crumbs and separators out as one wrapping row
    - name: breadcrumb-item
      description: One <li> of the trail - wraps a link, the current page, the ellipsis,
        or a block item's own content (a dropdown crumb, a custom link)
    - name: breadcrumb-link
      description: 'A crumb with href: - a real <a> to an ancestor page'
    - name: breadcrumb-page
      description: The current page (the item without href:) - aria-current=page,
        not a link
    - name: breadcrumb-separator
      description: The chevron <li> between crumbs - presentational, aria-hidden
    - name: breadcrumb-ellipsis
      description: The collapsed-middle glyph (with_ellipsis) - aria-hidden; a sibling
        sr-only 'More' announces it
  poetry/ui/bubble:
