  poetry/ui/collapsible:
    class_name: Poetry::Ui::Collapsible::Component
    identifier: poetry--ui--collapsible
    bem_block: poetry-ui-collapsible
    styles: []
    options:
    - name: open
      type: boolean
      default: false
      description: The server-rendered initial state; the trigger toggles it client-side.
    slots:
    - name: trigger
      many: false
      description: The disclosure control - a real button, wired for you (aria-expanded,
        aria-controls); options merge onto it.
      setter_args:
        trigger: 0
      yieldless:
      - trigger
    description: An interactive element that expands and collapses a section of content.
    controllers:
    - identifier: poetry--core--state
      targets:
      - content
      - trigger
      values:
      - state
      actions:
      - close
      - open
      - toggle
      events: []
    agent_rules:
    - 'with_trigger(compose: true) { |wiring| ... } composes YOUR control as the trigger:
      the block is yielded the trigger wiring (the Stimulus behavior the overlay needs;
      poppers add id/aria and their trigger slot, modals hand only the open action)
      - splat it onto a wiring-free control (poetry_sidebar_menu_button, a plain tag);
      without compose: the classic composed Button renders.'
    - The trigger is with_trigger { "label" } - a real button, wired for you (aria-expanded/controls).
    - 'Server-render the initial state via open: - never toggle data-open/data-closed
      by hand.'
    - Content stays in the DOM when closed (hidden) - do not conditionally render
      it.
    - 'For URL-controlled disclosure without JS, render open: from params - the same
      markup serves both.'
    requires_content: the disclosed panel body
    required_slots:
      trigger: the disclosure control
    parts:
    - name: collapsible
      description: The disclosure root - the state controller flips the pair here
      states:
      - attr: data-open
        condition: expanded (server-rendered from open:; the controller flips the
          pair at runtime)
      - attr: data-closed
        condition: collapsed (the server-rendered default)
    - name: collapsible-trigger
      description: The disclosure button - mirrors aria-expanded
      states:
      - attr: data-panel-open
        condition: its content is open (controller-written; absent while closed)
    - name: collapsible-content
      description: The disclosure panel - stays in the DOM when closed (hidden) and
        rides the presence helper on exit
      states:
      - attr: data-open
        condition: content is open or entering
      - attr: data-closed
        condition: content is closed or animating out (hidden lands after the exit
          finishes)
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--state
        registers: true
    - element: trigger
      controllers:
      - identifier: poetry--core--state
        targets:
        - name: trigger
        actions:
        - method: toggle
          'on': click
    - element: content
      controllers:
      - identifier: poetry--core--state
        targets:
        - name: content
  poetry/ui/combobox:
    class_name: Poetry::Ui::Combobox::Component
    identifier: poetry--ui--combobox
    bem_block: poetry-ui-combobox
    styles: []
    options:
    - name: align
