  poetry/ui/hover_card:
    class_name: Poetry::Ui::HoverCard::Component
    identifier: poetry--ui--hover_card
    bem_block: poetry-ui-hover_card
    styles: []
    options:
    - name: align
      type: symbol
      variants:
      - start
      - center
      - end
      default: center
      description: Panel alignment along the chosen side.
    - name: align_offset
      type: integer
      default: 0
      description: Shift in pixels along the alignment axis.
    - name: avoid_collisions
      type: boolean
      default: true
      description: Flips and shifts the panel to stay inside the viewport.
    - name: close_delay
      type: integer
      default: 300
      description: Close-grace window in ms over the trigger+content pair.
    - name: content_class
      type: string
      description: 'The panel''s class merge seam - e.g. content_class: "w-80" widens
        the card.'
    - name: defer
      type: string
      description: Defer the card body to a lazy turbo-frame. The panel is hidden
        until hover, so the fetch fires on first open for free; the component block
        (if any) becomes the frame's placeholder.
    - name: open
      type: boolean
      default: false
      description: Renders the card already open on page load.
    - name: open_delay
      type: integer
      default: 600
      description: Hover-intent delay in ms before the card opens.
    - name: side
      type: symbol
      variants:
      - top
      - right
      - bottom
      - left
      default: bottom
      description: Which side of the anchor the panel opens on.
    - name: side_offset
      type: integer
      default: 4
      description: Gap in pixels between the anchor and the panel.
    slots:
    - name: trigger
      many: false
      description: 'The enriched LINK: a real navigable <a> - THE no-JS fallback.
        tag: passthrough exists but change it knowingly (an <a> is the contract''s
        fallback story). NO aria-haspopup/expanded/describedby - the card is invisible
        to the accessibility tree on purpose. Built as a lazy anatomy part (rendered
        at render time, not at with_trigger time). variant:/size: route through Button::Component
        - Button''s href-implies-anchor keeps the trigger a REAL <a> wearing button
        styling, so the reachable-elsewhere contract holds.'
      setter_args:
        trigger: 0
      yieldless:
      - trigger
    description: A card that reveals preview content when its trigger is hovered.
    elements:
    - content
    capsule: 4e75d7b14fde
    controllers:
    - identifier: poetry--core--hover-card
      targets: []
      values:
      - closeDelay
      - open
      - openDelay
      actions:
      - blurClose
      - focusOpen
      - openValueChanged
      - pointerDown
      - pointerEnter
      - pointerLeave
      events:
      - poetry:hover-card:closed
      - poetry:hover-card:open
    - identifier: poetry--core--popper
      targets:
      - anchor
      - arrow
      - content
      values:
      - align
      - alignOffset
      - anchor
      - anchorPoint
      - avoidCollisions
      - side
      - sideOffset
      - strategy
      actions:
      - anchorPointValueChanged
      - reposition
      - setAnchor
      - setAnchorElement
      - strategyValueChanged
      events: []
    agent_rules:
    - 'with_trigger(compose: true) { |wiring| ... } composes YOUR control as the trigger:
      the block is yielded the trigger wiring (the Stimulus behavior the overlay needs;
      poppers add id/aria and their trigger slot, modals hand only the open action)
      - splat it onto a wiring-free control (poetry_sidebar_menu_button, a plain tag);
      without compose: the classic composed Button renders.'
    - Use poetry_hover_card - never hand-roll hover-div previews.
    - 'THE REACHABLE-ELSEWHERE RULE (non-negotiable): every piece of information in
      a hover card MUST exist at the trigger link''s destination (or another keyboard/touch-reachable
      surface). The card is pointer-only enrichment - keyboard and touch users never
      see inside it.'
    - 'The trigger must be a REAL link with a real href - it is the fallback, the
      touch path, and the keyboard path all at once. For a button LOOK, pass variant:/size:
      (renders through Button, still an <a> via href:) - never swap the tag to :button.'
    - NO interactive elements inside the card - they get tabindex=-1 stripped and
      become pointer-only traps. Actions belong in a Popover or at the destination.
    - Don't add aria-expanded/haspopup to the trigger - advertising an unreachable
      surface is worse than silence.
    - Never use HoverCard for hints (Tooltip) or for content users act on (Popover).
    - 'Prefer defer: for expensive previews - a lazy turbo-frame that fetches on first
      open.'
    required_slots:
      trigger: the enriched link
    parts:
    - name: hover-card
      description: Root wrapper around the trigger link and the panel
    - name: hover-card-trigger
      description: The enriched link itself - simultaneously the no-JS fallback, the
        touch path, and the keyboard path
      states:
      - attr: data-popup-open
        condition: bare while the card is open; absent while closed (absence IS the
          closed state)
    - name: hover-card-content
      description: The role-less preview panel (invisible to AT on purpose) - positioning,
        animation, and the open state ride here
      states:
      - attr: data-open
        condition: card is open (the controller flips the pair at runtime)
      - attr: data-closed
        condition: card is closed (the server-rendered state; hidden rides along)
      - attr: data-side
        condition: always - the side (initial placement, re-resolved live by popper
          after flip)
        values:
        - top
        - right
        - bottom
        - left
      - attr: data-align
        condition: always - the alignment (re-resolved live by popper)
        values:
        - start
        - center
        - end
      vars:
      - name: "--transform-origin"
        description: the anchor-facing origin popper writes for scale-in animation
      - name: "--available-width"
        description: viewport space left for the panel (popper, post-flip)
      - name: "--available-height"
        description: viewport space left for the panel (popper, post-flip)
      - name: "--anchor-width"
        description: the anchor's measured width (popper)
      - name: "--anchor-height"
        description: the anchor's measured height (popper)
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--hover-card
        registers: true
        values:
        - name: open
        - name: open_delay
        - name: close_delay
      - identifier: poetry--core--popper
        registers: true
        values:
        - name: side
        - name: align
        - name: side_offset
        - name: align_offset
        - name: avoid_collisions
    - element: trigger
      controllers:
