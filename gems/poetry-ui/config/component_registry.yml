    - 'variant: :input renders a text field with a calendar button - typed parseable
      dates re-select the calendar; single mode only.'
    - For an always-visible grid use Calendar directly - DatePicker is the field+popover
      form.
    parts:
    - name: date-picker
      description: Root wrapper - the glue controller (formats the trigger label,
        closes on pick) around the composed Popover + Calendar
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--date-picker
        registers: true
        values:
        - name: placeholder
        - name: mode
          conditional: if range?
        actions:
        - method: picked
          'on': poetry:calendar:change
    - element: label
      controllers:
      - identifier: poetry--core--date-picker
        targets:
        - name: label
    - element: input
      controllers:
      - identifier: poetry--core--date-picker
        targets:
        - name: input
        actions:
        - method: inputChanged
          'on': input
        - method: inputKeydown
          'on': keydown
