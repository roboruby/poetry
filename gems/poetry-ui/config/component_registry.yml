      states:
      - attr: data-open
        condition: sheet is open (presence flips the pair at runtime)
      - attr: data-closed
        condition: sheet is closed (the server-rendered state)
      - attr: data-mobile
        condition: always "true" - the mobile-mode marker
      - attr: data-side
        condition: which edge the sheet slides from
        values:
        - left
        - right
      - attr: data-sidebar
        condition: always "sidebar" - the suite-wide sub-part marker
      vars:
      - name: "--sidebar-width"
        description: overridden inline to the mobile sheet width (18rem)
    - name: sidebar-mobile-inner
      description: The adoption container the nav children move into while the sheet
        is open
    - name: sidebar-inset
      description: The <main> page area beside the column
    - name: sidebar-header
      description: Top block of the column (with_nav content)
    - name: sidebar-footer
      description: Bottom block of the column
    - name: sidebar-content
      description: The scrollable middle of the column
    - name: sidebar-group
      description: One titled section inside the content
    - name: sidebar-group-label
      description: The section heading - fades and collapses away in icon mode
    - name: sidebar-menu
      description: The <ul> of menu items inside a group
    - name: sidebar-menu-item
      description: One <li> menu row (the group/menu-item hover scope)
    - name: sidebar-menu-button
      description: The row's link (href:) or button - the navigation entry itself
      states:
      - attr: data-active
