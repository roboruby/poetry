    - name: disabled
      type: boolean
      default: false
      description: Disables the trigger, the filter input, and the native select.
    - name: filter
      type: boolean
      default: true
      description: 'Forwarded to the embedded engine: false = server-driven options
        (the async Turbo-frame recipe).'
    - name: id
      type: string
      description: The trigger's DOM id - the Field label target; every other part
        id derives from it.
    - name: loop
      type: boolean
      default: false
      description: Wraps arrow-key highlight movement past either end of the list.
    - name: modal
      type: boolean
      default: false
