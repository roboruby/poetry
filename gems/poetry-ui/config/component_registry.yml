  poetry/ui/sheet:
    class_name: Poetry::Ui::Sheet::Component
    identifier: poetry--ui--sheet
    bem_block: poetry-ui-sheet
    styles:
    - name: side
      type: symbol
      variants:
      - top
      - right
      - bottom
      - left
      default: right
      required: true
      description: The edge the sheet slides in from - a physical direction (right
        stays right in RTL).
    options:
    - name: content_class
      type: string
      description: Extra classes merged onto the <dialog> panel (e.g. "max-h-[50vh]"
        caps a top/bottom sheet).
    - name: dismissible
      type: boolean
      default: true
      description: Backdrop clicks close the dialog; false keeps confirmations from
        being dismissed accidentally (Esc still closes).
    - name: show_close_button
      type: boolean
      default: true
      description: Renders the corner X; false forces a deliberate footer choice (footer
        actions and Esc remain). Sheet inherits this.
    slots:
    - name: trigger
      many: false
      description: 'The trigger is a poetry Button wired to open the dialog - agents
        pass Button props: with_trigger(variant: :outline) { "Open" }.'
      component: poetry/ui/button
      setter_args:
        trigger: 0
      yieldless:
      - trigger
    - name: title
      many: false
      description: The heading - the dialog's accessible name; required.
    - name: description
      many: false
      description: Muted copy under the title, wired to aria-describedby.
    - name: footer
      many: false
      description: The action row at the bottom of the panel.
    description: A dialog that slides in from a screen edge.
    elements:
    - content
    - header
    - title
    - description
    - footer
    - close
    capsule: 98c870d30916
    controllers:
    - identifier: poetry--core--sheet
      targets:
      - dialog
      values:
      - dismissible
      - hotkey
      actions:
      - backdropClose
      - close
      - lockScroll
      - open
      - toggle
      - unlockScroll
      events: []
    agent_rules:
    - Open sheets with with_trigger(...) - never a hand-wired button.
    - with_title is REQUIRED (the accessible name) - the inherited Dialog rule.
    - 'Pick side by content: navigation left, detail/edit right, pickers bottom.'
    - Do not put must-not-lose confirmations in a Sheet - that is AlertDialog.
    - Do not rebuild a centered Dialog with a Sheet; use Dialog.
    required_slots:
      title: the accessible name
    parts:
    - name: sheet
      description: Root wrapper around the trigger and the <dialog> element
    - name: sheet-content
      description: The <dialog> panel, anchored to a screen edge - the slide animation
        and the open state ride here
      states:
      - attr: data-open
        condition: panel is open (the controller flips the pair at runtime)
      - attr: data-closed
        condition: panel is closed or animating out (the server-rendered state; the
          presence-hold close rides the closed slide-out)
      - attr: data-side
        condition: always - the edge the sheet slides in from
        values:
        - top
        - right
        - bottom
        - left
    - name: sheet-header
      description: Title block at the top of the panel
    - name: sheet-title
      description: The heading - the sheet's accessible name (required slot)
    - name: sheet-description
      description: Muted copy under the title, wired to aria-describedby
    - name: sheet-footer
      description: Action row pinned to the bottom of the panel
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--sheet
        registers: true
        values:
        - name: dismissible
    - element: content
      controllers:
      - identifier: poetry--core--sheet
        targets:
        - name: dialog
        actions:
        - method: close
          'on': cancel
        - method: backdropClose
          'on': click
    - element: trigger
      controllers:
      - identifier: poetry--core--sheet
        actions:
        - method: open
    - element: close
      controllers:
      - identifier: poetry--core--sheet
        actions:
        - method: close
    tools:
    - name: open
      title: Open
      description: Open the sheet.
      annotations:
        readOnlyHint: false
        untrustedContentHint: false
      executes: poetry--core--sheet#open
    - name: close
      title: Close
      description: Close the sheet.
      annotations:
        readOnlyHint: false
        untrustedContentHint: false
      executes: poetry--core--sheet#close
  poetry/ui/sidebar:
    class_name: Poetry::Ui::Sidebar::Component
    identifier: poetry--ui--sidebar
    bem_block: poetry-ui-sidebar
    styles: []
    options:
    - name: collapsible
      type: symbol
      variants:
      - offcanvas
      - icon
      - none
      default: offcanvas
      description: 'What collapsing does: slide fully away, shrink to an icon rail,
        or :none for a static column.'
    - name: open
