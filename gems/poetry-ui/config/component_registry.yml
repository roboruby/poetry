    - 'Destructive items use variant: :destructive AND still confirm irreversible
      actions via a dialog.'
    - 'shortcut: is a visual hint only - it does NOT bind the key.'
    - Do not nest a ContextMenu trigger surface inside another ContextMenu trigger
      surface.
    required_slots:
      trigger: the right-click surface
      item: at least one item
    parts:
    - name: context-menu
      description: Root wrapper hosting the context-menu + menu + popper controllers
        around the surface and content
    - name: context-menu-trigger
      description: 'The right-click/long-press SURFACE wrapping the logical object
        - not a widget: no role, no aria-haspopup'
      states:
      - attr: data-popup-open
        condition: the menu is open (absence is the closed state - no aria-expanded
          on a role-less surface)
      - attr: data-disabled
        condition: 'the surface is inert (disabled: true)'
    - name: context-menu-content
      description: The role=menu popup panel - anchored at the pointer via popper's
        virtual-anchor mode; open state and animation ride here
      states:
      - attr: data-open
        condition: menu is open (presence flips the pair at runtime)
      - attr: data-closed
        condition: menu is closed or animating out (the server-rendered state)
      - attr: data-side
        condition: 'the placement side (the side: option, default right; popper re-writes
          it after collision flips)'
        values:
        - top
        - right
        - bottom
        - left
      - attr: data-align
        condition: the alignment (forced start initially; popper re-resolves it)
        values:
        - start
        - center
        - end
      vars:
      - name: "--transform-origin"
        description: popper's anchor-facing animation origin
      - name: "--available-width"
        description: 'popper: viewport space left for the panel (post-flip)'
      - name: "--available-height"
        description: 'popper: viewport space left for the panel (post-flip)'
      - name: "--anchor-width"
        description: 'popper: the anchor rect''s measured width'
      - name: "--anchor-height"
        description: 'popper: the anchor rect''s measured height'
    - name: context-menu-group
      description: role=group semantic grouping between separators
    - name: context-menu-label
      description: Non-interactive heading for a run of items
      states:
      - attr: data-inset
        condition: 'indented to align with checkbox/radio item text (inset: true)'
    - name: context-menu-item
      description: One role=menuitem action row
      states:
      - attr: data-variant
        condition: default or destructive (the danger treatment)
      - attr: data-inset
        condition: 'indented to align with checkbox/radio item text (inset: true)'
      - attr: data-disabled
        condition: item is disabled (always written together with aria-disabled)
    - name: context-menu-checkbox-item
      description: A role=menuitemcheckbox toggle row
      states:
      - attr: data-checked
        condition: checked (the controller re-writes the pair with aria-checked on
          activation)
      - attr: data-unchecked
        condition: unchecked
      - attr: data-disabled
        condition: item is disabled (always written together with aria-disabled)
      - attr: data-close-on-select
        condition: per-item override of the menu's close-on-select default ("false"
          keeps the menu open)
    - name: context-menu-radio-group
      description: role=group scoping one single-select value
      states:
      - attr: data-value
        condition: the selected radio value (the controller re-writes it on change)
    - name: context-menu-radio-item
      description: A role=menuitemradio row inside a radio group
      states:
      - attr: data-checked
        condition: the selected radio (the controller re-writes the pair with aria-checked)
      - attr: data-unchecked
        condition: not selected
      - attr: data-value
        condition: the radio's value
      - attr: data-disabled
        condition: item is disabled (always written together with aria-disabled)
    - name: context-menu-checkbox-item-indicator
      description: The check glyph inside checkbox items (aria-hidden; the item carries
        the checked state)
    - name: context-menu-radio-item-indicator
      description: The circle glyph inside radio items (aria-hidden; the item carries
        the checked state)
    - name: context-menu-separator
      description: role=separator rule between groups
    - name: context-menu-shortcut
      description: The trailing keybinding HINT - aria-hidden, never binds the key
    - name: context-menu-sub
      description: A submenu scope - hosts its own popper around the sub trigger/content
        pair
    - name: context-menu-sub-trigger
      description: The role=menuitem row opening its submenu
      states:
      - attr: data-popup-open
        condition: its submenu is open (written with aria-expanded; absence is the
          closed state)
      - attr: data-inset
        condition: 'indented to align with checkbox/radio item text (inset: true)'
    - name: context-menu-sub-content
      description: The nested role=menu panel - its own popper content on the same
        presence machinery
      states:
      - attr: data-open
        condition: submenu is open (presence flips the pair at runtime)
      - attr: data-closed
        condition: submenu is closed (the server-rendered state)
      - attr: data-side
        condition: the placement side (right/left by direction; popper resolves it
          at runtime)
        values:
        - top
        - right
        - bottom
        - left
      - attr: data-align
        condition: the alignment against the sub-trigger (popper resolves it at runtime)
        values:
        - start
        - center
        - end
      vars:
      - name: "--transform-origin"
        description: popper's anchor-facing animation origin
      - name: "--available-width"
        description: 'popper: viewport space left for the panel (post-flip)'
      - name: "--available-height"
        description: 'popper: viewport space left for the panel (post-flip)'
      - name: "--anchor-width"
        description: 'popper: the sub-trigger''s measured width'
      - name: "--anchor-height"
        description: 'popper: the sub-trigger''s measured height'
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--context-menu
        registers: true
        values:
        - name: long_press_delay
        - name: disabled
      - identifier: poetry--core--menu
        registers: true
        values:
        - name: open
        - name: modal
        - name: loop
      - identifier: poetry--core--popper
        registers: true
        values:
        - name: side
        - name: align
        - name: side_offset
        - name: avoid_collisions
    - element: trigger
      controllers:
      - identifier: poetry--core--context-menu
        actions:
        - method: open
          'on': contextmenu
        - method: pressStart
          'on': pointerdown
        - method: pressCancel
          'on':
          - pointermove
          - pointerup
          - pointercancel
      - identifier: poetry--core--popper
        targets:
        - name: anchor
    - element: content
      controllers:
      - identifier: poetry--core--popper
        targets:
        - name: content
    - element: item
      controllers:
      - identifier: poetry--core--menu
        actions:
        - method: activate
          'on': click
    - element: sub_trigger
      controllers:
      - identifier: poetry--core--menu
        actions:
        - method: subEnter
          'on': pointerenter
        - method: subLeave
          'on': pointerleave
        - method: openSub
          'on': click
      - identifier: poetry--core--popper
        targets:
        - name: anchor
  poetry/ui/data_table:
    class_name: Poetry::Ui::DataTable::Component
    identifier: poetry--ui--data_table
    bem_block: poetry-ui-data_table
    styles: []
    options:
    - name: caption
      type: string
      description: The table's accessible purpose, rendered as its <caption>.
    - name: container_class
      type: string
      description: Caps the scroll container's height (e.g. "max-h-96") - without
        a cap the sticky header has nothing to stick inside.
    - name: empty_text
      type: string
      default: No results.
      description: Shown in a full-width row when rows are empty.
    - name: filter
      type: boolean
      default: true
      description: Renders the filter form; false drops the toolbar row.
    - name: filter_label
      type: string
      default: Filter
      description: The filter input's accessible label.
    - name: filter_name
      type: string
      default: q
      description: The query-param key the filter submits under.
    - name: filter_placeholder
      type: string
      default: Filter…
      description: The filter input's placeholder text.
    - name: frame
      type: string
      description: Wrap in a <turbo-frame data-turbo-action="advance"> so hosts with
        Turbo scope the round trip to the table while the URL still advances. The
        host response must render the same frame id.
    - name: scroll_label
      type: string
      description: Accessible name for the sticky scroll region; falls back to caption:.
    - name: selectable
      type:
      description: 'Row selection: a lambda mapping each row to its id turns the feature
        ON - a leading checkbox column (select-all with a real indeterminate middle
        state, shift ranges, count announcements) whose checkboxes ARE the form value
        (selection_name[], plain checkboxes with no JS). Pair with the action-bar
        block for bulk actions.'
    - name: selection_name
      type: string
      default: selected_ids
      description: The checkbox field name; selected row ids post as selection_name[].
    - name: sticky_header
      type: boolean
      default: false
      description: 'Forwarded to the inner Table: sticky_header pins the thead while
        the table''s scroll container scrolls; container_class caps that container''s
        height ("max-h-96") - without a cap nothing sticks. The sticky scroll region
        needs an accessible name (the ScrollArea rule); scroll_label: falls back to
        caption:.'
    slots:
    - name: columns
      many: true
      description: 'Columns are DECLARED here and rendered per row by the template.
        A sortable column''s key must be in the state''s whitelist - catching drift
        between the view''s columns and the controller''s sortable: list at render,
        not as a silently unsortable header.'
      setter_args:
        column: 1
      required_content:
        column: the cell renderer - { |row| ... }
    description: A table with sorting, row selection, and sticky headers.
    elements:
    - toolbar
    - container
    - footer
    - empty
    - caption
    - sort_link
    - checkbox
    - select_cell
    capsule: 74f41e572b2b
    controllers:
    - identifier: poetry--core--table-selection
      targets:
      - all
      values:
      - label
      actions:
      - press
      - toggleAll
      - toggled
      events:
      - poetry:data-table:selection-change
    agent_rules:
    - 'Build State.from_params(params, sortable: [...]) in the controller - NEVER
      order by raw params; the whitelist is what makes state.order_clause injection-safe.'
    - Column cell blocks RETURN the cell content ({ |row| row.title }) - they must
      not write to the template buffer.
    - Sort/filter/page are URL state over GET links and a GET form. Row mutations
      (inline edit, row actions) belong to poetry-reactive components rendered inside
      cells - never to this component.
    - 'Give the table a caption: - it is the table''s accessible purpose.'
    required_slots:
      column: at least one column
    parts:
    - name: data-table
      description: Root surface - toolbar, table, and pagination footer stack here
    - name: data-table-toolbar
      description: 'The row above the table holding the filter form - renders unless
        filter: false'
    - name: data-table-filter
      description: The GET filter form (role=search) - hidden fields carry the current
        sort; a new filter resets the page
    - name: table-container
      description: The composed Table's scroll container - Table renders it, this
        surface owns where it sits
    - name: data-table-footer
      description: 'The Pagination row - renders when total: is more than one page'
    stimulus:
    - element: root
      conditional: if selectable?
      controllers:
      - identifier: poetry--core--table-selection
        registers: true
        values:
        - name: label
    - element: select_all
      controllers:
      - identifier: poetry--core--table-selection
        targets:
        - name: all
        actions:
        - method: toggleAll
          'on': change
    - element: row_checkbox
      controllers:
      - identifier: poetry--core--table-selection
        actions:
        - method: press
          'on':
          - pointerdown
          - keydown
        - method: toggled
          'on': change
  poetry/ui/date_field:
    class_name: Poetry::Ui::DateField::Component
    identifier: poetry--ui--date_field
    bem_block: poetry-ui-date_field
    styles: []
    options:
    - name: described_by
      type: string
      description: Ids for aria-describedby (hint or error text).
    - name: disabled
      type: boolean
      default: false
      description: Disables the field; the segment group dims and goes inert.
    - name: id
      type: string
      description: The native input's DOM id - the Field label target.
    - name: invalid
      type: boolean
      default: false
      description: Paints the destructive border/ring and sets aria-invalid.
    - name: label
      type: string
      description: Standalone accessible name; inside a form the Field label wires
        ids instead. Segments announce it themselves.
    - name: locale
      type: string
      description: Pins the field to a locale other than the page's.
    - name: max
      type:
      description: The latest allowed date (Date or ISO string) - rides native constraint
        validation.
    - name: min
      type:
      description: The earliest allowed date (Date or ISO string) - rides native constraint
        validation.
    - name: name
      type: string
      required: true
      description: The form field name - required; the value posts as ISO yyyy-mm-dd
        with or without JS.
    - name: placeholder_value
      type:
      description: What the first arrow press on an empty segment lands on; defaults
        to today.
    - name: readonly
      type: boolean
      default: false
      description: The value shows but cannot be edited.
    - name: required
      type: boolean
      default: false
      description: Marks the native input required.
    - name: value
      type:
      description: Date, or an ISO yyyy-mm-dd string; nil renders empty.
    slots: []
    description: A segmented input for typing a date one part at a time.
    elements:
    - group
    - input
    capsule: c812f47a82a9
    controllers:
    - identifier: poetry--core--date-field
      targets:
      - group
      - input
      values:
      - hourCycle
      - labels
      - locale
      - placeholder
      - placeholders
      - seconds
      actions:
      - focusGap
      - settle
      events:
      - poetry:date-field:change
    agent_rules:
    - Date entry is a DateField (poetry_date_field / form.date_field) - never a masked
      Input, three selects, or a bare input type=date when the design system is in
      play.
    - 'The native input is the form value: params[<name>] is ISO (yyyy-mm-dd) with
      or without JS; min:/max: take Date or ISO strings and ride native validation.'
    - 'Pair with a Label/Field for the accessible name (label for= the input id);
      standalone use takes label: - segments announce it themselves.'
    - 'Locale drives segment order and numerals automatically; pass locale: only to
      pin a field to a different locale than the page.'
    parts:
    - name: date-field
      description: Root - the controller and the enhanced/disabled surface ride here
      states:
      - attr: data-enhanced
        condition: the controller connected and built segments (no JS = the native
          input, visible and styled)
      - attr: data-disabled
        condition: 'disabled: is set'
      - attr: data-invalid
        condition: 'invalid: is set (the group wears the destructive ring)'
    - name: date-field-group
      description: The bordered segment row (cn-input chrome, focus-within ring) -
        hidden until enhancement, then the editing surface the controller fills with
        segments
      states:
      - attr: data-disabled
        condition: 'disabled: is set (chrome dims, pointer events off)'
      - attr: data-invalid
        condition: 'invalid: is set (destructive border + ring)'
    - name: date-field-input
      description: The native <input type=date> - THE form value in both modes; tabindex
        -1 + aria-hidden once segments exist
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--date-field
        registers: true
        values:
        - name: locale
          conditional: if
        - name: placeholder
        - name: labels
        - name: placeholders
    - element: group
      controllers:
      - identifier: poetry--core--date-field
        targets:
        - name: group
        actions:
        - method: focusGap
          'on': click
        - method: settle
          'on': focusout
    - element: input
      controllers:
      - identifier: poetry--core--date-field
        targets:
        - name: input
  poetry/ui/date_picker:
    class_name: Poetry::Ui::DatePicker::Component
    identifier: poetry--ui--date_picker
    bem_block: poetry-ui-date_picker
    styles: []
    options:
    - name: caption_layout
      type: symbol
      default: label
