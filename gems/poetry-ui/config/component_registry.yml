      description: 'nil (off), :letters (A, B, C...) or :numbers (1-9): server- rendered
        key labels + one-keystroke answering.'
    - name: skip_label
      type: string
      default: Skip
      description: The skip button's text (shown only while the active item is optional).
    - name: submit_label
      type: string
      default: Submit
      description: The final submit button's text (replaces Next on the last item).
    - name: url
      type: string
      required: true
      description: The form's submit URL - answers post here as ordinary params.
    slots:
    - name: progress
      many: false
      description: 'with_progress (bare) renders the auto "Question X of Y" text;
        with_progress { custom } replaces it (marked data-custom so the controller
        leaves it alone). class: merges onto the progress element (e.g. w-full for
        a full-width segment bar over the base w-fit).'
    description: A one-question-at-a-time survey flow with choices, free answers,
      and validation.
    slot_extras:
    - item
    elements:
    - progress
    - item
    - title
    - description
    - choices
    - choice
    - choice_input
    - choice_indicator
    - choice_indicator_dot
    - choice_indicator_check
    - choice_label
    - choice_description
    - choice_shortcut
    - input_wrapper
    - input
    - error
    - actions
    - previous
    - skip
    - next
    - submit
    capsule: 18805ab1cf50
    controllers:
    - identifier: poetry--core--questionnaire
      targets:
      - next
      - previous
      - progress
      - skip
      - submit
      values:
      - shortcuts
      actions:
      - change
      - input
      - keydown
      - next
      - previous
      - reset
      - skip
      - submit
      events:
      - poetry:questionnaire:item-change
      - poetry:questionnaire:status-change
    agent_rules:
    - The root is a REAL form (url:/method:) - answers submit as ordinary params;
      validate server-side and re-render invalid items with error:.
    - 'One with_item per question (name: is the param key); choices via item.with_choice,
      an optional free-text answer via item.with_input.'
    - 'multiple: true renders checkboxes named <name>[] (Rails array params) - a recorded
      divergence from the ported source''s repeated bare names.'
    - 'required: true gates Next/submit client-side; the server stays the truth on
      submit.'
    - 'shortcuts: :letters or :numbers labels each choice with a key (server-rendered)
      and enables one-keystroke answering.'
    - Skip renders only while the active item is optional - never force-hide it.
    - with_progress { custom } replaces the readout; data-current/data-total on the
      progress element and a [data-progress-count] child stay live for segment bars
      and counters.
    parts:
    - name: questionnaire
      description: The root <form> the controller drives - navigation, validation
        gating, and the keyboard map all ride here
    - name: questionnaire-progress
      description: The polite progressbar ('Question X of Y'; block content replaces
        the text). Always carries live data-current/data-total, and a [data-progress-count]
        child gets the live 'X of Y' text - custom segment bars ride data-[current=N]
        variants
      states:
      - attr: data-custom
        condition: block content supplied - the controller leaves the text alone
      - attr: data-current
        condition: always - the active question number (live)
      - attr: data-total
        condition: always - the enabled question count (live)
    - name: questionnaire-item
      description: One question <fieldset> - exactly one is active
      states:
      - attr: data-name
        condition: always - the item's param name
      - attr: data-active
        condition: the visible question (inactive items are hidden + inert)
      - attr: data-status
        condition: always - the answer state
        values:
        - unanswered
        - answered
        - skipped
      - attr: data-required
        condition: 'required: true - Skip hides and Next validates'
      - attr: data-multiple
        condition: 'multiple: true - checkbox choices named <name>[]'
      - attr: data-invalid
        condition: validation attempted and unanswered - the error shows
      - attr: data-validated
        condition: a navigation has demanded this answer at least once
      - attr: data-skipped
        condition: explicitly skipped (cleared by any interaction)
    - name: questionnaire-title
      description: The question heading - a real <legend>
    - name: questionnaire-description
      description: Muted copy under the title; its id rides the fieldset's aria-describedby
    - name: questionnaire-choices
      description: The answer grid for one item
    - name: questionnaire-choice
      description: One answer <label> wrapping its native input
      states:
      - attr: data-type
        condition: always - the input kind
        values:
        - radio
        - checkbox
      - attr: data-checked
        condition: the choice is selected
      - attr: data-unchecked
        condition: the choice is not selected
      - attr: data-shortcut
        condition: 'shortcuts: on - the key label (A, B... or 1-9)'
      - attr: data-disabled
        condition: choice or item disabled
    - name: questionnaire-choice-input
      description: THE native radio/checkbox - stretched invisibly over the row (paste
        of the input-otp posture)
      states:
      - attr: data-checked
        condition: selected
      - attr: data-unchecked
        condition: not selected
    - name: questionnaire-choice-indicator
      description: The box/circle glyph (aria-hidden) - dot for radio, check for checkbox
    - name: questionnaire-choice-indicator-dot
      description: The radio dot (shown while checked)
    - name: questionnaire-choice-indicator-check
      description: The checkbox check icon (shown while checked)
    - name: questionnaire-choice-label
      description: The label column - answer text over the optional description
    - name: questionnaire-choice-description
      description: Muted copy under the answer text
    - name: questionnaire-choice-shortcut
      description: The key hint chip (aria-hidden; hidden unless the choice carries
        data-shortcut)
    - name: questionnaire-input-wrapper
      description: The free-text answer's positioning wrapper
    - name: questionnaire-input
      description: The free-text answer - a real text input named after the item
      states:
      - attr: data-filled
        condition: has a value (counts as answered)
      - attr: data-empty
        condition: blank
    - name: questionnaire-error
      description: The validation message (hidden until a navigation demands the answer;
        role=alert while shown)
    - name: questionnaire-actions
      description: The navigation row - Previous / Skip / Next / Submit (the buttons
        ride composed Buttons, so those elements belong to Button's anatomy, not this
        contract; each carries data-visible/data-hidden + hidden/inert)
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--questionnaire
        registers: true
        values:
        - name: shortcuts
          conditional: if
        actions:
        - method: keydown
          'on': keydown
        - method: submit
          'on': submit
        - method: reset
          'on': reset
        - method: change
          'on': change
        - method: input
          'on': input
    - element: progress
      controllers:
      - identifier: poetry--core--questionnaire
        targets:
        - name: progress
    - element: previous
      controllers:
      - identifier: poetry--core--questionnaire
        targets:
        - name: previous
        actions:
        - method: previous
    - element: skip
      controllers:
      - identifier: poetry--core--questionnaire
        targets:
        - name: skip
        actions:
        - method: skip
    - element: next_button
      controllers:
      - identifier: poetry--core--questionnaire
        targets:
        - name: next
        actions:
        - method: next
    - element: submit_button
      controllers:
      - identifier: poetry--core--questionnaire
        targets:
        - name: submit
  poetry/ui/radio_group:
    class_name: Poetry::Ui::RadioGroup::Component
    identifier: poetry--ui--radio_group
    bem_block: poetry-ui-radio_group
    styles: []
    options:
    - name: disabled
      type: boolean
      default: false
      description: Disables every item (root-level).
    - name: invalid
      type: boolean
      default: false
      description: aria-invalid on the items (the destructive ring) - set by Field/FormBuilder
        from model errors.
    - name: label
      type: string
      description: 'The group accessible name -> aria-label (or wire aria-labelledby
        yourself) - REQUIRED: an unlabelled radiogroup fails the audit.'
    - name: loop
      type: boolean
      default: true
      description: Arrow-key navigation wraps at the ends.
    - name: name
      type: string
      required: true
      description: The shared form name for every hidden radio (FormBuilder derives
        object[method]).
    - name: orientation
      type: symbol
      variants:
      - both
      - vertical
      - horizontal
      default: both
      description: 'Keyboard axis: :both allows all four arrows (the standard radio
        pattern); :vertical/:horizontal restrict the axis. No visual effect.'
    - name: required
      type: boolean
      default: false
      description: aria-required on the ROOT only - never native required on the hidden
        inputs (constraint-validation focus would land on an aria-hidden input).
    - name: value
      type: string
      description: The checked item's value; nil = nothing checked (pre-selection).
    slots:
    - name: items
      many: true
      description: 'One item per option: a real button[role=radio] carrying its own
        hidden native radio; label: renders the dot beside a paired Label. variant:
        :card renders the choice-card row instead - title (+ optional description:)
        inside a selectable bordered label, the radio pinned to the right.'
      setter_args:
        item: 0
    description: A set of options where only one can be selected at a time.
    elements:
    - item
    - indicator
    - dot
    - input
    - row
    - card
    - card_content
    - card_title
    - card_description
    capsule: e7c32dc8920b
    controllers:
    - identifier: poetry--core--radio-group
      targets:
      - input
      values:
      - value
      actions:
      - check
      - entryCheck
      - setValue
      - valueValueChanged
      events:
      - poetry:radio-group:change
    - identifier: poetry--core--roving-focus
      targets: []
      values:
      - loop
      - manageTabindex
      - orientation
      actions:
      - keydown
      events:
      - poetry--core--roving-focus:entry
    agent_rules:
    - Use poetry_radio_group / form.radio_group - never hand-roll role=radio buttons.
    - 'Every item MUST have a unique value: (ArgumentError on duplicates).'
    - 'The GROUP must be labelled - label: (or aria-labelledby) - an unlabelled radiogroup
      is an APG violation (ArgumentError).'
    - 'Pair every item with a visible label (item label: renders the Label for= pairing)
      - a bare dot is not an option.'
    - 'variant: :card renders the choice-card row (title + description: inside a selectable
      bordered label) - the pick-a-plan pattern; the whole card toggles the radio.'
    - NEVER write the checked attributes (data-checked/data-unchecked) without aria-checked
      (the controller writes both; agents patching DOM must too).
    - Do not use RadioGroup for navigation or immediate actions; checking must not
      submit or navigate by itself.
    - '7+ options: use Select instead.'
    - 'Wire errors through Field/FormBuilder (invalid: + describedby on the root)
      - never a bare red ring.'
    required_slots:
      item: at least one radio item
    parts:
    - name: radio-group
      description: The role=radiogroup root - one Tab stop; items (and their label-pairing
        rows) render as direct children
      states:
      - attr: data-disabled
        condition: 'disabled: is set on the root - every item disables with it'
    - name: radio-group-item
      description: A button[role=radio] per item - carries its own hidden native radio
        as a sibling
      states:
      - attr: data-checked
        condition: the checked item (the controller writes the pair and aria-checked
          together on every item)
      - attr: data-unchecked
        condition: every other item
      - attr: data-disabled
        condition: the item (or the whole group) is disabled - also the roving-focus
          collection filter
      - attr: data-value
        condition: always - the item's value (keys the checked-value machine)
    - name: radio-group-indicator
      description: The theme-sized centering box holding the checked dot (the dot
        itself is the themed .cn-radio-group-indicator-icon span) - hidden (the native
        attribute, toggled by the controller) while unchecked
    - name: radio-group-card
      description: 'The choice-card row (variant: :card) - a <label> for= the radio
        button, so the whole card toggles; the checked treatments key on data-checked
        inside it'
    - name: radio-group-card-content
      description: 'Text column of a choice-card item (variant: :card) - title and
        description stack inside the card label'
    - name: radio-group-card-title
      description: The choice card's title line (the item label:)
    - name: radio-group-card-description
      description: Muted copy under the choice card's title (description:)
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--radio-group
        registers: true
        values:
        - name: value
          conditional: if value?
        actions:
        - method: entryCheck
          'on': poetry--core--roving-focus:entry
      - identifier: poetry--core--roving-focus
        registers: true
        values:
        - name: orientation
        - name: loop
        actions:
        - method: keydown
          'on': keydown
    - element: item
      controllers:
      - identifier: poetry--core--radio-group
        actions:
        - method: check
          'on': click
    - element: input
      controllers:
      - identifier: poetry--core--radio-group
        targets:
        - name: input
  poetry/ui/resizable:
    class_name: Poetry::Ui::Resizable::Component
    identifier: poetry--ui--resizable
    bem_block: poetry-ui-resizable
    styles: []
    options:
    - name: direction
      type: symbol
      variants:
      - horizontal
      - vertical
      default: horizontal
      description: 'The group axis: :horizontal lays panels side by side, :vertical
        stacks them.'
    - name: grip
      type: boolean
      default: false
      description: Renders the grip dots on each handle.
    slots:
    - name: panels
      many: true
      description: 'One panel per call: default_size/min_size/max_size are percentages
        of the group; the content block is required.'
      setter_args:
        panel: 0
      setter_kwargs:
        panel:
        - default_size
        - min_size
        - max_size
        - classes
      yieldless:
      - panel
      required_content:
        panel: the panel content
    description: Panels with draggable handles for resizing adjacent regions.
    elements:
    - panel
    - handle
    - grip
    capsule: e465b6e447ac
    controllers:
    - identifier: poetry--core--resizable
      targets: []
      values:
      - orientation
      actions:
      - dragEnd
      - dragMove
      - dragStart
      - keydown
      events:
      - poetry:resizable:resize
    agent_rules:
    - Declare panels with with_panel(default_size:, min_size:, max_size:) - sizes
      are PERCENTAGES and the component interleaves the separator handles.
    - 'direction: :horizontal is side-by-side (the default); :vertical stacks.'
    - Handles are keyboard splitters (arrows step, Home/End jump) - never replace
      them with styled divs.
    - Nest a group inside a panel for two-axis layouts - groups self-scope.
    required_slots:
      panel: at least two panels
    parts:
    - name: resizable-panel-group
      description: The flex group root - the splitter controller rides here
      states:
      - attr: data-orientation
        condition: the group axis
        values:
        - horizontal
        - vertical
    - name: resizable-panel
      description: One flex child whose flex-grow IS its percentage - the controller
        rewrites the inline flex on every resize
      states:
      - attr: data-min-size
        condition: 'the panel''s minimum percentage, rendered when with_panel passes
          min_size: (the controller''s clamp floor)'
      - attr: data-max-size
        condition: 'the panel''s maximum percentage, rendered when with_panel passes
          max_size: (the controller''s clamp ceiling)'
    - name: resizable-handle
      description: The role=separator splitter between panels - drag and keyboard
        resizing live here; its aria-valuenow tracks the preceding panel
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--resizable
        registers: true
        values:
        - name: orientation
    - element: handle
      controllers:
      - identifier: poetry--core--resizable
        actions:
        - method: dragStart
          'on': pointerdown
        - method: dragMove
          'on': pointermove
        - method: dragEnd
          'on': pointerup
        - method: keydown
          'on': keydown
