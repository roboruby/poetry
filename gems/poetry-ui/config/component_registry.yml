    controllers:
    - identifier: poetry--core--menu
      targets: []
      values:
      - closeOnSelect
      - loop
      - modal
      - open
      - typeaheadTimeout
      actions:
      - activate
      - close
      - closeSub
      - keydown
      - open
      - openSub
      - openValueChanged
      - subEnter
      - subLeave
      - toggle
      - triggerKeydown
      events:
      - poetry:menu:change
      - poetry:menu:closed
      - poetry:menu:edge-navigate
      - poetry:menu:open
      - poetry:menu:select
    - identifier: poetry--core--popper
      targets:
      - anchor
      - arrow
      - content
      values:
      - align
      - alignOffset
      - anchor
      - anchorPoint
      - avoidCollisions
      - side
      - sideOffset
      - strategy
      actions:
      - anchorPointValueChanged
      - reposition
      - setAnchor
      - setAnchorElement
      - strategyValueChanged
      events: []
    agent_rules:
    - Use poetry_dropdown_menu - never hand-roll role=menu popups with Tailwind.
    - Items are ACTIONS. Choosing a form VALUE is a Select/Combobox - do not fake
      it with radio items.
    - 'Navigation items pass with_item(href:) (external: for a new tab); a form action
      (sign-out, a DELETE) passes with_item(submit:, method:). The item renders AS
      the anchor / submit button (role=menuitem on the <a> or <button>) - one interactive
