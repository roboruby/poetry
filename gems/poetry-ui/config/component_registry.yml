        restores the focus-scope trap for dialog-critical pickers.
    - name: multiple
      type: boolean
      default: false
      description: 'Multi-select mode: value: becomes LIST-capable (single stays the
        scalar), the trigger is replaced by the chips field, the native <select multiple>
        posts name[], selection toggles without closing.'
    - name: name
      type: string
      description: 'The form field name on the native <select>; multiple: appends
        [] for you.'
    - name: open
      type: boolean
      default: false
      description: Server-renders the popup open.
    - name: placeholder
      type: string
      description: 'Shown in the value display (multiple: in the inline input) while
        nothing is committed.'
    - name: required
      type: boolean
      default: false
      description: Forwards to the native <select> for constraint validation.
    - name: search_placeholder
      type: string
      description: Placeholder for the popup's filter input (single mode).
    - name: show_clear
      type: boolean
      default: false
      description: 'Single mode only: the trigger-side deselection X - swaps in over
        the chevrons while a value is committed and commits the blank value, so the
        cleared state serializes as "".'
    - name: side
      type: symbol
      variants:
      - top
      - right
      - bottom
      - left
      default: bottom
      description: The popup's preferred side of the trigger; collisions may flip
        it.
    - name: side_offset
      type: integer
      default: 4
      description: Gap in px between the trigger and the popup.
    - name: value
      type: string
      description: The committed value; with multiple:, an array of values.
    - name: width
      type: string
      description: The trigger width utility class; the popup ALWAYS tracks the trigger's
        measured width, so one knob sizes both surfaces. nil resolves to the dictionary's
        default (w-50).
    slots:
    - name: trigger
      many: false
      description: Optional custom trigger content rendered BEFORE the value span
        (rare); the component owns role=combobox + the aria wiring + the chevrons
        regardless, so composition cannot drop the contract.
    - name: empty
      many: false
      description: Custom zero-results content (defaults to t('poetry.combobox.empty')).
    - name: loading
      many: false
      description: Custom pending content (a spinner); the HOST toggles visibility
        (Turbo frame events) - the part renders hidden (Command parity).
    - name: items
      many: true
      description: 'The option UNION forwarded to the embedded command list: item
        | group (heading + items) | separator - one ordered collection (interleaving
        preserved; items and groups are part COMPONENTS so option registration follows
        render/DOM order).'
      types:
      - item
      - group
      - separator
      setter_args:
        item: 0
        group: 0
        separator: 0
    description: A text input with an autocomplete popover for picking from a list.
    elements:
    - trigger
    - value
    - default_width
    - trigger_leading
    - content
    - list
    - group
    - label
    - input_fill
    - item_fill
    - item_text
    - item_indicator
    - item_indicator_state
    - native
    - chips
    - chip
    - chip_remove
    - chip_input
    - clear_anchor
    - clear
    - clear_icon
    - trigger_icon_swap
    - trigger_icon
    - indicator_check
    - chip_remove_icon
    capsule: df99f3bd77bb
    controllers:
    - identifier: poetry--core--combobox
      targets: []
      values:
      - modal
      - multiple
      - open
      - value
      actions:
      - chipKeydown
      - chipsPointerdown
      - clear
      - close
      - inputKeydown
      - nativeChanged
      - open
      - openValueChanged
      - removeChip
      - setValue
      - toggle
      - triggerKeydown
      - valueValueChanged
      events:
      - poetry:combobox:change
      - poetry:combobox:closed
      - poetry:combobox:open
      - poetry:combobox:select
    - identifier: poetry--core--command
      targets: []
      values:
      - debounce
      - filter
      - loop
      actions:
      - activate
      - filterInput
      - highlightItem
      - keydown
      - pointerHighlight
      - reset
      events:
      - poetry:command:filter
      - poetry:command:highlight
      - poetry:command:select
    - identifier: poetry--core--popper
      targets:
      - anchor
      - arrow
      - content
      values:
      - align
      - alignOffset
      - anchor
      - anchorPoint
      - avoidCollisions
      - side
      - sideOffset
      - strategy
      actions:
      - anchorPointValueChanged
      - reposition
      - setAnchor
      - setAnchorElement
      - strategyValueChanged
      events: []
    agent_rules:
    - Use poetry_combobox (f.poetry_combobox in forms) - never hand-wire Popover+Command+hidden-input;
      this component IS that wiring, with the form story done right.
    - Combobox picks VALUES. Filter-then-ACT is bare Command; short known lists are
      Select; free text is Input.
    - 'Every Combobox MUST be named (Field label via id: or aria-label) - a nameless
      bare combobox fails at render.'
    - NEVER write aria-selected from highlight logic (position is data-highlighted
      + aria-activedescendant); NEVER write the display without the native select
      first - the commit pipeline does all of it; agents patching DOM must too.
    - 'Async options: filter: false + the Turbo-frame ?q= recipe - AND the frame must
      render the twin native <option> for every committable item (the recipe''s one
      hard rule).'
    - 'multiple: true is the multi-select/chips mode: value: takes an ARRAY, the native
      <select multiple> posts name[] (the [] is appended for you), selection TOGGLES
      with the popup staying open, and chips replace the trigger - never fake multi
      with hidden inputs.'
    - Do not put interactive elements inside options (an option IS the interactive
      unit).
    - 'Deselection in single mode is include_blank (a visible blank option) or show_clear:
      (the trigger-side X - single mode only), never a re-click toggle - committing
      the already-selected value closes without change. In multiple, re-committing
      IS the deselect gesture (chip-remove is its pointer twin).'
    required_slots:
      item: at least one item
    parts:
    - name: combobox
      description: Root wrapper carrying both controllers (combobox + popper) and
        the optional dir attribute
    - name: combobox-native
      description: The visually-hidden native <select> - the serialization truth (Select's
        decision verbatim); plumbing, never styled or targeted
    - name: combobox-trigger
      description: The role=combobox button (the demo's outline Button) the field
        label reaches - value display and chevrons ride inside
      states:
      - attr: data-placeholder
        condition: no option is committed (bare; the controller toggles it on every
          commit)
      - attr: data-popup-open
        condition: the popup is open (bare while open, absent while closed - the controller
          flips it with the open state)
    - name: combobox-value
      description: The value display span - the selected option's label, or the placeholder
      states:
      - attr: data-placeholder
        condition: 'placeholder: is given - carries the placeholder text so the controller
          can restore it'
    - name: combobox-chip-input
      description: 'The inline filter input beside the chips (multiple: only) - the
        one typing surface; the source''s chip input'
    - name: combobox-content
      description: The popper-positioned popup housing the embedded Command anatomy
        - open/closed and the resolved placement ride here
      states:
      - attr: data-open
        condition: popup is open (the controller flips the pair at runtime)
      - attr: data-closed
        condition: popup is closed or animating out (the server-rendered state)
      - attr: data-chips
        condition: 'multiple: - chips mode; the popup''s minimum width follows the
          chips field'
      - attr: data-side
        condition: the placement side - server-rendered from side:, rewritten to the
          resolved side by popper on open
        values:
        - top
        - right
        - bottom
        - left
      - attr: data-align
        condition: the placement alignment - server-rendered from align:, rewritten
          by popper on open
        values:
        - start
        - center
        - end
      vars:
      - name: "--transform-origin"
        description: popper - the animation origin matching the resolved placement
      - name: "--available-width"
        description: popper - viewport space available to the popup post-flip
      - name: "--available-height"
        description: popper - viewport space available to the popup post-flip
      - name: "--anchor-width"
        description: popper - the trigger's measured width (the popup width tracks
          it - one knob, two surfaces)
      - name: "--anchor-height"
        description: popper - the trigger's measured height
    - name: combobox-clear
      description: 'The show_clear: deselection X - a trigger sibling seated over
        the chevron slot; pressing it commits the blank value and returns focus to
        the trigger. Wears the html hidden attribute while no value is committed (the
        controller flips it on every commit; the chevron swap derives from that one
        flip in CSS)'
    - name: combobox-command
      description: The embedded engine root - Command's anatomy rendered here against
        its own controller (composition at the markup contract)
    - name: combobox-input-wrapper
      description: The input row - search icon + filter input above the list
    - name: combobox-search-icon
      description: Decorative search glyph beside the input
    - name: combobox-input
      description: 'The filter input (role=combobox) - the typing session and aria-activedescendant
        live here. Single: in the popup with its own accessible name; multiple: INLINE
        in the chips frame (the input-inside layout), where the field label reaches
        it'
      states:
      - attr: data-popup-open
        condition: 'multiple: the popup is open (bare while open, absent while closed
          - the input carries the flip; single''s trigger owns it)'
    - name: combobox-list
      description: THE role=listbox - the aria-controls target of both combobox roles
    - name: combobox-empty
      description: Zero-matches message - rendered hidden; the engine unhides it when
        the filter pass leaves no visible items
    - name: combobox-group
      description: role=group labelled by its heading - hidden by the engine when
        every member item is filtered out
    - name: combobox-label
      description: The group heading - styled, no ARIA role (the group points at it
        via aria-labelledby)
    - name: combobox-item
      description: One role=option div wearing BOTH meanings - a Command item (filtering
        + highlight) AND Select's committed-value surface
      states:
      - attr: data-value
        condition: always - the option's committable value (the native <option> twin)
      - attr: data-selected
        condition: the option is committed (bare; absent while unselected - the controller
          twin-writes it with aria-selected)
      - attr: data-highlighted
        condition: the item holds the activedescendant highlight (the server seeds
          it; the engine moves it with the input's aria-activedescendant)
      - attr: data-disabled
        condition: 'disabled: is set (aria-disabled rides along)'
      - attr: data-hidden
        condition: the filter scored the item zero (the engine pairs it with hidden;
          never rendered server-side)
    - name: combobox-item-text
      description: The option's label span - the filter/typematch text source
    - name: combobox-item-indicator
      description: The trailing committed-value check (ms-auto per the demo) - the
        parent item's data-selected absence hides it
    - name: combobox-separator
      description: Decorative divider (aria-hidden) - hidden by the engine whenever
        the query is non-empty
    - name: combobox-loading
      description: Pending affordance (role=status) - rendered hidden; the HOST unhides
        it around async refills
    - name: combobox-status
      description: The engine's sr-only polite result-count live region
      states:
      - attr: data-zero
        condition: always - the localized zero-results template
      - attr: data-one
        condition: always - the localized one-result template
      - attr: data-other
        condition: always - the localized many-results template (a literal count placeholder
          the controller interpolates)
    - name: combobox-chips
      description: 'The chips FIELD frame (multiple: only) - the popper anchor replacing
        the trigger; chips + the inline input flex-wrap inside, and role=toolbar rides
        it only while it holds >=1 chip'
      states:
      - attr: data-placeholder
        condition: the selection is empty (bare; the controller flips it on every
          commit - the toolbar role departs with it)
      - attr: data-disabled
        condition: 'disabled: is set - every chip mutation is gated'
      - attr: data-remove-label
        condition: always - the localized chip-remove template (a literal label placeholder
          the controller interpolates for client-built chips)
    - name: combobox-chip
      description: 'One committed value (multiple: only) - a div taking REAL focus
        (tabindex=-1, styled by :focus-visible; chips NEVER wear data-highlighted),
        named by its value text, holding the remove button'
      states:
      - attr: data-value
        condition: always - the chip's committed value (the native <option> twin)
      - attr: data-disabled
        condition: 'disabled: is set (chip focus is blocked entirely)'
    - name: combobox-chip-remove
      description: The chip's native remove button (tabindex=-1, labelled 'Remove
        <label>') - a press removes the value and is never a chips-area press
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--combobox
        registers: true
        values:
        - name: open
        - name: value
        - name: modal
        - name: multiple
          conditional: if multiple
      - identifier: poetry--core--command
        conditional: if multiple
        registers: true
        values:
        - name: filter
        - name: loop
      - identifier: poetry--core--popper
        registers: true
        values:
        - name: side
        - name: align
        - name: side_offset
        - name: align_offset
        - name: avoid_collisions
    - element: trigger
      controllers:
