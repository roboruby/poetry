  poetry/ui/deferred:
    class_name: Poetry::Ui::Deferred::Component
    identifier: poetry--ui--deferred
    bem_block: poetry-ui-deferred
    styles: []
    options:
    - name: loading
      type: symbol
      default: lazy
      description: ":lazy fetches when the frame becomes visible; :eager fetches right
        after paint."
    - name: src
      type: string
      required: true
      description: The URL to fetch - required; rendering without it raises.
    slots: []
    description: A region that lazily loads its content on visibility, with skeleton
      and error states.
    controllers:
    - identifier: poetry--core--deferred
      targets:
      - error
      - placeholder
      values:
      - src
      actions:
      - retry
      events: []
    agent_rules:
    - Use poetry_deferred(src:) for expensive regions - never a spinner div + a hand-rolled
      fetch.
    - 'loading: :lazy (the default) fetches on visibility: a deferred region inside
      a hidden Tabs panel (with_tab defer:) or HoverCard (defer:) loads on first reveal
      for free.'
    - The block is the placeholder (a Skeleton renders when absent); failure shows
      a retryable error card automatically - never hand-wire loading or error states
      around it.
    identity: false
    parts:
    - name: deferred
      description: The <turbo-frame> root - src is armed at connect(); failure is
        a state reflected here, never silent blankness
      states:
      - attr: data-error
        condition: a frame fetch failed (error response, missing frame, or network
          error) - the controller stamps the error card; retry clears it
    - name: deferred-error
      description: The retryable error card, stamped into the frame from the slotted
        <template> on failure
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--deferred
        registers: true
        values:
        - name: src
