  poetry/ui/command:
    class_name: Poetry::Ui::Command::Component
    identifier: poetry--ui--command
    bem_block: poetry-ui-command
    styles: []
    options:
    - name: disabled
      type: boolean
      default: false
      description: Disables the filter input.
    - name: filter
      type: boolean
      default: true
      description: Client-side filtering; false leaves the list server-driven.
    - name: id
      type: string
      description: The base DOM id; the input, list, and item ids derive from it.
    - name: list_label
      type: string
      default: dynamic
      description: The listbox's accessible name.
    - name: loop
      type: boolean
      default: false
      description: Wraps arrow-key highlight movement past either end of the list.
    - name: placeholder
      type: string
      description: The filter input's placeholder text.
    - name: value
      type: string
      description: Seats the initial highlight on the item with this value.
    slots:
    - name: empty
      many: false
      description: Custom zero-results content (defaults to t('poetry.command.empty')).
    - name: loading
      many: false
      description: Custom pending content (a spinner); the HOST toggles visibility
        (Turbo frame events) - Command renders the part, never sets it.
    - name: items
      many: true
      description: 'The item UNION: item | group (heading + items) | separator - one
        ordered collection (interleaving preserved; items and groups are part COMPONENTS
        so id assignment follows render/DOM order).'
      types:
      - item
      - group
      - separator
      setter_args:
        item: 0
        group: 0
        separator: 0
    description: A command palette for fast, keyboard-driven search and actions.
    elements:
    - input_wrapper
    - input
    - list
    - empty
    - loading
    - group
    - heading
    - item
    - item_text
    - shortcut
    - separator
    - status
    - sr_only
    - search_icon
    - dialog_content
    - dialog_close
    capsule: aa4134b2c480
    controllers:
    - identifier: poetry--core--command
      targets: []
      values:
      - debounce
      - filter
      - loop
      actions:
      - activate
      - filterInput
      - highlightItem
      - keydown
      - pointerHighlight
      - reset
      events:
      - poetry:command:filter
      - poetry:command:highlight
      - poetry:command:select
    agent_rules:
    - Use poetry_command - never hand-roll a filterable listbox with an input + a
      list and ad-hoc JS.
    - Command items DO things; they carry no form value. Picking a value for a form
      is Combobox (which wraps this) - never bind a hidden input to a bare Command.
    - 'Every item needs a unique value: (ArgumentError) and gets a server id - never
      strip item ids (aria-activedescendant depends on them).'
    - Never put tabindex or focus on options; never write aria-selected in a bare
      Command - highlight is data-highlighted + activedescendant only.
    - 'Filtering is hide-only: never reorder, remove, or re-append items to ''sort''
      results - DOM order is the contract.'
    - The poetry:command:select event is the ONLY activation surface - act in a listener
      (or item data-action); don't patch the controller to navigate.
    - 'Long/async data: filter: false + a Turbo frame (the recipe) - don''t render
      5,000 items and hope.'
    - 'Icon-rich labels: set filter_value:/keywords: rather than stuffing hidden text
      into items.'
    requires_any:
    - hint: the input's accessible name
      options:
      - id
      - aria-label
      - aria-labelledby
      - aria
    parts:
    - name: command
      description: Root of the palette - the input row over the listbox, carrying
        the engine controller
    - name: command-input-wrapper
      description: The input row - search icon + filter input above the list
    - name: command-search-icon
      description: Decorative search glyph beside the input
    - name: command-input
      description: The role=combobox filter input - real focus stays pinned here for
        the whole session; the highlight rides aria-activedescendant
    - name: command-list
      description: The role=listbox holding empty/loading/items - the input's aria-controls
        target
    - name: command-empty
      description: Zero-matches message - rendered hidden; the controller unhides
        it when the filter pass leaves no visible items
    - name: command-loading
      description: Pending affordance (role=status) - rendered hidden; the HOST toggles
        it (Turbo frame events), Command never does
    - name: command-group
      description: role=group labelled by its heading - hidden by the controller when
        every member item is filtered out
      states:
      - attr: data-always-render
        condition: 'always_render: is set - the group survives every filter pass'
    - name: command-group-heading
      description: The group heading - styled, no ARIA role (the group points at it
        via aria-labelledby)
    - name: command-item
      description: One role=option action row - highlight, filtering, and disablement
        ride here (never aria-selected in a bare Command)
      states:
      - attr: data-value
        condition: always - the item's unique value (its server-stable id follows
          registration order)
      - attr: data-highlighted
        condition: the item holds the highlight (bare; the controller twin-writes
          it with the input's aria-activedescendant)
      - attr: data-disabled
        condition: 'disabled: is set (aria-disabled rides along)'
      - attr: data-keywords
        condition: 'keywords: given - extra filter terms beyond the label'
      - attr: data-always-render
        condition: 'always_render: is set - the item survives every filter pass'
      - attr: data-hidden
        condition: the filter scored the item zero (the controller pairs it with hidden;
          never rendered server-side)
    - name: command-item-text
      description: The item's label span - the filter/typematch text source (shortcuts
        and icons excluded)
    - name: command-shortcut
      description: Presentational keyboard hint - excluded from the filter text; Command
        never binds the hinted key
    - name: command-separator
      description: Decorative divider (aria-hidden) - hidden by the controller whenever
        the query is non-empty
    - name: command-status
      description: The sr-only polite result-count live region - the controller writes
        the debounced count from the localized templates
      states:
      - attr: data-zero
        condition: always - the localized zero-results template
      - attr: data-one
        condition: always - the localized one-result template
      - attr: data-other
        condition: always - the localized many-results template (a literal count placeholder
          the controller interpolates)
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--command
        registers: true
        values:
        - name: filter
        - name: loop
    - element: input
      controllers:
      - identifier: poetry--core--command
        actions:
        - method: filterInput
          'on': input
        - method: keydown
          'on': keydown
    - element: item
      controllers:
      - identifier: poetry--core--command
        actions:
        - method: activate
          'on': click
        - method: pointerHighlight
          'on': pointermove
  poetry/ui/command/dialog:
    class_name: Poetry::Ui::Command::DialogComponent
    identifier: poetry--ui--command--dialog
    bem_block: poetry-ui-command-dialog
    styles: []
    options:
    - name: description
      type: string
      default: dynamic
      description: The sr-only description wired to aria-describedby (localized default).
    - name: dismissible
      type: boolean
      default: true
      description: Backdrop clicks close the palette; false keeps it open.
    - name: filter
      type: boolean
      default: true
      description: 'Passed through to the embedded Command: client-side filtering.'
    - name: hotkey
      type: string
      description: A global shortcut ("meta+k") that toggles the palette from anywhere;
        an accelerator, not the only way in.
    - name: id
      type: string
      description: 'Passed through: the embedded palette''s base DOM id.'
    - name: list_label
      type: string
      description: 'Passed through: the listbox''s accessible name.'
    - name: loop
      type: boolean
      default: false
      description: 'Passed through: wraps arrow-key highlight movement at the ends.'
    - name: placeholder
      type: string
      description: 'Passed through: the filter input''s placeholder text.'
    - name: show_close_button
      type: boolean
      default: dynamic
      description: 'The close X, seated in the input row. Off by default while backdrop
        clicks close the palette (Esc, the backdrop, or picking an item all close
        it); on when dismissible: false so a pointer has a way out. Pass true to always
        show it.'
    - name: title
      type: string
      default: dynamic
      description: The dialog's sr-only accessible name (localized default) - override
        rather than remove.
    - name: value
      type: string
      description: 'Passed through: seats the initial highlight on this item value.'
    slots:
    - name: trigger
      many: false
      description: 'The trigger is a poetry Button wired to open - the Dialog pattern:
        with_trigger(variant: :outline) { "Open palette" }.'
      setter_args:
        trigger: 0
      yieldless:
      - trigger
    description: The command palette in a modal dialog, summonable from anywhere.
    slot_extras:
    - empty
    - group
    - item
    - loading
    - separator
    controllers:
    - identifier: poetry--core--dialog
      targets:
      - dialog
      values:
      - dismissible
      - hotkey
      actions:
      - backdropClose
      - close
      - lockScroll
      - open
      - toggle
      - unlockScroll
      events: []
    agent_rules:
    - 'App-wide palettes use poetry_command_dialog with hotkey: (''meta+k'') - never
      a hand-wired window keydown listener around poetry_dialog.'
    - Open it with with_trigger(...) too - the hotkey is an accelerator, not the only
      way in.
    - 'The sr-only title/description default to the source strings - override title:/description:
      rather than removing them (they are the dialog''s accessible name).'
    - 'Item wiring is Command''s: act on poetry:command:select; close the dialog in
      the listener if the action should dismiss the palette.'
    - 'The close X is off by default (keyboard-first: Esc, the backdrop, or picking
      an item closes it) and appears with dismissible: false; show_close_button: true
      forces it - it seats in the input row, never over it.'
    parts:
    - name: command-dialog
      description: Root wrapper around the trigger and the <dialog> - the palette's
        own chrome; the embedded Command inside carries its own part contract
    - name: dialog-content
      description: The <dialog> panel (Dialog's chrome retuned to overflow-hidden
        p-0) - positioning, animation, and the open state ride here
      states:
      - attr: data-open
        condition: panel is open (the dialog controller flips the pair at runtime)
      - attr: data-closed
        condition: panel is closed or animating out (the server-rendered state)
    - name: dialog-header
      description: Dialog's title block, sr-only here - the palette owns the visible
        surface
    - name: dialog-title
      description: The sr-only heading - the dialog's accessible name (defaults to
        the source string)
    - name: dialog-description
      description: The sr-only description wired to aria-describedby
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--dialog
        registers: true
        values:
        - name: dismissible
        - name: hotkey
          conditional: if
    - element: content
      controllers:
      - identifier: poetry--core--dialog
        targets:
        - name: dialog
        actions:
        - method: close
          'on': cancel
        - method: backdropClose
          'on': click
    - element: trigger
      controllers:
      - identifier: poetry--core--dialog
        actions:
        - method: open
    - element: close
      controllers:
      - identifier: poetry--core--dialog
        actions:
        - method: close
