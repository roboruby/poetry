      - default
      - sm
      default: default
      required: true
    options:
    - name: checked
      type: boolean
      default: false
    - name: disabled
      type: boolean
      default: false
    - name: label
      type: string
    - name: name
      type: string
    - name: required
      type: boolean
      default: false
    - name: unchecked_value
      type: string
      default: '0'
    - name: value
      type: string
      default: '1'
    slots: []
    description: A toggle for turning a setting on or off.
    elements:
    - thumb
    - input
    capsule: d116e5cc39c8
    controllers:
    - identifier: poetry--core--checked
      targets: []
      values:
      - inputId
      actions:
      - check
      - set
      - toggle
      - uncheck
      events:
      - poetry--core--checked:change
    agent_rules:
    - Use poetry_switch - never a styled checkbox pretending to be a switch (role=switch
      announces on/off; that's the point).
    - Switch = instant effect; Checkbox = staged for submit. If nothing happens until
      a Save button, use Checkbox.
    - Every switch needs an accessible name (Label/Field for= or label:).
    - Switches are BINARY - no indeterminate, ever (ArgumentError). A third state
      means a different component.
    - The instant-effect recipe pairs the flip with server persistence (Turbo auto-submit)
      - never flip UI-only for a setting the user believes is saved.
    - NEVER write the checked attributes (data-checked/data-unchecked) without aria-checked
      and the input sync (the controller writes all three).
