      - attr: data-side
        condition: always - which edge the pill overlays (default bottom)
      - attr: data-align
        condition: always - placement along that edge (default end)
  poetry/ui/button:
    class_name: Poetry::Ui::Button::Component
    identifier: poetry--ui--button
    bem_block: poetry-ui-button
    styles:
    - name: size
      type: symbol
      variants:
      - default
      - xs
      - sm
      - lg
      - icon
      - icon-xs
      - icon-sm
      - icon-lg
      default: default
      required: true
      description: 'The size axis; the icon* sizes are square icon-only forms (label:
        required).'
    - name: variant
      type: symbol
      variants:
      - default
      - destructive
      - outline
      - secondary
      - ghost
      - link
      default: default
      required: true
      description: The visual intent axis; :destructive marks irreversible actions.
    options:
    - name: disabled
      type: boolean
      default: false
      description: Disables the control (native disabled; aria-disabled on the anchor
        form).
    - name: href
      type: string
      description: The link target; implies the anchor form.
    - name: label
      type: string
      description: The accessible name for icon-only usage - not visible text.
    - name: loading
      type: boolean
      default: false
      description: 'The no-JS loading state: aria-busy, a spinner, and the control
        disabled.'
    - name: tag
      type: symbol
      variants:
      - button
      - a
      default: button
      description: Renders the same styling on an <a> when :a - navigation wearing
        button clothes.
    - name: type
      type: symbol
      variants:
      - button
      - submit
      - reset
      default: button
      description: The native button type; ignored when the button renders as an anchor.
    slots:
    - name: leading
      many: false
      description: Optional leading visual, rendered inside the icon span.
    - name: trailing
      many: false
      description: Optional trailing visual, rendered inside the icon span.
    description: Triggers an action or event, such as submitting a form or opening
      a dialog.
    elements: []
    capsule: 297bdbb8b63a
    agent_rules:
    - Use poetry_button - never a raw <button> with hand-written Tailwind.
    - 'The visible text is the content block: poetry_button { "Save" }. label: is
      ONLY the accessible name.'
    - 'Icon-only buttons (size: :icon*) MUST pass label: (the accessible name).'
    - 'Link-styled actions use variant: :link - not <a> with button classes.'
    - 'Navigation wearing button styling: pass href: (renders a real <a>; tag: :a
      is implied) - never onclick navigation.'
    - 'Loading via loading: - never a manual disabled + spinner.'
    - Never nest an interactive element inside a Button.
    - Pick the variant by intent; one primary (default) action per view.
    requires_any:
    - hint: 'nothing visible renders without one - label: is only the accessible name'
      content: true
      slots:
      - leading
      - trailing
      options:
      - loading
    identity: false
    parts:
    - name: button
      description: 'The rendered control itself (<button>, or <a> when tag: :a) -
        every visual state rides here'
      states:
      - attr: data-variant
        condition: always - the resolved variant
        values:
        - default
        - destructive
        - outline
        - secondary
        - ghost
        - link
      - attr: data-size
        condition: always - the resolved size
        values:
        - default
        - xs
        - sm
        - lg
        - icon
        - icon-xs
        - icon-sm
        - icon-lg
      - attr: data-loading
        condition: 'loading: is set (aria-busy rides along)'
    - name: icon
      description: Wrapper span around leading/trailing slot content - sizes and centers
        whatever it holds
    - name: label
      description: 'The content block''s span (display: contents - children join the
        root''s flex row directly)'
    - name: spinner
      description: 'The loading indicator, swapped in for the leading icon while loading:'
  poetry/ui/button_group:
