    - 'Always give it a name: in forms - a checkbox without one submits nothing (visual-only
      mode is for controlled UI like DataTable row selection ONLY).'
    - 'Every checkbox needs an accessible name: a Label/Field for= association (preferred)
      or label:.'
    - Indeterminate is set programmatically/server-side only - no user gesture produces
      it; use it for select-all parents.
    - 'Select-all recipe: wrap parent + rows in data-controller="poetry--core--checkbox-group"
      with data-action="poetry:checkbox:change->poetry--core--checkbox-group#changed";
      mark the parent box data: {"poetry--core--checkbox-group-target": "all"} and
      each row box target "item" - the parent fans out, rows re-derive checked/unchecked/indeterminate
      (DataTable''s selectable: already does this for its own rows).'
    - Instant-effect settings use Switch; pressed UI tools use Toggle; one-of-N uses
      RadioGroup.
    - NEVER write the checked attributes (data-checked/data-unchecked/data-indeterminate)
      without aria-checked and the input's checked property (the controller writes
      all three; agents patching DOM must too).
    - Don't suppress unchecked_value unless using the array idiom - an unchecked box
      that submits nothing silently keeps the old server value.
    parts:
    - name: checkbox
      description: The visual button[role=checkbox] - reflects the hidden input via
        aria-checked plus the checked triple
      states:
      - attr: data-checked
        condition: checked (the controller reflects every toggle here, aria-checked
          in step)
      - attr: data-unchecked
        condition: unchecked - the indicator goes invisible
      - attr: data-indeterminate
        condition: 'checked: :indeterminate (server/programmatic only; the first toggle
          resolves it to checked)'
    - name: checkbox-indicator
      description: Centering span around the check glyph (minus when indeterminate)
        - CSS-hidden while unchecked, never unmounted
      states:
      - attr: data-checked
        condition: mirrors the control (the controller reflects state on every part
          wearing the triple)
      - attr: data-unchecked
        condition: mirrors the control - the indicator is invisible
      - attr: data-indeterminate
        condition: mirrors the control - the glyph swaps to minus
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--core--checked
        registers: true
        values:
        - name: input_id
          conditional: if form_participant?
        actions:
        - method: toggle
          'on': click
  poetry/ui/clipboard_text:
    class_name: Poetry::Ui::ClipboardText::Component
