# Dictionary transcription-fidelity deviations - the single source of truth
# for every way a Style dictionary's structural tokens differ from the
# styled source's classNames for the same data-slot at the pin
# (config/dictionary_fidelity/upstream-<pin>.json). The gate
# (test/poetry/ui/dictionary_fidelity_test.rb, rake css:verify_dictionary_fidelity)
# holds this file and the rendered diff in exact two-way agreement: an
# unrecorded difference fails, a recorded one that no longer exists fails
# as stale. Change a dictionary -> reconcile this file in the same change,
# with a reason. Bumping the pin regenerates the snapshot
# (css:dictionary_snapshot) and re-opens every entry for review.
#
# Shape, per source file (the styled registry's basename):
#   <file>:
#     missing_slots: { reason: ..., list: [slot, ...] }   # source slots poetry never renders
#     poetry_slots:  { reason: ..., list: [slot, ...] }   # poetry slots the source lacks
#     slots:
#       <slot>:
#         reason: ...
#         dropped: [token, ...]   # styled-source tokens the dictionary lacks
#         added:   [token, ...]   # poetry-only tokens
#         classic: [token, ...]   # tokens the classic source carries inline (theme material)
#         tag: "span -> svg"      # element kind, when the source's is knowable
# Top-level: missing_components / poetry_components (same list shape).
missing_components:
  reason: chart lives in poetry-charts; collapsible has no dictionary (its parts are
    hook-only, held by the part contract); direction is a React RTL provider; sonner
    is the source's third-party toaster (poetry's toast is its own).
  list:
  - chart
  - collapsible
  - direction
  - sonner
poetry_components:
  reason: Poetry additions with no source file at the pin.
  list:
  - autocomplete
  - clipboard-text
  - code-block
  - data-table
  - date-field
  - date-picker
  - file-input
  - link
  - metadata-list
  - meter
  - number-field
  - search-field
  - sensitive-input
  - stat
  - tag-group
  - time-field
  - timeline
  - toolbar
  - tree
  - typeset
accordion:
  poetry_slots:
    reason: The heading wrapper (h3) around the trigger - the classic anatomy.
    list:
    - accordion-header
  slots:
    accordion-trigger:
      reason: 'Native <button disabled> owns disabled (disabled: variants); the source''s
        aria-disabled pair has no emitter. The chevron rotation rides the trigger''s
        aria-expanded (poetry''s icon is one svg the theme sizes).'
      dropped:
      - aria-disabled:opacity-50
      - aria-disabled:pointer-events-none
      added:
      - "[&[aria-expanded=true]>svg]:rotate-180"
      classic:
      - disabled:opacity-50
      - disabled:pointer-events-none
    accordion-trigger-icon:
      reason: The source swaps two icons on aria-expanded (hidden/inline); poetry
        rotates its single chevron (transition-transform duration-200).
      dropped:
      - group-aria-expanded/accordion-trigger:hidden
      - group-aria-expanded/accordion-trigger:inline
      - hidden
      added:
      - duration-200
      - transition-transform
alert-dialog:
  missing_slots:
    reason: 'Poetry''s dialog family is the native <dialog>: no portal, overlay, or
      positioner element (the backdrop is ::backdrop), the trigger is the caller''s
      Button, and the popup is the dialog itself - m-auto/open:grid replace the source''s
      fixed/translate centering.'
    list:
    - alert-dialog-overlay
    - alert-dialog-portal
    - alert-dialog-trigger
  slots:
    alert-dialog-content:
      reason: 'Poetry''s dialog family is the native <dialog>: no portal, overlay,
        or positioner element (the backdrop is ::backdrop), the trigger is the caller''s
        Button, and the popup is the dialog itself - m-auto/open:grid replace the
        source''s fixed/translate centering.'
      dropped:
      - "-translate-x-1/2"
      - "-translate-y-1/2"
      - fixed
      - grid
      - left-1/2
      - outline-none
      - top-1/2
      - w-full
      - z-50
      added:
      - m-auto
      - open:grid
    alert-dialog-footer:
      reason: The sm size layout is applied Ruby-side (footer_size_sm) instead of
        the source's group-data-[size=sm] chain on a content group.
      dropped:
      - gap-2
      - group-data-[size=sm]/alert-dialog-content:grid
      - group-data-[size=sm]/alert-dialog-content:grid-cols-2
      added:
      - grid
      - grid-cols-2
    alert-dialog-header:
      reason: 'Classic mechanics poetry keeps inline: the styled source''s rules do
        not carry them (its element relies on a composed child or a primitive default),
        so the dictionary must. The responsive sm: placement is poetry''s (the classic
        source''s) layout.'
      added:
      - grid-rows-[auto_auto_1fr]
      - sm:grid-rows-[auto_1fr]
      - sm:place-items-start
      - sm:text-left
      classic:
      - grid
      - grid-rows-[auto_1fr]
      - place-items-center
      - text-center
    alert-dialog-media:
      reason: The media well's centering mechanics are poetry's; the source's div
        is hook-only.
      added:
      - sm:row-span-2
      classic:
      - inline-flex
      - items-center
      - justify-center
    alert-dialog-title:
      reason: Beside the media well the title starts in the header grid's second column
        (poetry's layout).
      added:
      - sm:col-start-2
