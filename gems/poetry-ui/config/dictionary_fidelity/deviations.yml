      - data-[upload-state=error]:border-destructive/30
      - data-[upload-state=idle]:border-dashed
    attachment-description:
      reason: 'State vocabulary: poetry names the attribute differently (documented
        in the part contract). data-upload-state replaces the source''s data-state
        (poetry never uses data-state); image handling is guarded by data-variant=image.'
      dropped:
