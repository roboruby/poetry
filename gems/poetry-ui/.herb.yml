# Herb toolchain configuration (linter / formatter / language server).
# https://herb-tools.dev/configuration
#
# Rules are version-gated: a newer linter never enables new rules here
# until `version` is bumped deliberately (bump + re-lint in one change).
version: 0.10.3

framework: actionview
# Every component and generator template is gated to compile under
# Herb::Engine (rake herb:compile), the stricter of the two engines a host
# may run.
template_engine: herb

linter:
  enabled: true
  rules:
    # Slot setters on a builder yielded by a wrapper helper
    # (`<%= poetry_breadcrumb do |crumb| %><% crumb.with_item(...) %>`) are
    # flagged as discarded values. The upstream exemption only covers
    # builders yielded by `render ... do |c|` blocks (marcoroth/herb#1580,
    # #1822); the helper-yielded form is marcoroth/herb#2426. Re-enable when it lands.
    erb-no-unused-expressions:
      enabled: false
    # Brace-form slot setters (`<% button.with_leading { render Icon } %>`)
    # are flagged and the suggested autofix renders the wrong thing -
    # marcoroth/herb#2340. A genuinely discarded helper is still caught by
    # erb-no-unused-expressions once that rule is back on.
    actionview-no-silent-helper:
      enabled: false
    # `<div <%= tag.attributes(...) %>>` is Poetry's root idiom: the
    # attributes come from the part contract (stimulus_attributes_for) and
    # the literal tag keeps the template HTML-first. Its autofix would
    # rewrite the roots into `tag.div` calls.
    actionview-no-unnecessary-tag-attributes:
      enabled: false

formatter:
  enabled: false
