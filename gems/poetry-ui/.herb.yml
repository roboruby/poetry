# Herb toolchain configuration (linter / formatter / language server).
# https://herb-tools.dev/configuration
#
# Rules are version-gated: a newer linter never enables new rules here
# until `version` is bumped deliberately (bump + re-lint in one change).
version: 0.11.0

framework: actionview
# Every component and generator template is gated to compile under
# Herb::Engine (rake herb:compile), the stricter of the two engines a host
# may run.
template_engine: herb

linter:
  enabled: true
  rules:
    # `render` takes a component instance in these templates
    # (`<%= render copy_button %>`): a renderable, not a record whose
    # partial Rails derives from `to_partial_path`. The rule cannot tell
    # the two apart.
    actionview-no-implicit-partial:
      enabled: false
    # A block parameter named after the component that yields it
    # (`<%= poetry_select do |select| %>`) is the idiom the previews and
    # the block templates teach: inside the block the builder is what the
    # name means.
    actionview-no-helper-shadowing:
      enabled: false
    # An anchor is written as the tag it renders. `link_to` is one of the
    # helpers a host compiling with Herb's slots resolves ahead of the
    # render, and a literal tag gives that compile nothing to resolve.
    actionview-prefer-link-to-helper:
      enabled: false
    # `<div <%= tag.attributes(...) %>>` is how a literal tag carries its
    # wiring: the attributes come from the part contract
    # (stimulus_attributes_for) and the tag stays the markup it renders.
    # The rule's autofix would rewrite each one into a `tag.div` call.
    actionview-no-unnecessary-tag-attributes:
      enabled: false

formatter:
  enabled: false
