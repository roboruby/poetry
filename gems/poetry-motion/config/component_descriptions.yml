# Per-effect one-line descriptions (editorial, hand-authored), merged into
# the generated registry by Poetry::Motion.registry. Keyed by component_path.
---
poetry/motion/parallax: "Content that drifts at its own pace as it scrolls through the viewport."
poetry/motion/scroll_progress: "A thin bar that fills as the reader scrolls the page or one long element."
poetry/motion/background: "A decorative background in CSS alone: a grid or dot pattern, with aurora, meteors, a retro grid or ripples."
poetry/motion/scramble: "Text that decodes from random glyphs into itself when it comes into view."
poetry/motion/typewriter: "A line typed out a character at a time when it comes into view."
poetry/motion/word_rotate: "A word that turns over into the next in place, then settles on the first."
poetry/motion/dock: "A row of links or buttons that swell toward the pointer, the nearest most, like a launcher."
poetry/motion/magnetic: "A wrapper that pulls its control a few pixels toward the pointer and springs it home."
poetry/motion/spotlight_card: "A surface with a soft glow that follows the pointer across it."
poetry/motion/animated_list: "A list whose Turbo Stream changes animate: new items fade in, removed ones fade out, the rest slide into place."
poetry/motion/layout_group: "Elements that share a data-layout-id move as one thing between places, like an active-tab indicator."
poetry/motion/shared_element: "An element a Turbo visit morphs from one page to the next, like a card into its detail page."
poetry/motion/marquee: "Items that scroll in a loop, logos or testimonials, with a pause control; the loop is CSS."
poetry/motion/number_ticker: "A number that counts up to its server-rendered value when it comes into view."
poetry/motion/text_reveal: "A short passage whose words brighten one after another as it scrolls into view."
poetry/motion/tilt_card: "A surface that leans toward a fine pointer and springs back flat."
