    capsule: 5ca4174ef820
    controllers:
    - identifier: poetry--motion--scramble
      targets:
      - display
      values:
      - animate
      - delay
      - duration
      - trigger
      actions: []
      events: []
    agent_rules:
    - Scramble a short label or heading, ideally in a monospace face so the width
      holds; never text a reader needs mid-animation.
    identity: false
    parts:
    - name: scramble
