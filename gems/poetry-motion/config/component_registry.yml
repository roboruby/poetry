        targets:
        - name: display
  poetry/motion/scroll_progress:
    class_name: Poetry::Motion::ScrollProgress::Component
    identifier: poetry--motion--scroll_progress
    bem_block: poetry-motion-scroll_progress
    styles: []
    options:
    - name: position
      type: symbol
      variants:
      - top
      - bottom
      - inline
      default: top
      description: top or bottom pins the bar to the viewport edge; inline leaves
        it in place.
    - name: target
      type: string
      description: The id of the element whose scroll the bar follows; the page when
        blank.
    slots: []
    helper: poetry_scroll_progress
    description: A thin bar that fills as the reader scrolls the page or one long
      element.
    elements: []
    capsule: c4903c40cdb6
    controllers:
    - identifier: poetry--motion--scroll-progress
      targets: []
      values:
      - targetId
      actions: []
      events: []
    agent_rules:
    - Use one scroll progress bar per page, for long reading; it is decorative and
      never the only sign of where the reader is.
    identity: false
    parts:
    - name: scroll-progress
      description: The bar; it fills from the start edge
      states:
      - attr: data-position
        condition: always - where the bar sits
        values:
        - top
        - bottom
        - inline
      vars:
      - name: "--scroll-progress"
        description: how far the reader has scrolled, 0 to 1
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--scroll-progress
        registers: true
        values:
        - name: target_id
          conditional: if
    behaviors:
    - name: scroll_value
      description: Progress from 0 to 1 tied to scrolling; the finished state under
        reduced motion.
      runtime: true
  poetry/motion/shared_element:
    class_name: Poetry::Motion::SharedElement::Component
    identifier: poetry--motion--shared_element
    bem_block: poetry-motion-shared_element
    styles: []
    options:
    - name: as
      type: symbol
      default: div
      description: The element it renders as.
    - name: name
      type: string
      required: true
      description: The view-transition name both pages give the element.
    slots: []
    helper: poetry_shared_element
    description: An element a Turbo visit morphs from one page to the next, like a
      card into its detail page.
    elements: []
    capsule: 42e5df339fc2
    agent_rules:
    - 'Use one name per element per page: two elements with the same name on one page
      cancel the transition. Build names from the record, such as product-42.'
    - Shared elements need <meta name="view-transition" content="same-origin"> in
      the layout; without it the visit swaps the page with no morph.
    requires_content: the element both pages share
    identity: false
    parts:
    - name: shared-element
      description: The element the visit morphs between pages; carries view-transition-name
  poetry/motion/spotlight_card:
    class_name: Poetry::Motion::SpotlightCard::Component
    identifier: poetry--motion--spotlight_card
    bem_block: poetry-motion-spotlight_card
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: size
      type: integer
      default: 320
      description: The glow's diameter in pixels.
    slots: []
    helper: poetry_spotlight_card
    description: A surface with a soft glow that follows the pointer across it.
    elements: []
    capsule: 58588ea5f3ba
    controllers:
    - identifier: poetry--motion--spotlight-card
      targets: []
      values: []
      actions: []
      events: []
    agent_rules:
    - Pointer effects never move focus and never carry information a keyboard user
      would miss.
    - 'The glow is decoration: the surface reads the same without it, and it never
      carries state.'
    requires_content: the surface the glow follows the pointer across
    identity: false
    parts:
    - name: spotlight-card
      description: The surface; ::before draws the glow
      vars:
      - name: "--spotlight-x"
        description: the pointer's x within the card
      - name: "--spotlight-y"
        description: the pointer's y within the card
      - name: "--spotlight-opacity"
        description: 1 while a fine pointer is over the card
      - name: "--spotlight-size"
        description: the glow's diameter (size:)
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--spotlight-card
        conditional: if animate
        registers: true
    behaviors:
    - name: pointer
      description: The pointer's position over the element, once a frame; fine pointers
        only, inert under reduced motion.
      runtime: true
  poetry/motion/text_reveal:
    class_name: Poetry::Motion::TextReveal::Component
    identifier: poetry--motion--text_reveal
    bem_block: poetry-motion-text_reveal
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: tag
      type: symbol
      variants:
      - p
      - h1
      - h2
      - h3
      - h4
      - blockquote
      - div
      default: p
      description: The element the passage renders as.
    - name: text
      type: string
      required: true
      description: The passage, plain text.
    slots: []
    helper: poetry_text_reveal
    description: A short passage whose words brighten one after another as it scrolls
      into view.
    elements:
    - reader
    capsule: e3691c545d14
    controllers:
    - identifier: poetry--motion--text-reveal
      targets: []
      values: []
      actions: []
      events: []
    agent_rules:
    - 'Text reveal is for a short passage of plain text (a statement, a quote), never
      body copy, links or form labels: the words are rebuilt as spans.'
    - Words not yet revealed are dimmed below text contrast on purpose; readers get
      the whole passage from its hidden copy, and nothing the page needs may live
      only in a reveal.
    identity: false
    parts:
    - name: text-reveal
      description: The passage; --reveal-progress (0 to 1) brightens its words
      vars:
      - name: "--reveal-progress"
        description: how far the reveal has come, 1 when finished
      - name: "--reveal-count"
        description: how many words the passage has
    - name: text-reveal-word
      description: One word, aria-hidden; its opacity follows the progress
      vars:
      - name: "--word-index"
        description: the word's position
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--text-reveal
        conditional: if animate
        registers: true
    behaviors:
    - name: scroll_value
      description: Progress from 0 to 1 tied to scrolling; the finished state under
        reduced motion.
      runtime: true
  poetry/motion/tilt_card:
    class_name: Poetry::Motion::TiltCard::Component
    identifier: poetry--motion--tilt_card
    bem_block: poetry-motion-tilt_card
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: max
      type: integer
      default: 8
      description: The largest lean, in degrees.
    - name: spring
      type: symbol
      variants:
      - gentle
      - snappy
      - bouncy
      default: snappy
      description: 'The spring token: gentle, snappy, bouncy.'
    slots: []
    helper: poetry_tilt_card
    description: A surface that leans toward a fine pointer and springs back flat.
    elements:
    - layer
    capsule: a392f2a7b891
    controllers:
    - identifier: poetry--motion--tilt-card
      targets:
      - layer
      values:
      - animate
      - max
      - spring
      actions: []
      events: []
    agent_rules:
    - Pointer effects never move focus and never carry information a keyboard user
      would miss.
    - 'Never put a popover, menu, select, combobox, tooltip or hover card trigger
      inside a tilt card: the tilted layer becomes the containing block for their
      fixed-position panels. poetry check flags it.'
    - 'The lean is decoration: nothing on the card may depend on it, and the card
      reads the same flat.'
    requires_content: the surface that tilts, a card most often
    identity: false
    parts:
    - name: tilt-card
      description: The perspective wrapper; never transformed itself
    - name: tilt-card-layer
      description: The layer that leans
      vars:
      - name: "--tilt-x"
        description: the lean around the vertical axis, in degrees
      - name: "--tilt-y"
        description: the lean around the horizontal axis, in degrees
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--tilt-card
        registers: true
        values:
        - name: max
        - name: spring
        - name: animate
          conditional: unless animate
    - element: layer
      controllers:
      - identifier: poetry--motion--tilt-card
        targets:
        - name: layer
    behaviors:
    - name: pointer
      description: The pointer's position over the element, once a frame; fine pointers
        only, inert under reduced motion.
      runtime: true
    - name: spring
      description: A value that springs to each new target and is retargeted without
        a jump.
      runtime: true
  poetry/motion/typewriter:
    class_name: Poetry::Motion::Typewriter::Component
    identifier: poetry--motion--typewriter
    bem_block: poetry-motion-typewriter
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: cursor
      type: boolean
      default: true
      description: Shows a caret after the text while it types.
    - name: delay
      type: integer
      default: 0
      description: Milliseconds to wait before the motion starts.
    - name: speed
      type: integer
      default: 50
      description: Milliseconds per character.
    - name: text
      type: string
      required: true
      description: The line, plain text.
    - name: trigger
      type: symbol
      variants:
      - load
      - in_view
      default: in_view
      description: 'When the motion starts: load, in_view.'
    slots: []
    helper: poetry_typewriter
    description: A line typed out a character at a time when it comes into view.
    elements:
    - reader
    capsule: 0f57aa34a3eb
    controllers:
    - identifier: poetry--motion--typewriter
      targets:
      - display
      values:
      - animate
      - delay
      - speed
      - trigger
      actions: []
      events: []
    agent_rules:
    - Type one short line, a headline or a prompt; never body copy or anything a reader
      must wait for. The line is complete in the page before it types.
    identity: false
    parts:
    - name: typewriter
      description: The line; a caret follows the text while it types
      states:
      - attr: data-typing
        condition: the line is typing
      - attr: data-cursor
        condition: the caret is on (cursor:)
    - name: typewriter-display
