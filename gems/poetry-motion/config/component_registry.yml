        - name: trigger
    - element: display
      controllers:
      - identifier: poetry--motion--typewriter
        conditional: if animate
        targets:
        - name: display
  poetry/motion/word_rotate:
    class_name: Poetry::Motion::WordRotate::Component
    identifier: poetry--motion--word_rotate
    bem_block: poetry-motion-word_rotate
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: interval
      type: integer
      default: 2500
      description: Milliseconds each word shows.
    - name: rounds
      type: integer
      default: 1
      description: How many times it goes through the words; 0 keeps going.
    - name: words
      type: list
      required: true
      description: The words, the first one first.
    slots: []
    helper: poetry_word_rotate
    description: A word that turns over into the next in place, then settles on the
      first.
    elements:
    - reader
    - stack
    - word
    capsule: b5e0c38c987b
    controllers:
    - identifier: poetry--motion--word-rotate
      targets:
      - word
      values:
      - animate
      - interval
      - rounds
      actions: []
      events: []
    agent_rules:
    - 'The first word is the one that counts: it is what renders, what a screen reader
      hears and where the rotation stops. Order the words so the sentence reads right
      with only it.'
    - 'Keep rounds: small. A rotation that runs past five seconds is auto-updating
      content and needs a way to stop it (WCAG 2.2.2); rounds: 0 never stops.'
    identity: false
    parts:
    - name: word-rotate
      description: The cell the words share, sized to the longest
    - name: word-rotate-word
      description: One word; the active one shows
      states:
      - attr: data-active
        condition: the word showing
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--word-rotate
        conditional: if animate
        registers: true
        values:
        - name: interval
        - name: rounds
    - element: word
      controllers:
      - identifier: poetry--motion--word-rotate
        conditional: if animate
        targets:
        - name: word
