# poetry component registry - generated by `bin/rake registry:generate` FROM SOURCE.
# DO NOT EDIT: CI verifies this file matches a fresh build (rake registry:verify).
---
components:
  poetry/motion/animated_list:
    class_name: Poetry::Motion::AnimatedList::Component
    identifier: poetry--motion--animated_list
    bem_block: poetry-motion-animated_list
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: as
      type: symbol
      variants:
      - ul
      - ol
      - div
      default: ul
      description: 'The element the list renders as: ul, ol or div.'
    - name: duration
      type:
      default: normal
      description: 'How long the motion runs: a duration token (fast, normal, slow)
        or milliseconds.'
    slots: []
    helper: poetry_animated_list
    description: 'A list whose Turbo Stream changes animate: new items fade in, removed
      ones fade out, the rest slide into place.'
    elements: []
    capsule: e6c7e56a6ff5
    controllers:
    - identifier: poetry--motion--animated-list
      targets: []
      values:
      - duration
      actions: []
      events: []
    agent_rules:
    - 'Give the list an id: and target it (or its items) with Turbo Streams; the streams
      animate, the server-rendered list is the finished state.'
    - Each direct child is one item. Keep item elements stable across renders so survivors
      slide instead of fading out and back in.
    requires_content: the list's items
    parts:
    - name: animated-list
      description: The list; its direct children are the items that enter, leave and
        move
      states:
      - attr: data-animated-list
        condition: always - the list's own key, which names its items in the transition
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--animated-list
        conditional: if animate
        registers: true
        values:
        - name: duration
    behaviors:
    - name: layout
      description: DOM changes animated as layout transitions, only when no Turbo
        visit holds the view-transition slot.
      runtime: true
  poetry/motion/background:
    class_name: Poetry::Motion::Background::Component
    identifier: poetry--motion--background
    bem_block: poetry-motion-background
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: count
      type: integer
      default: 12
      description: How many meteors or rings the effect draws.
    - name: effect
      type: symbol
      variants:
      - none
      - aurora
      - meteors
      - retro_grid
      - ripple
      default: none
      description: 'The effect: none, aurora, meteors, retro_grid or ripple.'
    - name: fade
      type: symbol
      variants:
      - none
      - radial
      - bottom
      default: radial
      description: 'How the decoration fades: none, radial or bottom.'
    - name: pattern
      type: symbol
      variants:
      - none
      - grid
      - dots
      default: grid
      description: 'The pattern: none, grid or dots.'
    slots: []
    helper: poetry_background
    description: 'A decorative background in CSS alone: a grid or dot pattern, with
      aurora, meteors, a retro grid or ripples.'
    elements:
    - layer
    - content
    capsule: 672d8f1f94b7
    agent_rules:
    - 'Backgrounds are decoration: text on them still meets contrast, and the content
      stands on its own with the background removed.'
    - 'This is the CSS tier: a background that follows the pointer, draws on a canvas
      or runs a shader is not this component.'
    identity: false
    parts:
    - name: background
      description: The region; the decoration sits behind its content
      states:
      - attr: data-pattern
        condition: always - the pattern
        values:
        - none
        - grid
        - dots
      - attr: data-effect
        condition: always - the effect
        values:
        - none
        - aurora
        - meteors
        - retro_grid
        - ripple
      - attr: data-fade
        condition: always - the edge fade
        values:
        - none
        - radial
        - bottom
      - attr: data-animate
        condition: 'present as false when the effect is still (animate: false)'
    - name: background-layer
      description: The decoration behind the content, aria-hidden
    - name: background-particle
      description: One meteor or ring of the effect
      vars:
      - name: "--particle-index"
        description: its place among the effect's particles
      - name: "--particle-x"
        description: its horizontal start, in percent
      - name: "--particle-delay"
        description: its delay, in seconds
  poetry/motion/confetti:
    class_name: Poetry::Motion::Confetti::Component
    identifier: poetry--motion--confetti
    bem_block: poetry-motion-confetti
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
