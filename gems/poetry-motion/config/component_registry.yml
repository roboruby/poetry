# poetry component registry - generated by `bin/rake registry:generate` FROM SOURCE.
# DO NOT EDIT: CI verifies this file matches a fresh build (rake registry:verify).
---
components:
  poetry/motion/animated_list:
    class_name: Poetry::Motion::AnimatedList::Component
    identifier: poetry--motion--animated_list
    bem_block: poetry-motion-animated_list
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: as
      type: symbol
      variants:
      - ul
      - ol
      - div
      default: ul
      description: 'The element the list renders as: ul, ol or div.'
    - name: duration
      type:
      default: normal
      description: 'How long the motion runs: a duration token (fast, normal, slow)
        or milliseconds.'
    slots: []
    helper: poetry_animated_list
    description: 'A list whose Turbo Stream changes animate: new items fade in, removed
      ones fade out, the rest slide into place.'
    elements: []
    capsule: e6c7e56a6ff5
    controllers:
    - identifier: poetry--motion--animated-list
      targets: []
      values:
      - duration
      actions: []
      events: []
    agent_rules:
    - 'Give the list an id: and target it (or its items) with Turbo Streams; the streams
      animate, the server-rendered list is the finished state.'
    - Each direct child is one item. Keep item elements stable across renders so survivors
      slide instead of fading out and back in.
    requires_content: the list's items
    parts:
    - name: animated-list
      description: The list; its direct children are the items that enter, leave and
        move
      states:
      - attr: data-animated-list
        condition: always - the list's own key, which names its items in the transition
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--animated-list
        conditional: if animate
        registers: true
        values:
        - name: duration
    behaviors:
    - name: layout
      description: DOM changes animated as layout transitions, only when no Turbo
        visit holds the view-transition slot.
      runtime: true
  poetry/motion/layout_group:
    class_name: Poetry::Motion::LayoutGroup::Component
    identifier: poetry--motion--layout_group
    bem_block: poetry-motion-layout_group
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: duration
      type:
      default: normal
      description: 'How long the motion runs: a duration token (fast, normal, slow)
        or milliseconds.'
    slots: []
    helper: poetry_layout_group
    description: Elements that share a data-layout-id move as one thing between places,
      like an active-tab indicator.
    elements: []
    capsule: e6c7e56a6ff5
    controllers:
    - identifier: poetry--motion--layout-group
      targets: []
      values:
      - duration
      actions: []
      events: []
    agent_rules:
    - Effects are decoration; the server-rendered content stands alone and reads right
      with motion off.
    - No spring, pointer input, scroll link or interruption means a CSS keyframe,
      not poetry-motion.
    - 'Animate toward the server-rendered state: the last keyframe is the element''s
      own style.'
    - Show exactly one element per data-layout-id at a time; the group animates the
      newly visible one from the old one's box. Hide the others with display, never
      visibility or opacity.
    requires_content: the elements that carry data-layout-id
    identity: false
    parts:
    - name: layout-group
      description: The region whose data-layout-id elements move between places
    - name: layout-group-item
      description: One place a moving element can be; the visible one is current
      states:
      - attr: data-layout-id
        condition: always - the id every place of one moving element shares
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--layout-group
        conditional: if animate
        registers: true
        values:
        - name: duration
    behaviors:
    - name: animate
      description: One engine animation toward the element's server-rendered style;
        skipped under reduced motion and on return visits.
      runtime: true
  poetry/motion/marquee:
    class_name: Poetry::Motion::Marquee::Component
    identifier: poetry--motion--marquee
    bem_block: poetry-motion-marquee
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: direction
      type: symbol
      variants:
      - left
      - right
      - up
      - down
      default: left
      description: 'Which way the items travel: left, right, up or down.'
    - name: duration
      type: integer
      default: 40
      description: Seconds for one full loop.
    - name: label
      type: string
      description: The region's accessible name, such as "Our customers".
    - name: pausable
      type: boolean
      default: true
      description: Renders the pause control; required for a loop longer than five
        seconds.
    - name: pause_label
      type: string
      default: Pause
      description: The pause control's text.
    - name: repeat
      type: integer
      default: 2
      description: How many copies make the loop, the readable one included.
    slots: []
    helper: poetry_marquee
    description: Items that scroll in a loop, logos or testimonials, with a pause
      control; the loop is CSS.
    elements:
    - viewport
    - track
    - pause
    capsule: 2811ee3416f5
    controllers:
    - identifier: poetry--motion--marquee
      targets:
      - pause
      values:
      - paused
      actions:
      - pausedValueChanged
      - toggle
      events: []
    agent_rules:
    - 'Marquee items carry no ids and no focusable controls the reader needs: the
      loop copies them (aria-hidden and inert), and the readable first copy is what
      assistive tech gets.'
    - 'Keep pausable: true. A loop that moves for more than five seconds needs a pause
      control (WCAG 2.2.2); poetry check flags pausable: false.'
    requires_content: the items that scroll
    identity: false
    parts:
    - name: marquee
      description: The looping region - pauses on hover, on focus inside, and while
        data-paused is set
      states:
      - attr: data-direction
        condition: always - the travel direction
        values:
        - left
        - right
        - up
        - down
      - attr: data-paused
        condition: the pause control holds the loop still
      vars:
      - name: "--marquee-duration"
        description: seconds per loop (duration:)
      - name: "--marquee-gap"
        description: the space between items and between copies
    - name: marquee-viewport
      description: The clipped window the copies travel through
    - name: marquee-track
      description: One copy of the items; every copy after the first is aria-hidden
        and inert
    - name: marquee-pause
      description: The pause control, a toggle button (aria-pressed) under the loop
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--marquee
        registers: true
    - element: pause
      controllers:
      - identifier: poetry--motion--marquee
        targets:
        - name: pause
        actions:
        - method: toggle
          'on': click
  poetry/motion/number_ticker:
    class_name: Poetry::Motion::NumberTicker::Component
    identifier: poetry--motion--number_ticker
    bem_block: poetry-motion-number_ticker
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: delay
      type: integer
      default: 0
      description: Milliseconds to wait before the motion starts.
    - name: format
      type:
      description: Intl.NumberFormat options, camelCase keys (style, currency, minimumFractionDigits,
        maximumFractionDigits, notation).
    - name: from
      type: float
      default: 0
      description: Where the count starts.
    - name: locale
      type: string
      description: The locale the number is formatted for; the request's when blank.
    - name: spring
      type: symbol
      variants:
      - gentle
      - snappy
      - bouncy
      default: gentle
      description: 'The spring token: gentle, snappy, bouncy.'
    - name: trigger
      type: symbol
      variants:
      - load
      - in_view
      default: in_view
      description: 'When the motion starts: load, in_view.'
    - name: value
      type: float
      required: true
      description: The final number.
    slots: []
    helper: poetry_number_ticker
    description: A number that counts up to its server-rendered value when it comes
      into view.
    elements:
    - reader
    - display
    capsule: a2db4a90fba1
    controllers:
    - identifier: poetry--motion--number-ticker
      targets:
      - display
      values:
      - animate
      - delay
      - format
      - from
      - locale
      - spring
      - trigger
      - value
      actions: []
      events: []
    agent_rules:
    - Effects are decoration; the server-rendered content stands alone and reads right
      with motion off.
    - No spring, pointer input, scroll link or interruption means a CSS keyframe,
      not poetry-motion.
    - 'Animate toward the server-rendered state: the last keyframe is the element''s
      own style.'
    - The value is the real number, rendered by the server; never put a placeholder
      there and let the count fill it in.
    - 'format: takes Intl.NumberFormat options (style, currency, minimumFractionDigits,
      ...); the server formats the same number the browser counts to.'
    identity: false
    parts:
    - name: number-ticker
      description: The number; the count runs in the aria-hidden display
    - name: number-ticker-display
      description: The visible digits, counted up by the controller and restored to
        the server's text when the count lands
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--number-ticker
        registers: true
        values:
        - name: value
        - name: from
        - name: locale
          conditional: if
        - name: format
          conditional: if
        - name: spring
        - name: trigger
        - name: delay
          conditional: if
        - name: animate
          conditional: unless animate
    - element: display
      controllers:
      - identifier: poetry--motion--number-ticker
        targets:
        - name: display
    behaviors:
    - name: animate
      description: One engine animation toward the element's server-rendered style;
        skipped under reduced motion and on return visits.
      runtime: true
    - name: spring
      description: A value that springs to each new target and is retargeted without
        a jump.
      runtime: true
  poetry/motion/shared_element:
    class_name: Poetry::Motion::SharedElement::Component
    identifier: poetry--motion--shared_element
    bem_block: poetry-motion-shared_element
    styles: []
    options:
    - name: as
      type: symbol
      default: div
      description: The element it renders as.
    - name: name
      type: string
      required: true
      description: The view-transition name both pages give the element.
    slots: []
    helper: poetry_shared_element
    description: An element a Turbo visit morphs from one page to the next, like a
      card into its detail page.
    elements: []
    capsule: 42e5df339fc2
    agent_rules:
    - 'Use one name per element per page: two elements with the same name on one page
      cancel the transition. Build names from the record, such as product-42.'
    - Shared elements need <meta name="view-transition" content="same-origin"> in
      the layout; without it the visit swaps the page with no morph.
    requires_content: the element both pages share
    identity: false
    parts:
    - name: shared-element
      description: The element the visit morphs between pages; carries view-transition-name
  poetry/motion/text_reveal:
    class_name: Poetry::Motion::TextReveal::Component
    identifier: poetry--motion--text_reveal
    bem_block: poetry-motion-text_reveal
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: tag
      type: symbol
      variants:
      - p
      - h1
      - h2
      - h3
      - h4
      - blockquote
      - div
      default: p
      description: The element the passage renders as.
    - name: text
      type: string
      required: true
      description: The passage, plain text.
    slots: []
    helper: poetry_text_reveal
    description: A short passage whose words brighten one after another as it scrolls
      into view.
    elements:
    - reader
    capsule: e3691c545d14
    controllers:
    - identifier: poetry--motion--text-reveal
      targets: []
      values: []
      actions: []
      events: []
    agent_rules:
    - 'Text reveal is for a short passage of plain text (a statement, a quote), never
      body copy, links or form labels: the words are rebuilt as spans.'
    - Words not yet revealed are dimmed below text contrast on purpose; readers get
      the whole passage from its hidden copy, and nothing the page needs may live
      only in a reveal.
    identity: false
    parts:
    - name: text-reveal
      description: The passage; --reveal-progress (0 to 1) brightens its words
      vars:
      - name: "--reveal-progress"
        description: how far the reveal has come, 1 when finished
      - name: "--reveal-count"
        description: how many words the passage has
    - name: text-reveal-word
      description: One word, aria-hidden; its opacity follows the progress
      vars:
      - name: "--word-index"
        description: the word's position
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--text-reveal
        conditional: if animate
        registers: true
    behaviors:
    - name: scroll_value
      description: Progress from 0 to 1 tied to scrolling; the finished state under
        reduced motion.
      runtime: true
  poetry/motion/tilt_card:
    class_name: Poetry::Motion::TiltCard::Component
    identifier: poetry--motion--tilt_card
    bem_block: poetry-motion-tilt_card
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: max
      type: integer
      default: 8
      description: The largest lean, in degrees.
    - name: spring
      type: symbol
      variants:
      - gentle
      - snappy
      - bouncy
      default: snappy
      description: 'The spring token: gentle, snappy, bouncy.'
    slots: []
    helper: poetry_tilt_card
    description: A surface that leans toward a fine pointer and springs back flat.
    elements:
    - layer
    capsule: a392f2a7b891
    controllers:
    - identifier: poetry--motion--tilt-card
      targets:
      - layer
      values:
      - animate
      - max
      - spring
      actions: []
      events: []
    agent_rules:
    - Pointer effects never move focus and never carry information a keyboard user
      would miss.
    - 'Never put a popover, menu, select, combobox, tooltip or hover card trigger
      inside a tilt card: the tilted layer becomes the containing block for their
      fixed-position panels. poetry check flags it.'
    - 'The lean is decoration: nothing on the card may depend on it, and the card
      reads the same flat.'
    requires_content: the surface that tilts, a card most often
    identity: false
    parts:
    - name: tilt-card
      description: The perspective wrapper; never transformed itself
    - name: tilt-card-layer
      description: The layer that leans
      vars:
      - name: "--tilt-x"
        description: the lean around the vertical axis, in degrees
      - name: "--tilt-y"
        description: the lean around the horizontal axis, in degrees
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--tilt-card
        registers: true
        values:
        - name: max
        - name: spring
        - name: animate
          conditional: unless animate
    - element: layer
      controllers:
      - identifier: poetry--motion--tilt-card
        targets:
        - name: layer
    behaviors:
    - name: pointer
      description: The pointer's position over the element, once a frame; fine pointers
        only, inert under reduced motion.
      runtime: true
    - name: spring
      description: A value that springs to each new target and is retargeted without
        a jump.
      runtime: true
helper_args:
  poetry_animated_list: 0
  poetry_layout_group: 0
  poetry_marquee: 0
  poetry_number_ticker: 0
  poetry_shared_element: 0
  poetry_text_reveal: 1
  poetry_tilt_card: 0
