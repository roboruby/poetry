    - name: count
      type: integer
      default: 120
      description: How many pieces per burst.
    - name: spread
      type: integer
      default: 70
      description: The burst's spread, in degrees.
    - name: trigger
      type: symbol
      variants:
      - click
      - load
      default: click
      description: 'When the motion starts: click, load.'
    slots: []
    helper: poetry_confetti
    description: A burst of confetti over the page from a click, or once when a success
      message renders.
    elements:
    - canvas
    capsule: 38523fd03fdf
    controllers:
    - identifier: poetry--motion--confetti
      targets:
      - canvas
      values:
      - count
      - spread
      - trigger
      actions: []
      events: []
    agent_rules:
    - 'Confetti celebrates a moment the user caused - a finished task, a purchase.
      It never carries the message: say what happened in text, and let the confetti
      decorate it.'
    identity: false
    parts:
    - name: confetti
      description: The control the burst comes from, or the moment it marks
    - name: confetti-canvas
      description: The full-viewport, aria-hidden canvas the pieces fly on
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--confetti
        conditional: if animate
        registers: true
        values:
        - name: trigger
        - name: count
        - name: spread
    - element: canvas
      controllers:
      - identifier: poetry--motion--confetti
        conditional: if animate
        targets:
        - name: canvas
    behaviors:
    - name: canvas
      description: A canvas sized to its box at the pixel ratio, drawn every visible
        frame; one static frame under reduced motion.
      runtime: true
  poetry/motion/dock:
    class_name: Poetry::Motion::Dock::Component
    identifier: poetry--motion--dock
    bem_block: poetry-motion-dock
    styles: []
    options:
    - name: animate
      type: boolean
      default: true
      description: Turns the motion off; the effect renders its finished state either
        way.
    - name: distance
      type: integer
      default: 120
      description: How far, in pixels, the swell reaches from the pointer.
    - name: label
      type: string
      description: The navigation's accessible name.
    - name: magnification
      type: float
      default: 1.5
      description: The scale of the item right under the pointer.
    - name: orientation
      type: symbol
      variants:
      - horizontal
      - vertical
      default: horizontal
      description: Which way the dock runs.
    - name: spring
      type: symbol
      variants:
      - gentle
      - snappy
      - bouncy
      default: snappy
      description: 'The spring token: gentle, snappy, bouncy.'
    slots: []
    helper: poetry_dock
    description: A row of links or buttons that swell toward the pointer, the nearest
      most, like a launcher.
    elements: []
    capsule: 81a83f3be781
    controllers:
    - identifier: poetry--motion--dock
      targets: []
      values:
      - distance
      - magnification
      - spring
      actions: []
      events: []
    agent_rules:
    - Pointer effects never move focus and never carry information a keyboard user
      would miss.
    - Each item is a real link or button with an accessible name; the swell is decoration
      and the dock works the same without it.
    - 'Leave room around the dock for the swell: items scale past their box without
      moving others.'
    requires_content: the items, each a direct child
    identity: false
    parts:
    - name: dock
      description: The row of items; the swell reaches across it
      states:
      - attr: data-orientation
        condition: always - which way the dock runs
        values:
        - horizontal
        - vertical
    stimulus:
    - element: root
      controllers:
      - identifier: poetry--motion--dock
        conditional: if animate
        registers: true
        values:
        - name: magnification
        - name: distance
        - name: spring
    behaviors:
    - name: pointer
      description: The pointer's position over the element, once a frame; fine pointers
        only, inert under reduced motion.
      runtime: true
    - name: spring
      description: A value that springs to each new target and is retargeted without
        a jump.
      runtime: true
