name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same branch or PR cancels the in-flight run for that
# ref, so minutes never go to commits already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every gem's default rake chain from its own directory and bundle, on both
  # supported Rubies. Siblings resolve from the tree, never from RubyGems.
  ruby:
    name: ${{ matrix.gem.name }} on Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4"
          - "4.0"
        # npm names the package a chain needs installed: charts runs its own
        # JavaScript through dommy, and ui's goldens and Stimulus checks read
        # core's package beside it (absent, the goldens manifest reads as
        # changed; in the old split repositories the sibling was simply not
        # there and the checks skipped).
        gem:
          - { name: poetry-core, dir: gems/poetry-core }
          - { name: poetry-lucide, dir: gems/poetry-lucide }
          - { name: poetry-charts, dir: gems/poetry-charts, npm: gems/poetry-charts }
          - { name: poetry-extract, dir: gems/poetry-extract }
          - { name: poetry-ui, dir: gems/poetry-ui, npm: gems/poetry-core }
          - { name: poetry-agent, dir: gems/poetry-agent }
          - { name: poetry-simple_form, dir: gems/poetry-simple_form }
          - { name: poetry, dir: "." }
    defaults:
      run:
        working-directory: ${{ matrix.gem.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ matrix.gem.dir }}
      - name: Set up Node
        if: matrix.gem.npm
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.gem.npm }}/package-lock.json
      - name: Install the package the chain reads
        if: matrix.gem.npm
        working-directory: ${{ matrix.gem.npm }}
        run: npm ci
      - name: Run the default task
        run: bundle exec rake

  javascript:
    name: JavaScript (${{ matrix.gem.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem:
          - { name: poetry-core, dir: gems/poetry-core }
          - { name: poetry-charts, dir: gems/poetry-charts }
          - { name: poetry-agent, dir: gems/poetry-agent }
    defaults:
      run:
        working-directory: ${{ matrix.gem.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.gem.dir }}/package-lock.json
      - run: npm ci
      - run: npm test

  herb:
    name: Herb lint (${{ matrix.gem.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem:
          - { name: poetry-core, dir: gems/poetry-core, paths: app }
          - { name: poetry-charts, dir: gems/poetry-charts, paths: app }
          - { name: poetry-ui, dir: gems/poetry-ui, paths: app lib/generators }
    defaults:
      run:
        working-directory: ${{ matrix.gem.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Lint HTML+ERB templates (.herb.yml pins the linter version and rules)
        run: npx --yes @herb-tools/linter@0.10.3 ${{ matrix.gem.paths }}

  audit:
    name: bundle audit (${{ matrix.gem.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem:
          - { name: poetry-core, dir: gems/poetry-core }
          - { name: poetry-lucide, dir: gems/poetry-lucide }
          - { name: poetry-charts, dir: gems/poetry-charts }
          - { name: poetry-extract, dir: gems/poetry-extract }
          - { name: poetry-ui, dir: gems/poetry-ui }
          - { name: poetry-agent, dir: gems/poetry-agent }
          - { name: poetry-simple_form, dir: gems/poetry-simple_form }
          - { name: poetry, dir: "." }
    defaults:
      run:
        working-directory: ${{ matrix.gem.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ${{ matrix.gem.dir }}
      - name: Audit dependencies for known CVEs
        run: bundle exec bundle-audit check --update

  # The site on the family from the tree: setup, rubocop, audits, tests.
  site:
    name: Site (bin/ci)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: site
      - name: Run the CI pipeline (setup, rubocop, audits, tests)
        run: bin/ci

  # The committed reference data (API reference, skill, search index) must
  # match the tree it documents; this replaces the release-time refresh.
  reference-fresh:
    name: Reference data is fresh
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: site
      - name: Install each gem's own bundle (the reference export runs inside it)
        run: |
          for gem in poetry-core poetry-ui poetry-charts poetry-agent poetry-simple_form poetry-extract; do
            (cd "../gems/$gem" && bundle install --quiet)
          done
      - name: Prepare the site
        run: bin/setup --skip-server
      - name: Regenerate the reference data
        run: bin/rails docs:refresh
      - name: Nothing changed
        run: git diff --exit-code --stat

  releaser:
    name: Releaser tests and a build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/releaser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: tools/releaser
      - name: Releaser tests
        run: bundle exec rake test
      - name: Build all eight gems
        run: bundle exec rake build checksums

  # One status for branch rules: green only when every job above is.
  all-green:
    name: All green
    if: always()
    needs: [ruby, javascript, herb, audit, site, reference-fresh, releaser]
    runs-on: ubuntu-latest
    steps:
      - name: A job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all green"
