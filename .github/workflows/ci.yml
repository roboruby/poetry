name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Once a week on main. The gems keep no lockfile, so a new release of any
  # tool in a bundle can break a chain with no commit here; without this run
  # the break waits for the next push to be seen.
  schedule:
    - cron: "23 6 * * 1"

# A newer push to the same branch or PR cancels the in-flight run for that
# ref, so minutes never go to commits already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every gem's default rake chain from its own directory and bundle, on both
  # supported Rubies. Siblings resolve from the tree, never from RubyGems.
  ruby:
    name: ${{ matrix.gem.name }} on Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4"
          - "4.0"
        # npm names the package a chain needs installed: charts runs its own
        # JavaScript through dommy, and ui's goldens and Stimulus checks read
        # core's package beside it (absent, the goldens manifest reads as
        # changed; in the old split repositories the sibling was simply not
        # there and the checks skipped).
        gem:
          - { name: poetry-core, dir: gems/poetry-core }
          - { name: poetry-lucide, dir: gems/poetry-lucide }
          - { name: poetry-charts, dir: gems/poetry-charts, npm: gems/poetry-charts }
          - { name: poetry-extract, dir: gems/poetry-extract }
          - { name: poetry-ui, dir: gems/poetry-ui, npm: gems/poetry-core }
          - { name: poetry-agent, dir: gems/poetry-agent }
          - { name: poetry-simple_form, dir: gems/poetry-simple_form }
          - { name: poetry, dir: "." }
    defaults:
      run:
        working-directory: ${{ matrix.gem.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ matrix.gem.dir }}
      - name: Set up Node
        if: matrix.gem.npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.gem.npm }}/package-lock.json
      - name: Install the package the chain reads
        if: matrix.gem.npm
        working-directory: ${{ matrix.gem.npm }}
        run: npm ci
      - name: Run the default task
        run: bundle exec rake

  javascript:
    name: JavaScript (${{ matrix.gem.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem:
          - { name: poetry-core, dir: gems/poetry-core }
          - { name: poetry-charts, dir: gems/poetry-charts }
          - { name: poetry-agent, dir: gems/poetry-agent }
    defaults:
      run:
        working-directory: ${{ matrix.gem.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.gem.dir }}/package-lock.json
      - run: npm ci
      - run: npm test

  herb:
    name: Herb lint (${{ matrix.gem.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem:
          - { name: poetry-core, dir: gems/poetry-core, paths: app }
          - { name: poetry-charts, dir: gems/poetry-charts, paths: app }
          - { name: poetry-ui, dir: gems/poetry-ui, paths: app lib/generators }
          - { name: site, dir: site, paths: app }
    defaults:
      run:
        working-directory: ${{ matrix.gem.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Lint HTML+ERB templates (.herb.yml pins the linter version and rules)
        run: |
          version="$(sed -n 's/^version: //p' .herb.yml)"
          npx --yes "@herb-tools/linter@${version}" ${{ matrix.gem.paths }}

  # The suite and the behaviour tier again, in a host that compiles every
  # template through ReActionView: as the engine alone, then with slots in
  # server mode, then in client mode. A component has to render the same in
  # all three as it does in a plain Rails host.
  reactionview:
    name: ReActionView ${{ matrix.mode }} (${{ matrix.gem.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - engine
          - server
          - client
        gem:
          - { name: poetry-charts, dir: gems/poetry-charts, npm: gems/poetry-charts }
          - { name: poetry-ui, dir: gems/poetry-ui, npm: gems/poetry-core }
    defaults:
      run:
        working-directory: ${{ matrix.gem.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ${{ matrix.gem.dir }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.gem.npm }}/package-lock.json
      - name: Install the package the behaviour tier reads
        working-directory: ${{ matrix.gem.npm }}
        run: npm ci
      - name: Run the suite and the behaviour tier under ReActionView
        env:
          POETRY_REACTIONVIEW_MODES: ${{ matrix.mode }}
        run: bundle exec rake test:reactionview

  # The suites on the Rails that comes next, in a host that compiles its HTML
  # templates through Herb the way an app on the next framework defaults
  # does. What breaks there is known here before a release carries it to a
  # host. Rails main can break for reasons of its own, so these jobs report
  # and never block: a failure leaves the run green, and they are no part of
  # the one status at the end.
  rails-main:
    name: Rails main (${{ matrix.gem.name }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        gem:
          - { name: poetry-charts, dir: gems/poetry-charts, npm: gems/poetry-charts }
          - { name: poetry-ui, dir: gems/poetry-ui, npm: gems/poetry-core }
    defaults:
      run:
        working-directory: ${{ matrix.gem.dir }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gem.dir }}/gemfiles/rails_main.gemfile
      COVERAGE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ${{ matrix.gem.dir }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.gem.npm }}/package-lock.json
      - name: Install the package the behaviour tier reads
        working-directory: ${{ matrix.gem.npm }}
        run: npm ci
      - name: Run the suite and the behaviour tier on Rails main
        run: bundle exec rake test test:dommy

  # The site the same way, on the next release's framework defaults. Its
  # bundle starts from the committed lock, so Rails is what moves.
  rails-main-site:
    name: Rails main (site)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: site
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/site/gemfiles/rails_main.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: .ruby-version
          working-directory: site
      - name: Resolve the bundle from the committed lock
        run: |
          cp Gemfile.lock gemfiles/rails_main.gemfile.lock
          bundle install --jobs 4
      - name: Prepare the site
        run: bin/setup --skip-server
      - name: Run the tests on Rails main
        run: bin/rails test

  audit:
    name: bundle audit (${{ matrix.gem.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem:
          - { name: poetry-core, dir: gems/poetry-core }
          - { name: poetry-lucide, dir: gems/poetry-lucide }
          - { name: poetry-charts, dir: gems/poetry-charts }
          - { name: poetry-extract, dir: gems/poetry-extract }
          - { name: poetry-ui, dir: gems/poetry-ui }
          - { name: poetry-agent, dir: gems/poetry-agent }
          - { name: poetry-simple_form, dir: gems/poetry-simple_form }
          - { name: poetry, dir: "." }
    defaults:
      run:
        working-directory: ${{ matrix.gem.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ${{ matrix.gem.dir }}
      - name: Audit dependencies for known CVEs
        run: bundle exec bundle-audit check --update

  # The site on the family from the tree: setup, rubocop, audits, tests.
  site:
    name: Site (bin/ci)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: site
      - name: Run the CI pipeline (setup, rubocop, audits, tests)
        run: bin/ci

  # The committed reference data (API reference, skill, search index) must
  # match the tree it documents; this replaces the release-time refresh.
  reference-fresh:
    name: Reference data is fresh
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: site
      - name: Install each gem's own bundle (the reference export runs inside it)
        run: |
          for gem in poetry-core poetry-ui poetry-charts poetry-agent poetry-simple_form poetry-extract; do
            (cd "../gems/$gem" && bundle install --quiet)
          done
      - name: Prepare the site
        run: bin/setup --skip-server
      - name: Regenerate the reference data
        run: bin/rails docs:refresh
      - name: Nothing changed
        run: git diff --exit-code --stat

  releaser:
    name: Releaser tests and a build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/releaser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: tools/releaser
      - name: Releaser tests
        run: bundle exec rake test
      - name: Build all eight gems
        run: bundle exec rake build checksums

  # One status for branch rules: green only when every job above is.
  all-green:
    name: All green
    if: always()
    needs: [ruby, javascript, herb, reactionview, audit, site, reference-fresh, releaser]
    runs-on: ubuntu-latest
    steps:
      - name: A job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all green"
