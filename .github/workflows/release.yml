name: Release

# Publishing the GitHub release is the word. The tagged, CI-green commit is
# built, signed and verified, and only then pushed to RubyGems with one trusted
# publishing credential for every gem. A manual dispatch on a v* tag is
# always a dry run: it builds, signs and verifies exactly as a release does,
# and never exchanges a credential or pushes, whatever its inputs. A release
# interrupted between pushes is resumed by re-running this run; the push is
# idempotent.
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ github.event_name == 'release' && 'Publish to RubyGems' || 'Dry run (build, sign, verify)' }}
    runs-on: ubuntu-latest
    environment: rubygems.org # must match the rubygems.org trusted publisher entries
    permissions:
      contents: read # the job creates neither tag nor release
      id-token: write # sigstore signing and, on a release, the RubyGems exchange
    defaults:
      run:
        working-directory: tools/releaser
    env:
      REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # verify_tag needs main
          persist-credentials: false
      - name: Set up Ruby (the releaser's own bundle)
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: tools/releaser
      - name: The tag names VERSION and sits on main
        run: bundle exec rake verify_tag
      - name: Set up Node (the minifier)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install the minifier (esbuild, pinned by its lockfile, no install scripts)
        working-directory: tools/minifier
        run: npm ci --ignore-scripts
      - name: Build every gem from the tag's commit time, their JavaScript minified
        run: bundle exec rake build checksums
      - name: Build again and compare, byte for byte
        run: bundle exec rake reproducible
      - name: Sign every gem with this workflow's identity
        run: bundle exec rake sign
      - name: Verify every bundle against this workflow's identity
        run: bundle exec rake verify
      - name: Checksums to the job summary
        run: cat ../../pkg/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Configure RubyGems credentials (trusted publishing)
        if: github.event_name == 'release'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push every gem, then wait until each one installs
        if: github.event_name == 'release'
        run: bundle exec rake push
