version: 2
updates:
  # The actions are pinned by commit; Dependabot moves the pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The release bundle: a sigstore or json bump arrives as a PR that the
  # releaser's tests gate before it can touch a release.
  - package-ecosystem: bundler
    directory: /tools/releaser
    schedule:
      interval: weekly
    ignore:
      # sigstore 0.2.3 parses its trust root through protobug with options json
      # 3.0 dropped; the checked-in verification fixture fails the bump. Lift
      # this, and ship the bump, once sigstore-ruby supports json 3.
      - dependency-name: json
        versions:
          - ">= 3"
